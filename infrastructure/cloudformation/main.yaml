AWSTemplateFormatVersion: "2010-09-09"

# ============================================================
# HYBRID TERRAFORM + CLOUDFORMATION AWS DEVOPS LAB
# ============================================================
#
# File:
#   infrastructure/cloudformation/main.yaml
#
# Purpose:
#   Root CloudFormation bootstrap stack for the Hybrid
#   Terraform + CloudFormation AWS DevOps Lab.
#
# Architecture:
#
#   External IaC / CI/CD tooling
#       |
#       +-- Template Bucket
#       |
#       +-- Root CloudFormation Stack
#               |
#               +-- VPC
#               +-- S3
#               +-- DynamoDB
#               +-- ECR
#               +-- Lambda
#               +-- API Gateway
#               +-- CloudFront
#               +-- EC2
#               +-- EKS
#               +-- RDS
#
#
# ============================================================
# IMPORTANT DEPLOYMENT ARCHITECTURE
# ============================================================
#
# This root stack is responsible for BOOTSTRAP / INFRASTRUCTURE.
#
# The ECR repository is created here.
#
# The Docker image is NOT created here.
#
# The Docker image lifecycle is handled by GitHub Actions:
#
#   1. Terraform creates the infrastructure.
#   2. CloudFormation creates the ECR repository.
#   3. GitHub Actions builds the Docker image.
#   4. GitHub Actions pushes the image to ECR.
#   5. GitHub Actions deploys/updates ECS using that image.
#
# This separation is intentional.
#
# A standard CloudFormation ECR repository resource creates
# the repository but does not build or push Docker images.
#
# Therefore:
#
#   ECR repository creation
#       |
#       +--> Bootstrap / Infrastructure phase
#
#   Docker image build + push
#       |
#       +--> CI/CD application phase
#
#   ECS service deployment
#       |
#       +--> CI/CD application phase
#
# The ECS nested stack is intentionally NOT created by this
# bootstrap stack.
#
# This prevents the following dependency problem:
#
#   Terraform
#       |
#       +--> CloudFormation
#               |
#               +--> ECR repository
#               |
#               +--> ECS service
#                       |
#                       +--> requires Docker image
#
# At this point the Docker image does not exist yet because the
# Docker workflow runs AFTER the Terraform workflow.
#
# Therefore ECS deployment is performed later by CI/CD after
# the Docker image has been successfully pushed to ECR.
#
# ============================================================
# IMPORTANT NESTED-STACK OUTPUT RULE
# ============================================================
#
# Nested CloudFormation stacks create their own resources.
#
# Therefore the root stack should NOT require Terraform to
# provide IDs/ARNs for resources that are created by these
# nested stacks.
#
# Example:
#
#   VPCStack creates VPC
#       |
#       +--> VpcId output
#       |
#       +--> EC2 / EKS / RDS
#
#   S3Stack creates application bucket
#       |
#       +--> BucketName output
#       |
#       +--> CloudFront
#
#   LambdaStack creates Lambda
#       |
#       +--> LambdaFunctionArn output
#       |
#       +--> API Gateway
#
#   ECRStack creates ECR repository
#       |
#       +--> RepositoryUri output
#       |
#       +--> GitHub Actions Docker workflow
#
# ============================================================
# ECS DEPLOYMENT NOTE
# ============================================================
#
# ECS is deliberately excluded from this root bootstrap stack.
#
# The Docker workflow will deploy ECS after the image has been
# pushed successfully.
#
# The ECS workflow should use an immutable image tag such as:
#
#   ${GITHUB_SHA}
#
# Example:
#
#   537236558357.dkr.ecr.us-east-1.amazonaws.com/
#   hybridiaclab-dev-app:<commit-sha>
#
# Use an immutable image tag such as the Git commit SHA
# for deployment rather than relying on a mutable tag such
# as "latest".
#
# We should NOT depend on the "latest" tag for deployment.
#
# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # Project name
  # ----------------------------------------------------------
  #
  # Passed to nested stacks for project-specific resource
  # naming, tagging, and configuration.
  #
  # Example:
  #
  #   hybridiaclab
  #
  # ----------------------------------------------------------

  ProjectName:
    Type: String
    Default: hybridiaclab
    Description: Project/lab name used for resource naming and tags.

  # ----------------------------------------------------------
  # Environment
  # ----------------------------------------------------------
  #
  # Identifies the deployment environment.
  #
  # ----------------------------------------------------------

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - staging
      - prod
    Description: Deployment environment.

  # ----------------------------------------------------------
  # Terraform-managed CloudFormation template bucket
  # ----------------------------------------------------------
  #
  # Terraform creates this S3 bucket.
  #
  # CloudFormation uses this bucket to download:
  #
  #   main.yaml
  #   nested/vpc.yaml
  #   nested/s3.yaml
  #   nested/dynamodb.yaml
  #   nested/ecr.yaml
  #   nested/lambda.yaml
  #   nested/api-gateway.yaml
  #   nested/cloudfront.yaml
  #   nested/ec2.yaml
  #   nested/eks.yaml
  #   nested/rds.yaml
  #
  # ----------------------------------------------------------

  TemplateBucket:
    Type: String
    Description: S3 bucket containing CloudFormation templates.

  # ----------------------------------------------------------
  # Optional template prefix
  # ----------------------------------------------------------
  #
  # Allows templates to be stored under an optional directory
  # prefix inside the template bucket.
  #
  # Example:
  #
  #   templates/
  #
  # ----------------------------------------------------------

  TemplatePrefix:
    Type: String
    Default: ""
    Description: Optional prefix/path inside the template bucket.

  # ----------------------------------------------------------
  # Amazon Linux 2023 AMI
  # ----------------------------------------------------------
  #
  # This AMI is not created by this CloudFormation stack.
  #
  # Therefore AmiId remains a legitimate external input.
  #
  # The AMI ID is supplied externally to this root stack.
  #
  # The caller is responsible for providing an AMI ID that is
  # valid for the target AWS region.
  #
  # ----------------------------------------------------------

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Amazon Linux 2023 AMI ID supplied externally for the target AWS region.

  # ----------------------------------------------------------
  # EC2 instance type
  # ----------------------------------------------------------
  #
  # Controls the EC2 instance size used by the EC2 nested stack.
  #
  # ----------------------------------------------------------

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
    Description: EC2 instance type.

  # ----------------------------------------------------------
  # Database username
  # ----------------------------------------------------------
  #
  # Administrator username supplied to the RDS nested stack.
  #
  # The database password is not supplied by this root stack.
  # Password management is handled by the RDS nested stack.
  #
  # NoEcho prevents the value from being displayed in
  # CloudFormation console/API outputs.
  #
  # ----------------------------------------------------------

  DatabaseUsername:
    Type: String
    Default: admin
    NoEcho: true
    Description: RDS database administrator username.


# ============================================================
# CONDITIONS
# ============================================================
#
# Determines whether TemplatePrefix contains a value.
#
# If TemplatePrefix is empty:
#
#   HasTemplatePrefix = false
#
# Result:
#
#   s3://bucket/nested/vpc.yaml
#
# If TemplatePrefix is "templates":
#
#   HasTemplatePrefix = true
#
# Result:
#
#   s3://bucket/templates/nested/vpc.yaml
#
# ============================================================

Conditions:

  HasTemplatePrefix: !Not
    - !Equals
        - !Ref TemplatePrefix
        - ""

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # 1. VPC NESTED STACK
  # ==========================================================
  #
  # Creates:
  #
  #   - VPC
  #   - Internet Gateway
  #   - Public Subnet 1
  #   - Public Subnet 2
  #   - Private Subnet 1
  #   - Private Subnet 2
  #   - Public Route Table
  #
  # The VPC is created by this nested stack.
  #
  # Other nested stacks consume the VPC outputs directly.
  #
  # We do NOT pass VpcId from Terraform.
  #
  # ----------------------------------------------------------

  VPCStack:
    Type: AWS::CloudFormation::Stack

    Properties:
      TemplateURL: !Sub
        - "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}nested/vpc.yaml"
        - Prefix: !If
            - HasTemplatePrefix
            - !Sub "${TemplatePrefix}/"
            - ""

      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

  # ==========================================================
  # 2. S3 NESTED STACK
  # ==========================================================
  #
  # Creates the application/static-content S3 bucket.
  #
  # The bucket name is generated by the S3 nested stack.
  #
  # CloudFront consumes the bucket name through the nested
  # stack output.
  #
  # Terraform does NOT need to provide ApplicationBucketName.
  #
  # ----------------------------------------------------------

  S3Stack:
    Type: AWS::CloudFormation::Stack

    Properties:
      TemplateURL: !Sub
        - "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}nested/s3.yaml"
        - Prefix: !If
            - HasTemplatePrefix
            - !Sub "${TemplatePrefix}/"
            - ""

      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

  # ==========================================================
  # 3. DYNAMODB NESTED STACK
  # ==========================================================
  #
  # Creates the DynamoDB table used by the application.
  #
  # ----------------------------------------------------------

  DynamoDBStack:
    Type: AWS::CloudFormation::Stack

    Properties:
      TemplateURL: !Sub
        - "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}nested/dynamodb.yaml"
        - Prefix: !If
            - HasTemplatePrefix
            - !Sub "${TemplatePrefix}/"
            - ""

      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

  # ==========================================================
  # 4. ECR NESTED STACK
  # ==========================================================
  #
  # Creates the Amazon ECR repository.
  #
  # IMPORTANT:
  #
  # This stack creates ONLY the ECR repository.
  #
  # It does NOT build a Docker image.
  #
  # It does NOT push a Docker image.
  #
  # GitHub Actions is responsible for:
  #
  #   - Building the Docker image
  #   - Tagging the image
  #   - Pushing the image to ECR
  #
  # The repository URI is exported by this root stack so that
  # CI/CD can discover the repository created by infrastructure.
  #
  # ----------------------------------------------------------

  ECRStack:
    Type: AWS::CloudFormation::Stack

    Properties:
      TemplateURL: !Sub
        - "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}nested/ecr.yaml"
        - Prefix: !If
            - HasTemplatePrefix
            - !Sub "${TemplatePrefix}/"
            - ""

      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

  # ==========================================================
  # 5. LAMBDA NESTED STACK
  # ==========================================================
  #
  # Creates the Lambda function.
  #
  # API Gateway consumes the Lambda ARN produced by this
  # nested stack.
  #
  # ----------------------------------------------------------

  LambdaStack:
    Type: AWS::CloudFormation::Stack

    Properties:
      TemplateURL: !Sub
        - "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}nested/lambda.yaml"
        - Prefix: !If
            - HasTemplatePrefix
            - !Sub "${TemplatePrefix}/"
            - ""

      Parameters:
      
        # ----------------------------------------------------------
        # Project Name
        # ----------------------------------------------------------
        # Passes the project name from the parent CloudFormation
        # stack to the nested/child stack.
        #
        # This keeps resource naming and tagging consistent across
        # the Hybrid IaC AWS DevOps Lab.
        # ----------------------------------------------------------
        ProjectName: !Ref ProjectName

        # ----------------------------------------------------------
        # Environment
        # ----------------------------------------------------------
        # Passes the deployment environment from the parent
        # CloudFormation stack to the nested/child stack.
        #
        # This allows resources to identify the environment in
        # which they are deployed, such as dev, test, or prod.
        # ----------------------------------------------------------
        Environment: !Ref Environment

        OrdersTableName:
          # ----------------------------------------------------------
          # DynamoDB Orders Table Name
          # ----------------------------------------------------------
          # Retrieves the Orders table name exported as an output
          # by the DynamoDB nested stack.
          #
          # The value is passed to the consuming Lambda/application
          # stack so the application knows which DynamoDB table to use.
          # ----------------------------------------------------------
          !GetAtt DynamoDBStack.Outputs.OrdersTableName

        OrdersTableArn:
          # ----------------------------------------------------------
          # DynamoDB Orders Table ARN
          # ----------------------------------------------------------
          # Retrieves the Orders table ARN from the DynamoDB nested
          # stack output.
          #
          # The ARN is passed to the consuming stack so that Lambda
          # IAM permissions can be restricted to the specific Orders
          # table instead of granting access to all DynamoDB tables.
          # ----------------------------------------------------------
          !GetAtt DynamoDBStack.Outputs.OrdersTableArn

  # ==========================================================
  # 6. API GATEWAY NESTED STACK
  # ==========================================================
  #
  # LambdaFunctionArn comes directly from LambdaStack.
  #
  # We do NOT require Terraform to provide the Lambda ARN.
  #
  # Dependency:
  #
  #   LambdaStack
  #       |
  #       +--> LambdaFunctionArn
  #               |
  #               +--> APIGatewayStack
  #
  # ----------------------------------------------------------

  APIGatewayStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - LambdaStack

    Properties:
      TemplateURL: !Sub
        - "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}nested/api-gateway.yaml"
        - Prefix: !If
            - HasTemplatePrefix
            - !Sub "${TemplatePrefix}/"
            - ""

      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

        # ----------------------------------------------------
        # Consume Lambda nested-stack output.
        # ----------------------------------------------------

        LambdaFunctionArn: !GetAtt LambdaStack.Outputs.LambdaFunctionArn

  # ==========================================================
  # 7. CLOUDFRONT NESTED STACK
  # ==========================================================
  #
  # ApplicationBucketName comes directly from S3Stack.
  #
  # We do NOT require Terraform to provide the application
  # bucket name.
  #
  # Dependency:
  #
  #   S3Stack
  #       |
  #       +--> BucketName
  #               |
  #               +--> CloudFrontStack
  #
  # ----------------------------------------------------------

  CloudFrontStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - S3Stack

    Properties:
      TemplateURL: !Sub
        - "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}nested/cloudfront.yaml"
        - Prefix: !If
            - HasTemplatePrefix
            - !Sub "${TemplatePrefix}/"
            - ""

      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

        # ----------------------------------------------------
        # Consume S3 nested-stack output.
        # ----------------------------------------------------

        ApplicationBucketName: !GetAtt S3Stack.Outputs.BucketName

  # ==========================================================
  # 8. EC2 NESTED STACK
  # ==========================================================
  #
  # VPC and subnet IDs come directly from VPCStack.
  #
  # Terraform does NOT provide:
  #
  #   VpcId
  #   PublicSubnetId
  #
  # The AMI ID is supplied externally to this root stack.
  #
  # The caller is responsible for providing an AMI ID that is
  # valid for the target AWS region.
  #
  # AmiId remains an external input to the root stack.
  #
  # The root stack forwards the supplied value to EC2Stack.
  #
  # ----------------------------------------------------------

  EC2Stack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - VPCStack

    Properties:
      TemplateURL: !Sub
        - "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}nested/ec2.yaml"
        - Prefix: !If
            - HasTemplatePrefix
            - !Sub "${TemplatePrefix}/"
            - ""

      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

        # ----------------------------------------------------
        # VPC created by VPCStack.
        # ----------------------------------------------------

        VpcId: !GetAtt VPCStack.Outputs.VpcId

        # ----------------------------------------------------
        # First public subnet created by VPCStack.
        # ----------------------------------------------------

        PublicSubnetId: !GetAtt VPCStack.Outputs.PublicSubnet1Id

        # ----------------------------------------------------
        # AMI remains an external input.
        # ----------------------------------------------------

        AmiId: !Ref AmiId

        # ----------------------------------------------------
        # EC2 instance size.
        # ----------------------------------------------------

        InstanceType: !Ref InstanceType

  # ==========================================================
  # 9. EKS NESTED STACK
  # ==========================================================
  #
  # EKS receives its networking configuration directly from
  # VPCStack.
  #
  # eks.yaml requires:
  #
  #   VpcId
  #   PrivateSubnet1Id
  #   PrivateSubnet2Id
  #
  # These values are consumed directly from VPCStack outputs.
  #
  # ----------------------------------------------------------

  EKSStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - VPCStack

    Properties:
      TemplateURL: !Sub
        - "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}nested/eks.yaml"
        - Prefix: !If
            - HasTemplatePrefix
            - !Sub "${TemplatePrefix}/"
            - ""

      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

        # ----------------------------------------------------
        # VPC created by VPCStack.
        # ----------------------------------------------------

        VpcId: !GetAtt VPCStack.Outputs.VpcId

        # ----------------------------------------------------
        # First private subnet created by VPCStack.
        # ----------------------------------------------------

        PrivateSubnet1Id: !GetAtt VPCStack.Outputs.PrivateSubnet1Id

        # ----------------------------------------------------
        # Second private subnet created by VPCStack.
        # ----------------------------------------------------

        PrivateSubnet2Id: !GetAtt VPCStack.Outputs.PrivateSubnet2Id

  # ==========================================================
  # 10. RDS NESTED STACK
  # ==========================================================
  #
  # IMPORTANT:
  #
  # ============================================================
  # STACK DEPENDENCY / RESOURCE RELATIONSHIP
  # ============================================================
  #
  # VPCStack
  #   |
  #   +--------------------+
  #   |                    |
  #   v                    v
  # EC2Stack             RDSStack
  #   |                    |
  #   |                    |
  #   +---------+----------+
  #             |
  #             v
  #    EC2RDSSecretsPolicy
  #
  # Dependency details:
  #
  # 1. VPCStack provides the VPC and subnet resources required
  #    by both EC2Stack and RDSStack.
  #
  # 2. EC2Stack creates the EC2 instance, security group,
  #    IAM role, and instance profile.
  #
  # 3. RDSStack explicitly depends on VPCStack and EC2Stack.
  #
  #    VPCStack provides the VPC and private subnet outputs.
  #    EC2Stack provides the EC2 security group output.
  #
  # 4. EC2RDSSecretsPolicy depends on both EC2Stack and RDSStack:
  #
  #    - EC2Stack provides the EC2 IAM role to which the policy
  #      is attached.
  #
  #    - RDSStack exposes the database secret ARN through its
  #      DatabaseSecretArn output.
  #      
  #     This policy grants the EC2 role permission to retrieve
  #     that specific secret.
  #
  #
  # 5. Therefore, the dependency flow is:
  #
  #       VPCStack
  #       /      \
  #      v        v
  #   EC2Stack  RDSStack
  #      \        /
  #       \      /
  #        v    v
  #   EC2RDSSecretsPolicy
  #
  # IMPORTANT:
  # This comment documents the resource relationships.
  # The actual DependsOn and cross-stack references below
  # control the CloudFormation deployment order.
  #
  # No additional dependency is required when the existing
  # resource references already establish the relationship.
  #
  # ============================================================

  RDSStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - VPCStack
      - EC2Stack

    Properties:
      TemplateURL: !Sub
        - "https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${Prefix}nested/rds.yaml"
        - Prefix: !If
            - HasTemplatePrefix
            - !Sub "${TemplatePrefix}/"
            - ""

      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment

        # ----------------------------------------------------
        # VPC created by VPCStack.
        # ----------------------------------------------------

        VpcId: !GetAtt VPCStack.Outputs.VpcId

        # ----------------------------------------------------
        # First private subnet.
        # ----------------------------------------------------

        PrivateSubnet1Id: !GetAtt VPCStack.Outputs.PrivateSubnet1Id

        # ----------------------------------------------------
        # Second private subnet.
        # ----------------------------------------------------

        PrivateSubnet2Id: !GetAtt VPCStack.Outputs.PrivateSubnet2Id

        # ----------------------------------------------------
        # EC2 SECURITY GROUP
        # ----------------------------------------------------
        #
        # Get the security group ID from EC2Stack.
        #
        # The root stack passes this security group ID to the
        # RDS nested stack for database connectivity/security
        # configuration.
        # ----------------------------------------------------

        Ec2SecurityGroupId: !GetAtt EC2Stack.Outputs.SecurityGroupId

        # ----------------------------------------------------
        # Database administrator username.
        #
        # The database username is passed to the RDS nested stack.
        #
        # The database password is not supplied by this root stack.
        # Password management is handled by the RDS nested stack.
        # ----------------------------------------------------

        DatabaseUsername: !Ref DatabaseUsername

  # ==========================================================
  # 11. EC2 -> RDS SECRETS MANAGER IAM POLICY
  # ==========================================================
  #
  # Purpose:
  #
  # Grants the EC2 application role permission to retrieve the
  # RDS master database secret from AWS Secrets Manager.
  #
  # IMPORTANT:
  #
  # The database password is not supplied as a parameter
  # by this root stack.
  #
  # The root stack only passes the database administrator
  # username to RDSStack.
  #
  # Instead:
  #
  #   RDS
  #      |
  #      +--> Secrets Manager
  #               |
  #               +--> Database username/password
  #
  # The EC2 application receives permission to read that secret
  # through its IAM role.
  #
  # Architecture:
  #
  #   EC2Stack
  #      |
  #      +--> EC2RoleName
  #                 |
  #                 v
  #        EC2RDSSecretsPolicy
  #                 |
  #                 | secretsmanager:GetSecretValue
  #                 v
  #             RDSStack
  #                 |
  #                 +--> DatabaseSecretArn
  #
  # WHY THIS POLICY IS IN MAIN.YAML:
  #
  # EC2Stack and RDSStack are separate nested stacks.
  #
  # RDSStack already depends on EC2Stack because RDS consumes
  # the EC2 security group ID for its database security
  # configuration.
  #
  # Therefore we should NOT make EC2Stack depend on RDSStack.
  #
  # Doing that would create a circular dependency:
  #
  #   EC2Stack --> RDSStack
  #       ^          |
  #       |          |
  #       +----------+
  #
  # Instead, the root stack acts as the integration point.
  #
  # This keeps the dependency graph one-way:
  #
  #       VPCStack
  #       /      \
  #      v        v
  #   EC2Stack  RDSStack
  #      \        /
  #       \      /
  #        v    v
  #   EC2RDSSecretsPolicy
  #
  # The policy consumes outputs from both EC2Stack and RDSStack.
  #
  # These cross-stack references establish the required
  # CloudFormation dependencies without creating a dependency
  # from EC2Stack back to RDSStack.
  #
  # LEAST PRIVILEGE:
  #
  # Only the following permission is granted:
  #
  #   secretsmanager:GetSecretValue
  #
  # And it is restricted to the specific RDS-managed secret.
  #
  # We intentionally do NOT grant:
  #
  #   secretsmanager:*
  #
  # ==========================================================

  EC2RDSSecretsPolicy:
    Type: AWS::IAM::Policy

    Properties:

      # --------------------------------------------------------
      # IAM policy name
      # --------------------------------------------------------
      #
      # The name is generated from the project and environment
      # so that the policy follows the same naming convention as
      # the rest of the lab.
      #
      # Example:
      #
      #   hybridiaclab-dev-EC2-RDS-Secrets
      #
      # --------------------------------------------------------

      PolicyName:
        !Sub "${ProjectName}-${Environment}-EC2-RDS-Secrets"

      # --------------------------------------------------------
      # IAM role to which this policy is attached
      # --------------------------------------------------------
      #
      # EC2Stack creates the EC2 IAM role.
      #
      # ec2.yaml exposes the role name through:
      #
      #   EC2RoleName
      #
      # The root stack consumes that nested-stack output here.
      #
      # This means the EC2 role remains owned by ec2.yaml while
      # the cross-stack permission remains owned by main.yaml.
      #
      # --------------------------------------------------------

      Roles:
        - !GetAtt EC2Stack.Outputs.EC2RoleName

      # --------------------------------------------------------
      # IAM policy document
      # --------------------------------------------------------
      #
      # This permission allows the EC2 application to retrieve
      # the RDS master secret from AWS Secrets Manager.
      #
      # --------------------------------------------------------

      PolicyDocument:

        Version: "2012-10-17"

        Statement:

          # ----------------------------------------------------
          # Allow EC2 application to read the RDS master secret
          # ----------------------------------------------------

          - Sid: ReadRDSMasterSecret

            Effect: Allow

            Action:
              - secretsmanager:GetSecretValue

            # --------------------------------------------------
            # IMPORTANT:
            #
            # Restrict access to ONLY the secret created and
            # managed by the RDS nested stack.
            #
            # No wildcard (*) is used here.
            # --------------------------------------------------

            Resource:
              - !GetAtt RDSStack.Outputs.DatabaseSecretArn

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ----------------------------------------------------------
  # Project
  # ----------------------------------------------------------

  ProjectName:
    Description: Project name.
    Value: !Ref ProjectName

  # ----------------------------------------------------------
  # Environment
  # ----------------------------------------------------------

  Environment:
    Description: Deployment environment.
    Value: !Ref Environment

  # ----------------------------------------------------------
  # Nested stack IDs
  # ----------------------------------------------------------
  #
  # These outputs expose the CloudFormation nested-stack
  # resources created by this bootstrap stack.
  #
  # ECSStackId is intentionally NOT included because ECS is
  # deployed separately after the Docker image exists.
  #
  # ----------------------------------------------------------

  VPCStackId:
    Description: VPC nested stack ID.
    Value: !Ref VPCStack

  S3StackId:
    Description: S3 nested stack ID.
    Value: !Ref S3Stack

  DynamoDBStackId:
    Description: DynamoDB nested stack ID.
    Value: !Ref DynamoDBStack

  ECRStackId:
    Description: ECR nested stack ID.
    Value: !Ref ECRStack

  LambdaStackId:
    Description: Lambda nested stack ID.
    Value: !Ref LambdaStack

  APIGatewayStackId:
    Description: API Gateway nested stack ID.
    Value: !Ref APIGatewayStack

  CloudFrontStackId:
    Description: CloudFront nested stack ID.
    Value: !Ref CloudFrontStack

  EC2StackId:
    Description: EC2 nested stack ID.
    Value: !Ref EC2Stack

  EKSStackId:
    Description: EKS nested stack ID.
    Value: !Ref EKSStack

  RDSStackId:
    Description: RDS nested stack ID.
    Value: !Ref RDSStack

  # ----------------------------------------------------------
  # VPC
  # ----------------------------------------------------------

  VpcId:
    Description: VPC created by the VPC nested stack.
    Value: !GetAtt VPCStack.Outputs.VpcId

  # ----------------------------------------------------------
  # Public Subnet 1
  # ----------------------------------------------------------
  #
  # Re-exposes the PublicSubnet1Id output from the VPC nested
  # stack at the root MainStack level.
  #
  # Flow:
  #
  #   VPCStack
  #       |
  #       +--> PublicSubnet1Id
  #               |
  #               v
  #           MainStack
  #               |
  #               v
  #       Downstream deployment
  #
  # ----------------------------------------------------------

  PublicSubnet1Id:
    Description: Public Subnet 1 created by the VPC nested stack.
    Value: !GetAtt VPCStack.Outputs.PublicSubnet1Id

  # ----------------------------------------------------------
  # Public Subnet 2
  # ----------------------------------------------------------
  #
  # Re-exposes the PublicSubnet2Id output from the VPC nested
  # stack at the root MainStack level.  
  # ----------------------------------------------------------

  PublicSubnet2Id:
    Description: Public Subnet 2 created by the VPC nested stack.
    Value: !GetAtt VPCStack.Outputs.PublicSubnet2Id

  # ----------------------------------------------------------
  # Private Subnet 1
  # ----------------------------------------------------------
  #
  # Re-exposes the PrivateSubnet1Id output from the VPC nested
  # stack at the root MainStack level.
  #
  # This makes the subnet ID available to downstream deployment
  # workflows or services that require it.  
  # ----------------------------------------------------------

  PrivateSubnet1Id:
    Description: Private Subnet 1 created by the VPC nested stack.
    Value: !GetAtt VPCStack.Outputs.PrivateSubnet1Id


  # ----------------------------------------------------------
  # Private Subnet 2
  # ----------------------------------------------------------
  #
  # Re-exposes the PrivateSubnet2Id output from the VPC nested
  # stack at the root MainStack level.
  #
  # This makes the subnet ID available to downstream deployment
  # workflows or services that require it.
  #
  # ----------------------------------------------------------

  PrivateSubnet2Id:
    Description: Private Subnet 2 created by the VPC nested stack.
    Value: !GetAtt VPCStack.Outputs.PrivateSubnet2Id  

  # ----------------------------------------------------------
  # Application S3 bucket
  # ----------------------------------------------------------

  ApplicationBucketName:
    Description: Application S3 bucket created by the S3 nested stack.
    Value: !GetAtt S3Stack.Outputs.BucketName

  # ----------------------------------------------------------
  # Lambda function ARN
  # ----------------------------------------------------------

  LambdaFunctionArn:
    Description: Lambda ARN created by the Lambda nested stack.
    Value: !GetAtt LambdaStack.Outputs.LambdaFunctionArn

  # ----------------------------------------------------------
  # ECR repository URI
  # ----------------------------------------------------------
  #
  # This output is important for the CI/CD pipeline.
  #
  # The Docker workflow can use this repository URI to:
  #
  #   1. Tag the Docker image.
  #   2. Push the image to ECR.
  #   3. Deploy the image to ECS.
  #
  # Example:
  #
  #   537236558357.dkr.ecr.us-east-1.amazonaws.com/
  #   hybridiaclab-dev-app
  #
  #
  # The image tag should preferably be the Git commit SHA:
  #
  #   hybridiaclab-dev-app:${GITHUB_SHA}
  #
  # This provides a unique application-version reference
  # for CI/CD deployments.
  #
  # ----------------------------------------------------------

  EcrRepositoryUri:
    Description: ECR repository URI created by the ECR nested stack.
    Value: !GetAtt ECRStack.Outputs.EcrRepositoryUri

  # ----------------------------------------------------------
  # ECR repository name
  # ----------------------------------------------------------
  #
  # Exposes the ECR repository name created by the ECR
  # nested stack so CI/CD workflows do not need to
  # hardcode the repository name.
  #
  # ----------------------------------------------------------

  EcrRepositoryName:
    Description: ECR repository name created by the ECR nested stack.
    Value: !GetAtt ECRStack.Outputs.EcrRepositoryName  

  # ----------------------------------------------------------
  # API Gateway endpoint
  # ----------------------------------------------------------

  ApiEndpoint:
    Description: API Gateway orders endpoint.
    Value: !GetAtt APIGatewayStack.Outputs.OrdersEndpoint

  # ----------------------------------------------------------
  # CloudFront domain name
  # ----------------------------------------------------------

  CloudFrontDomainName:
    Description: CloudFront distribution domain name.
    Value: !GetAtt CloudFrontStack.Outputs.CloudFrontDomainName

  # ----------------------------------------------------------
  # RDS database endpoint
  # ----------------------------------------------------------

  RDSDatabaseEndpoint:
    Description: RDS database endpoint.
    Value: !GetAtt RDSStack.Outputs.DatabaseEndpoint

  # ----------------------------------------------------------
  # RDS database port
  # ----------------------------------------------------------

  RDSDatabasePort:
    Description: RDS database port.
    Value: !GetAtt RDSStack.Outputs.DatabasePort

  # ----------------------------------------------------------
  # RDS Secrets Manager secret ARN
  # ----------------------------------------------------------
  #
  # The RDS nested stack exposes the database secret ARN.
  #
  # This root stack re-exposes the ARN as a CloudFormation
  # output. The secret value itself is not exposed here.
  #
  # ----------------------------------------------------------

  RDSDatabaseSecretArn:
    Description: ARN of the RDS-managed Secrets Manager secret.
    Value: !GetAtt RDSStack.Outputs.DatabaseSecretArn  

  # ----------------------------------------------------------
  # EC2 application IAM role
  # ----------------------------------------------------------
  #
  # Exposes the role created by the EC2 nested stack.
  # This is useful for troubleshooting and validating that
  # the Secrets Manager policy is attached to the expected
  # runtime role.
  #
  # ----------------------------------------------------------

  EC2RoleName:
    Description: Name of the IAM role used by the EC2 application.
    Value: !GetAtt EC2Stack.Outputs.EC2RoleName

  # ----------------------------------------------------------
  # EKS cluster name
  # ----------------------------------------------------------

  EKSClusterName:
    Description: EKS cluster name.
    Value: !GetAtt EKSStack.Outputs.ClusterName

# ============================================================
# DEPLOYMENT FLOW SUMMARY
# ============================================================
#
# Phase 1 - Infrastructure
# -------------------------
#
#   Terraform
#       |
#       +--> CloudFormation Template S3 Bucket
#       |
#       +--> Root CloudFormation Stack
#               |
#               +--> VPC
#               +--> S3
#               +--> DynamoDB
#               +--> ECR Repository
#               +--> Lambda
#               +--> API Gateway
#               +--> CloudFront
#               +--> EC2
#               +--> EKS
#               +--> RDS
#
#
# Phase 2 - Application
# ---------------------
#
#   GitHub Actions Docker workflow
#       |
#       +--> Docker Build
#       |
#       +--> ECR Login
#       |
#       +--> Docker Tag
#       |
#       +--> Push ${GITHUB_SHA}
#       |
#       +--> ECS Deployment
#
#
# This creates the correct dependency:
#
#   Infrastructure
#       |
#       v
#   ECR Repository
#       |
#       v
#   Docker Image
#       |
#       v
#   ECS Service
#
#
# NOT:
#
#   ECR Repository
#       |
#       +--> ECS
#               |
#               +--> image does not exist yet
#
# ============================================================
# END OF main.yaml
# ============================================================