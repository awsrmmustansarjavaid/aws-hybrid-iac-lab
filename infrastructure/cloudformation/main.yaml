AWSTemplateFormatVersion: "2010-09-09"

# ============================================================
# HYBRID TERRAFORM + CLOUDFORMATION AWS DEVOPS LAB
# ============================================================
#
# File:
#   infrastructure/cloudformation/main.yaml
#
# Purpose:
#   Root CloudFormation stack for the entire Hybrid IaC Lab.
#
#   This template does NOT directly create the application
#   resources.
#
#   Instead, it creates and coordinates multiple nested
#   CloudFormation stacks.
#
# ============================================================
#
# ROOT STACK ARCHITECTURE
#
#   main.yaml
#       |
#       +----> nested/vpc.yaml
#       |
#       +----> nested/s3.yaml
#       |
#       +----> nested/dynamodb.yaml
#       |
#       +----> nested/ecr.yaml
#       |
#       +----> nested/ec2.yaml
#       |
#       +----> nested/ecs.yaml
#       |
#       +----> nested/eks.yaml
#       |
#       +----> nested/lambda.yaml
#       |
#       +----> nested/rds.yaml
#       |
#       +----> nested/api-gateway.yaml
#       |
#       +----> nested/cloudfront.yaml
#
# ============================================================
#
# IMPORTANT DESIGN DECISION
#
# Some nested templates require resources created by other
# stacks, for example:
#
#   API Gateway
#       |
#       +----> Lambda ARN
#
#   CloudFront
#       |
#       +----> S3 application bucket
#
#   EC2
#       |
#       +----> VPC ID
#       +----> Public Subnet ID
#       +----> AMI ID
#
#   ECS
#       |
#       +----> VPC ID
#       +----> Public Subnet 1
#       +----> Public Subnet 2
#       +----> ECR Image URI
#
#   RDS
#       |
#       +----> VPC ID
#       +----> Private Subnet 1
#       +----> Private Subnet 2
#
# To keep this ROOT template independent from the exact output
# names inside your VPC/S3/ECR nested templates, those values
# are supplied as parameters.
#
# This makes main.yaml predictable and avoids hard-coding
# unknown nested-stack output names.
#
# ============================================================
#
# DEPLOYMENT MODEL
#
# Terraform
#     |
#     +----> S3 bucket containing CloudFormation templates
#     |
#     +----> Supporting AWS infrastructure
#     |
#     v
# CloudFormation Root Stack
#     |
#     +----> VPC
#     +----> S3
#     +----> DynamoDB
#     +----> ECR
#     +----> Lambda
#     +----> API Gateway
#     +----> CloudFront
#     +----> EC2
#     +----> ECS
#     +----> EKS
#     +----> RDS
#
# ============================================================


# ============================================================
# DESCRIPTION
# ============================================================

Description: >
  Root CloudFormation stack for the Hybrid Terraform +
  CloudFormation AWS DevOps Lab.


# ============================================================
# PARAMETERS
# ============================================================
#
# Parameters allow Terraform, AWS CLI, GitHub Actions, or the
# CloudFormation console to supply environment-specific values.
#
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # PROJECT NAME
  # ----------------------------------------------------------
  #
  # Common project name used by all nested stacks.
  #
  # Example:
  #
  #   HybridIaCLab
  #
  # ----------------------------------------------------------

  ProjectName:
    Type: String
    Default: HybridIaCLab
    Description: >
      Common project name used by the nested CloudFormation
      stacks.


  # ----------------------------------------------------------
  # ENVIRONMENT
  # ----------------------------------------------------------
  #
  # Deployment environment.
  #
  # Examples:
  #
  #   dev
  #   test
  #   staging
  #   prod
  #
  # ----------------------------------------------------------

  Environment:
    Type: String
    Default: dev
    Description: Deployment environment.


  # ==========================================================
  # CLOUDFORMATION TEMPLATE S3 BUCKET
  # ==========================================================
  #
  # Terraform creates this bucket.
  #
  # The bucket stores:
  #
  #   nested/vpc.yaml
  #   nested/s3.yaml
  #   nested/dynamodb.yaml
  #   nested/ecr.yaml
  #   nested/ec2.yaml
  #   nested/ecs.yaml
  #   nested/eks.yaml
  #   nested/lambda.yaml
  #   nested/rds.yaml
  #   nested/api-gateway.yaml
  #   nested/cloudfront.yaml
  #
  # ----------------------------------------------------------

  TemplateBucket:
    Type: String
    Description: >
      S3 bucket containing the CloudFormation nested templates.


  # ----------------------------------------------------------
  # TEMPLATE PREFIX
  # ----------------------------------------------------------
  #
  # Optional prefix before the nested/ directory.
  #
  # Example:
  #
  #   ""
  #
  # produces:
  #
  #   s3://bucket/nested/vpc.yaml
  #
  # Example:
  #
  #   cloudformation/
  #
  # produces:
  #
  #   s3://bucket/cloudformation/nested/vpc.yaml
  #
  # ----------------------------------------------------------

  TemplatePrefix:
    Type: String
    Default: ""
    Description: >
      Optional S3 key prefix before the nested template directory.


  # ==========================================================
  # VPC ID
  # ==========================================================
  #
  # Required by:
  #
  #   EC2
  #   ECS
  #   RDS
  #
  # ----------------------------------------------------------

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC where compute and database resources will be deployed.


  # ==========================================================
  # EC2 PUBLIC SUBNET
  # ==========================================================
  #
  # Required by EC2.
  #
  # ----------------------------------------------------------

  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Public subnet for the EC2 web server.


  # ==========================================================
  # ECS PUBLIC SUBNET 1
  # ==========================================================

  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: >
      First public subnet for ECS Fargate.


  # ==========================================================
  # ECS PUBLIC SUBNET 2
  # ==========================================================

  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Second public subnet for ECS Fargate.


  # ==========================================================
  # RDS PRIVATE SUBNET 1
  # ==========================================================

  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: >
      First private subnet for RDS.


  # ==========================================================
  # RDS PRIVATE SUBNET 2
  # ==========================================================

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Second private subnet for RDS.


  # ==========================================================
  # EC2 AMI
  # ==========================================================
  #
  # Amazon Linux 2023 AMI.
  #
  # AMI IDs are region-specific.
  #
  # ----------------------------------------------------------

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >
      Amazon Linux 2023 AMI ID for the selected AWS region.


  # ==========================================================
  # EC2 INSTANCE TYPE
  # ==========================================================

  InstanceType:
    Type: String
    Default: t3.micro

    AllowedValues:
      - t3.micro
      - t3.small

    Description: EC2 instance type.


  # ==========================================================
  # APPLICATION S3 BUCKET
  # ==========================================================
  #
  # CloudFront uses this bucket as its origin.
  #
  # The bucket should be private and CloudFront should access
  # it through Origin Access Control.
  #
  # ----------------------------------------------------------

  ApplicationBucketName:
    Type: String
    Description: >
      Existing S3 application bucket used by CloudFront.


  # ==========================================================
  # LAMBDA FUNCTION ARN
  # ==========================================================
  #
  # API Gateway requires the Lambda function ARN.
  #
  # ----------------------------------------------------------

  LambdaFunctionArn:
    Type: String
    Description: >
      ARN of the Lambda function invoked by API Gateway.


  # ==========================================================
  # ECR IMAGE URI
  # ==========================================================
  #
  # ECS requires a complete container image URI.
  #
  # Example:
  #
  #   123456789012.dkr.ecr.us-east-1.amazonaws.com/
  #   hybrid-iac-lab:latest
  #
  # ----------------------------------------------------------

  EcrImageUri:
    Type: String
    Description: >
      Full URI of the Docker image stored in Amazon ECR.


  # ==========================================================
  # RDS DATABASE USERNAME
  # ==========================================================

  DatabaseUsername:
    Type: String
    Default: admin
    Description: RDS MySQL master username.


  # ==========================================================
  # RDS DATABASE PASSWORD
  # ==========================================================
  #
  # NoEcho prevents the password from being displayed by
  # CloudFormation interfaces.
  #
  # IMPORTANT:
  # For a production architecture, use AWS Secrets Manager
  # instead of passing database passwords directly.
  #
  # ----------------------------------------------------------

  DatabasePassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: RDS MySQL master password.


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # 1. VPC NESTED STACK
  # ==========================================================
  #
  # Responsible for the networking layer.
  #
  # The nested template is:
  #
  #   nested/vpc.yaml
  #
  # Typical resources include:
  #
  #   VPC
  #   Internet Gateway
  #   Public Subnets
  #   Private Subnets
  #   Route Tables
  #   Security Groups
  #
  # ==========================================================

  VPCStack:
    Type: AWS::CloudFormation::Stack

    Properties:

      # --------------------------------------------------------
      # Nested template location
      # --------------------------------------------------------

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/vpc.yaml

      # --------------------------------------------------------
      # Parameters passed to VPC stack
      # --------------------------------------------------------

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment


  # ==========================================================
  # 2. S3 NESTED STACK
  # ==========================================================
  #
  # Responsible for S3 infrastructure.
  #
  # Template:
  #
  #   nested/s3.yaml
  #
  # ==========================================================

  S3Stack:
    Type: AWS::CloudFormation::Stack

    Properties:

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/s3.yaml

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment


  # ==========================================================
  # 3. DYNAMODB NESTED STACK
  # ==========================================================
  #
  # Responsible for DynamoDB resources.
  #
  # Template:
  #
  #   nested/dynamodb.yaml
  #
  # ==========================================================

  DynamoDBStack:
    Type: AWS::CloudFormation::Stack

    Properties:

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/dynamodb.yaml

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment


  # ==========================================================
  # 4. ECR NESTED STACK
  # ==========================================================
  #
  # Responsible for the Amazon ECR repository.
  #
  # Template:
  #
  #   nested/ecr.yaml
  #
  # ==========================================================

  ECRStack:
    Type: AWS::CloudFormation::Stack

    Properties:

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/ecr.yaml

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment


  # ==========================================================
  # 5. LAMBDA NESTED STACK
  # ==========================================================
  #
  # Responsible for the application Lambda function.
  #
  # Template:
  #
  #   nested/lambda.yaml
  #
  # The Lambda template creates:
  #
  #   IAM execution role
  #   Lambda function
  #   CloudWatch logging permissions
  #   DynamoDB permissions
  #
  # The source template defines a Python 3.12 Lambda function
  # and exposes its function ARN as an output. 
  #
  # ==========================================================

  LambdaStack:
    Type: AWS::CloudFormation::Stack

    Properties:

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/lambda.yaml

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment

    # Lambda should exist before API Gateway is created.
    #
    # API Gateway requires the Lambda ARN supplied through
    # LambdaFunctionArn.
    #
    # Because LambdaFunctionArn is supplied externally as a
    # parameter, this dependency is mainly an orchestration
    # dependency.


  # ==========================================================
  # 6. API GATEWAY NESTED STACK
  # ==========================================================
  #
  # Responsible for the REST API.
  #
  # Template:
  #
  #   nested/api-gateway.yaml
  #
  # API:
  #
  #   POST /orders
  #
  # Flow:
  #
  #   Client
  #      |
  #      v
  #   API Gateway
  #      |
  #      v
  #   Lambda
  #
  # ==========================================================

  APIGatewayStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - LambdaStack

    Properties:

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/api-gateway.yaml

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment

        LambdaFunctionArn: !Ref LambdaFunctionArn


  # ==========================================================
  # 7. CLOUDFRONT NESTED STACK
  # ==========================================================
  #
  # Responsible for the CDN layer.
  #
  # Template:
  #
  #   nested/cloudfront.yaml
  #
  # Architecture:
  #
  #   Internet
  #       |
  #       v
  #   CloudFront
  #       |
  #       | OAC + SigV4
  #       v
  #   Private S3 Bucket
  #
  # ==========================================================

  CloudFrontStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - S3Stack

    Properties:

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/cloudfront.yaml

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment

        ApplicationBucketName: !Ref ApplicationBucketName


  # ==========================================================
  # 8. EC2 NESTED STACK
  # ==========================================================
  #
  # Responsible for the EC2 web server.
  #
  # Template:
  #
  #   nested/ec2.yaml
  #
  # Resources created by the nested template include:
  #
  #   Security Group
  #   IAM Role
  #   Instance Profile
  #   EC2 Instance
  #   Nginx
  #
  # ==========================================================

  EC2Stack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - VPCStack

    Properties:

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/ec2.yaml

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment

        VpcId: !Ref VpcId

        PublicSubnetId: !Ref PublicSubnetId

        AmiId: !Ref AmiId

        InstanceType: !Ref InstanceType


  # ==========================================================
  # 9. ECS NESTED STACK
  # ==========================================================
  #
  # Responsible for ECS/Fargate container infrastructure.
  #
  # Template:
  #
  #   nested/ecs.yaml
  #
  # Architecture:
  #
  #   ECR
  #     |
  #     v
  #   Docker Image
  #     |
  #     v
  #   ECS Fargate
  #
  # ==========================================================

  ECSStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - VPCStack
      - ECRStack

    Properties:

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/ecs.yaml

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment

        VpcId: !Ref VpcId

        PublicSubnet1Id: !Ref PublicSubnet1Id

        PublicSubnet2Id: !Ref PublicSubnet2Id

        EcrImageUri: !Ref EcrImageUri


  # ==========================================================
  # 10. EKS NESTED STACK
  # ==========================================================
  #
  # Responsible for Amazon EKS.
  #
  # Template:
  #
  #   nested/eks.yaml
  #
  # The supplied EKS template currently requires:
  #
  #   ProjectName
  #   Environment
  #
  # ==========================================================

  EKSStack:
    Type: AWS::CloudFormation::Stack

    Properties:

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/eks.yaml

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment


  # ==========================================================
  # 11. RDS NESTED STACK
  # ==========================================================
  #
  # Responsible for the MySQL database layer.
  #
  # Template:
  #
  #   nested/rds.yaml
  #
  # Architecture:
  #
  #   EC2 / Application
  #          |
  #          | TCP 3306
  #          v
  #      RDS Security Group
  #          |
  #          v
  #       RDS MySQL
  #
  # The database should remain private.
  #
  # ==========================================================

  RDSStack:
    Type: AWS::CloudFormation::Stack

    DependsOn:
      - VPCStack

    Properties:

      TemplateURL: !Sub
        https://${TemplateBucket}.s3.${AWS::Region}.amazonaws.com/${TemplatePrefix}nested/rds.yaml

      Parameters:

        ProjectName: !Ref ProjectName

        Environment: !Ref Environment

        VpcId: !Ref VpcId

        PrivateSubnet1Id: !Ref PrivateSubnet1Id

        PrivateSubnet2Id: !Ref PrivateSubnet2Id

        DatabaseUsername: !Ref DatabaseUsername

        DatabasePassword: !Ref DatabasePassword


# ============================================================
# OUTPUTS
# ============================================================
#
# Outputs expose useful information from the root stack.
#
# Nested stack outputs can also be exposed using:
#
#   !GetAtt NestedStack.Outputs.OutputName
#
# However, because the exact output names of the external
# vpc.yaml and s3.yaml templates are not defined in this
# root template, this version intentionally exposes the nested
# stack IDs and the supplied integration values.
#
# ============================================================

Outputs:


  # ==========================================================
  # ROOT STACK INFORMATION
  # ==========================================================

  ProjectName:
    Description: Project name used by the root stack.
    Value: !Ref ProjectName


  Environment:
    Description: Deployment environment.
    Value: !Ref Environment


  # ==========================================================
  # VPC NESTED STACK
  # ==========================================================

  VPCStackId:
    Description: ID of the nested VPC CloudFormation stack.
    Value: !Ref VPCStack


  # ==========================================================
  # S3 NESTED STACK
  # ==========================================================

  S3StackId:
    Description: ID of the nested S3 CloudFormation stack.
    Value: !Ref S3Stack


  # ==========================================================
  # DYNAMODB NESTED STACK
  # ==========================================================

  DynamoDBStackId:
    Description: ID of the nested DynamoDB CloudFormation stack.
    Value: !Ref DynamoDBStack


  # ==========================================================
  # ECR NESTED STACK
  # ==========================================================

  ECRStackId:
    Description: ID of the nested ECR CloudFormation stack.
    Value: !Ref ECRStack


  # ==========================================================
  # LAMBDA NESTED STACK
  # ==========================================================

  LambdaStackId:
    Description: ID of the nested Lambda CloudFormation stack.
    Value: !Ref LambdaStack


  # ==========================================================
  # API GATEWAY NESTED STACK
  # ==========================================================

  APIGatewayStackId:
    Description: ID of the nested API Gateway CloudFormation stack.
    Value: !Ref APIGatewayStack


  # ==========================================================
  # CLOUDFRONT NESTED STACK
  # ==========================================================

  CloudFrontStackId:
    Description: ID of the nested CloudFront CloudFormation stack.
    Value: !Ref CloudFrontStack


  # ==========================================================
  # EC2 NESTED STACK
  # ==========================================================

  EC2StackId:
    Description: ID of the nested EC2 CloudFormation stack.
    Value: !Ref EC2Stack


  # ==========================================================
  # ECS NESTED STACK
  # ==========================================================

  ECSStackId:
    Description: ID of the nested ECS CloudFormation stack.
    Value: !Ref ECSStack


  # ==========================================================
  # EKS NESTED STACK
  # ==========================================================

  EKSStackId:
    Description: ID of the nested EKS CloudFormation stack.
    Value: !Ref EKSStack


  # ==========================================================
  # RDS NESTED STACK
  # ==========================================================

  RDSStackId:
    Description: ID of the nested RDS CloudFormation stack.
    Value: !Ref RDSStack


  # ==========================================================
  # API GATEWAY LAMBDA ARN
  # ==========================================================
  #
  # This is the Lambda ARN supplied to API Gateway.
  #
  # ==========================================================

  LambdaFunctionArn:
    Description: Lambda function ARN used by API Gateway.
    Value: !Ref LambdaFunctionArn


  # ==========================================================
  # APPLICATION BUCKET
  # ==========================================================

  ApplicationBucketName:
    Description: S3 application bucket used by CloudFront.
    Value: !Ref ApplicationBucketName


  # ==========================================================
  # ECR IMAGE
  # ==========================================================

  EcrImageUri:
    Description: Docker image URI supplied to ECS.
    Value: !Ref EcrImageUri

