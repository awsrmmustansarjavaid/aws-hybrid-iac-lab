# ============================================================
# AWS HYBRID IaC LAB
# CLOUDFORMATION EXECUTION ROLE
# ============================================================
# NOTE: This template is NOT deployed anywhere in this repo.
# The real CloudFormation execution role is created by Terraform
# (see infrastructure/terraform/iam.tf). This file is kept for
# reference only — do not deploy it.
# ============================================================
# File:
#
#   infrastructure/cloudformation/iam/cloudformation-execution-role.yaml
#
# Purpose:
#
#   Creates the dedicated IAM service role used by AWS
#   CloudFormation to create, update, and delete the
#   infrastructure resources defined by the Hybrid IaC Lab.
#
# ============================================================
# PROJECT NAMING STANDARD
# ============================================================
#
# The standardized project name for this lab is:
#
#   hybridiaclab
#
# DO NOT use:
#
#   hybridiaclab
#
# Resource naming should follow:
#
#   ${ProjectName}-${Environment}-<Resource>
#
# Example:
#
#   hybridiaclab-dev-CFNExecutionRole
#
# ============================================================
# ARCHITECTURE
# ============================================================
#
# Terraform
#     |
#     +--> CloudFormation template S3 bucket
#     |
#     +--> Root CloudFormation stack
#              |
#              +--> VPC
#              +--> S3
#              +--> DynamoDB
#              +--> ECR
#              +--> Lambda
#              +--> API Gateway
#              +--> CloudFront
#              +--> EC2
#              +--> EKS
#              +--> RDS
#
#
# CloudFormation uses this execution role when the role ARN
# is supplied during stack deployment.
#
# Example:
#
#   aws cloudformation deploy \
#       --role-arn <CloudFormationExecutionRoleArn>
#
# ============================================================
# IMPORTANT: THIS ROLE IS FOR CLOUDFORMATION
# ============================================================
#
# This role is NOT:
#
#   - the GitHub Actions deployment role
#   - the EC2 instance role
#   - the Lambda execution role
#   - the EKS cluster role
#   - the EKS node role
#   - the ECS task execution role
#
# Those workload/deployment roles are separate IAM identities.
#
# This role answers:
#
#   "What is CloudFormation allowed to provision/manage?"
#
# ============================================================
# CURRENT HYBRID IaC RESPONSIBILITY
# ============================================================
#
# Terraform:
#
#   - manages the Terraform backend
#   - manages Terraform-side IAM/GitHub OIDC infrastructure
#   - uploads/provides CloudFormation templates
#   - creates/manages the root CloudFormation stack
#
# CloudFormation:
#
#   - creates the application infrastructure through nested
#     CloudFormation stacks
#
# GitHub Actions:
#
#   - builds Docker images
#   - pushes Docker images to ECR
#   - deploys/updates ECS after the image exists
#
# ============================================================
# IMPORTANT ECS DESIGN
# ============================================================
#
# ECS is intentionally NOT created by main.yaml.
#
# The current deployment flow is:
#
#   Terraform
#       |
#       v
#   Root CloudFormation Stack
#       |
#       +--> ECR Repository
#       |
#       v
#   GitHub Actions
#       |
#       +--> Docker Build
#       |
#       +--> ECR Push
#       |
#       v
#   ECS Deployment
#
# Therefore this CloudFormation execution role does NOT need
# ECS deployment permissions for the current root-stack design.
#
# ECS permissions should be provided to the identity responsible
# for deploying the separate ECS stack.
#
# ============================================================
# IMPORTANT ECR DESIGN
# ============================================================
#
# The ECR nested stack creates the repository.
#
# CloudFormation does NOT build or push the Docker image.
#
# GitHub Actions performs:
#
#   Docker Build
#       |
#       v
#   ECR Login
#       |
#       v
#   Docker Tag
#       |
#       v
#   ECR Push
#
# Therefore this CloudFormation execution role does NOT require
# ecr:PutImage or other Docker image push permissions.
#
# ============================================================
# SECURITY MODEL
# ============================================================
#
# This is a LAB execution role.
#
# Some permissions intentionally use:
#
#   Resource: "*"
#
# This makes the lab easier to build, troubleshoot, and destroy.
#
# This permission model should NOT be copied directly into
# production environments.
#
# Production environments should use:
#
#   - least-privilege policies
#   - resource-specific ARNs
#   - restricted iam:PassRole
#   - separate deployment roles
#   - permission boundaries
#   - service-specific execution roles
#
# ============================================================
# TRUST POLICY
# ============================================================
#
# The trust policy determines:
#
#   WHO can assume this role?
#
# Answer:
#
#   AWS CloudFormation
#
# ============================================================
# PERMISSION POLICY
# ============================================================
#
# The permissions policy determines:
#
#   WHAT can CloudFormation do after assuming this role?
#
# ============================================================
# AWS CLI
# ============================================================
#
# Run commands from:
#
#   infrastructure/cloudformation/
#
# ============================================================
# 1. CHECK AWS CLI
# ============================================================
#
# aws --version
#
# ============================================================
# 2. CHECK CURRENT AWS IDENTITY
# ============================================================
#
# aws sts get-caller-identity
#
# ============================================================
# 3. CHECK AWS REGION
# ============================================================
#
# aws configure get region
#
# ============================================================
# 4. VALIDATE TEMPLATE
# ============================================================
#
# From project root:
#
# aws cloudformation validate-template `
#   --template-body file://infrastructure/cloudformation/iam/cloudformation-execution-role.yaml `
#   --region us-east-1
#
# ============================================================
# 5. DEPLOY EXECUTION ROLE
# ============================================================
#
# From:
#
#   infrastructure/cloudformation/iam/
#
# Run:
#
# aws cloudformation deploy `
#   --template-file cloudformation-execution-role.yaml `
#   --stack-name hybridiaclab-dev-CFN-ExecutionRole `
#   --parameter-overrides `
#     ProjectName=hybridiaclab `
#     Environment=dev `
#   --capabilities CAPABILITY_NAMED_IAM `
#   --region us-east-1
#
# ============================================================
# 6. CHECK STACK
# ============================================================
#
# aws cloudformation describe-stacks `
#   --stack-name hybridiaclab-dev-CFN-ExecutionRole `
#   --region us-east-1
#
# ============================================================
# 7. VIEW STACK EVENTS
# ============================================================
#
# aws cloudformation describe-stack-events `
#   --stack-name hybridiaclab-dev-CFN-ExecutionRole `
#   --region us-east-1
#
# ============================================================
# 8. GET EXECUTION ROLE ARN
# ============================================================
#
# aws cloudformation describe-stacks `
#   --stack-name hybridiaclab-dev-CFN-ExecutionRole `
#   --query "Stacks[0].Outputs[?OutputKey=='ExecutionRoleArn'].OutputValue" `
#   --output text `
#   --region us-east-1
#
# ============================================================
# 9. CHECK IAM ROLE
# ============================================================
#
# aws iam get-role `
#   --role-name hybridiaclab-dev-CFNExecutionRole
#
# ============================================================
# 10. LIST INLINE POLICIES
# ============================================================
#
# aws iam list-role-policies `
#   --role-name hybridiaclab-dev-CFNExecutionRole
#
# ============================================================
# 11. GET INLINE POLICY
# ============================================================
#
# aws iam get-role-policy `
#   --role-name hybridiaclab-dev-CFNExecutionRole `
#   --policy-name hybridiaclabProvisioning
#
# ============================================================
# 12. USE THE ROLE WITH ROOT CLOUDFORMATION STACK
# ============================================================
#
# The execution role is NOT automatically selected.
#
# The root CloudFormation stack must be deployed with:
#
#   --role-arn
#
# Example:
#
# aws cloudformation deploy `
#   --template-file infrastructure/cloudformation/main.yaml `
#   --stack-name hybridiaclab-dev-MainStack `
#   --parameter-overrides `
#     ProjectName=hybridiaclab `
#     Environment=dev `
#     TemplateBucket=<TEMPLATE_BUCKET_NAME> `
#     AmiId=<AMI_ID> `
#     DatabaseUsername=admin `
#   --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM `
#   --role-arn arn:aws:iam::<ACCOUNT_ID>:role/hybridiaclab-dev-CFNExecutionRole `
#   --region us-east-1
#
# Terraform may perform this root-stack deployment instead.
# In that case Terraform should pass the execution-role ARN
# through the CloudFormation stack configuration.
#
# ============================================================
# 13. GET AWS ACCOUNT ID
# ============================================================
#
# aws sts get-caller-identity `
#   --query Account `
#   --output text
#
# ============================================================
# CLEANUP
# ============================================================
#
# Delete this execution-role stack only after all CloudFormation
# stacks that use this service role have been deleted or no
# longer depend on it.
#
# ============================================================
# 14. DELETE EXECUTION ROLE STACK
# ============================================================
#
# aws cloudformation delete-stack `
#   --stack-name hybridiaclab-dev-CFN-ExecutionRole `
#   --region us-east-1
#
# ============================================================
# CLOUDFORMATION TEMPLATE
# ============================================================

AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudFormation execution role for the hybridiaclab Hybrid
  Terraform + CloudFormation AWS DevOps Lab. This role allows
  AWS CloudFormation to provision and manage the infrastructure
  resources defined by the root and nested CloudFormation stacks.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # Project Name
  # ----------------------------------------------------------
  #
  # Standard project name:
  #
  #   hybridiaclab
  #
  # Used to construct the IAM role name.
  #
  # Example:
  #
  #   hybridiaclab-dev-CFNExecutionRole
  #
  # ----------------------------------------------------------

  ProjectName:
    Type: String
    Default: hybridiaclab
    Description: Project name used to construct CloudFormation execution-role resources.

  # ----------------------------------------------------------
  # Environment
  # ----------------------------------------------------------
  #
  # Supported environments:
  #
  #   dev
  #   test
  #   staging
  #   prod
  #
  # ----------------------------------------------------------

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - staging
      - prod
    Description: Deployment environment.

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # CLOUDFORMATION EXECUTION ROLE
  # ==========================================================
  #
  # CloudFormation assumes this role when it creates, updates,
  # or deletes resources in the Hybrid IaC Lab.
  #
  # ==========================================================

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role

    Properties:

      # --------------------------------------------------------
      # Explicit IAM Role Name
      # --------------------------------------------------------
      #
      # Standard naming:
      #
      #   hybridiaclab-dev-CFNExecutionRole
      #
      # --------------------------------------------------------

      RoleName: !Sub "${ProjectName}-${Environment}-CFNExecutionRole"

      # ========================================================
      # TRUST POLICY
      # ========================================================
      #
      # This answers:
      #
      #   "WHO is allowed to assume this role?"
      #
      # Only AWS CloudFormation is trusted.
      #
      # ========================================================

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - cloudformation.amazonaws.com

            Action:
              - sts:AssumeRole

      # ========================================================
      # PERMISSIONS
      # ========================================================
      #
      # These permissions answer:
      #
      #   "WHAT can CloudFormation do after assuming this role?"
      #
      # ========================================================

      Policies:

        # ======================================================
        # MAIN LAB PROVISIONING POLICY
        # ======================================================

        - PolicyName: hybridiaclabProvisioning

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # =================================================
              # IAM ROLE MANAGEMENT
              # =================================================
              #
              # Required because several nested stacks create
              # IAM roles.
              #
              # Examples:
              #
              #   - EC2 application role
              #   - Lambda execution role
              #   - EKS cluster role
              #   - EKS node role
              #
              # =================================================

              - Effect: Allow

                Action:

                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy

                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy

                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies

                  - iam:TagRole
                  - iam:UntagRole

                Resource: "*"

              # =================================================
              # IAM PASSROLE
              # =================================================
              #
              # CloudFormation needs iam:PassRole when an AWS
              # resource is configured to use an IAM role.
              #
              # Examples:
              #
              #   Lambda -> Lambda execution role
              #   EKS    -> EKS cluster role
              #   EKS    -> EKS node role
              #   EC2    -> EC2 instance profile role
              #
              # LAB NOTE:
              #
              # Resource "*" keeps this lab simple.
              # Production should restrict this to only the
              # roles that CloudFormation is allowed to pass.
              #
              # =================================================

              - Effect: Allow

                Action:
                  - iam:PassRole

                Resource: "*"

              # =================================================
              # EC2 / VPC NETWORKING
              # =================================================
              #
              # Used by vpc.yaml and ec2.yaml.
              #
              # Supports:
              #
              #   - VPC
              #   - Subnets
              #   - Route tables
              #   - Internet Gateway
              #   - NAT Gateway
              #   - Elastic IP
              #   - Security Groups
              #   - EC2 instances
              #
              # =================================================

              - Effect: Allow

                Action:

                  # ------------------------------------------------
                  # Describe operations
                  # ------------------------------------------------

                  - ec2:Describe*

                  # ------------------------------------------------
                  # VPC
                  # ------------------------------------------------

                  - ec2:CreateVpc
                  - ec2:DeleteVpc

                  # ------------------------------------------------
                  # Subnets
                  # ------------------------------------------------

                  - ec2:CreateSubnet
                  - ec2:DeleteSubnet

                  # ------------------------------------------------
                  # Route tables and routes
                  # ------------------------------------------------

                  - ec2:CreateRouteTable
                  - ec2:DeleteRouteTable

                  - ec2:CreateRoute
                  - ec2:DeleteRoute

                  - ec2:AssociateRouteTable
                  - ec2:DisassociateRouteTable

                  # ------------------------------------------------
                  # Internet Gateway
                  # ------------------------------------------------

                  - ec2:CreateInternetGateway
                  - ec2:DeleteInternetGateway

                  - ec2:AttachInternetGateway
                  - ec2:DetachInternetGateway

                  # ------------------------------------------------
                  # NAT Gateway
                  # ------------------------------------------------

                  - ec2:CreateNatGateway
                  - ec2:DeleteNatGateway

                  # ------------------------------------------------
                  # Elastic IP
                  # ------------------------------------------------

                  - ec2:AllocateAddress
                  - ec2:ReleaseAddress
                  - ec2:AssociateAddress
                  - ec2:DisassociateAddress

                  # ------------------------------------------------
                  # Security Groups
                  # ------------------------------------------------

                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup

                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress

                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress

                  # ------------------------------------------------
                  # EC2 instances
                  # ------------------------------------------------

                  - ec2:RunInstances
                  - ec2:TerminateInstances

                  # ------------------------------------------------
                  # Tags
                  # ------------------------------------------------

                  - ec2:CreateTags
                  - ec2:DeleteTags

                Resource: "*"

              # =================================================
              # S3
              # =================================================
              #
              # Used by:
              #
              #   - s3.yaml
              #   - CloudFormation template bucket access
              #   - CloudFront origin bucket configuration
              #
              # CloudFormation also needs read access to the
              # templates stored in the Terraform-managed
              # CloudFormation template bucket.
              #
              # =================================================

              - Effect: Allow

                Action:

                  - s3:CreateBucket
                  - s3:DeleteBucket

                  - s3:GetBucket*
                  - s3:PutBucket*

                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPolicy

                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject

                  - s3:ListBucket

                  - s3:PutObjectTagging
                  - s3:DeleteObjectTagging

                Resource: "*"

              # =================================================
              # LAMBDA
              # =================================================
              #
              # Used by lambda.yaml.
              #
              # =================================================

              - Effect: Allow

                Action:

                  - lambda:CreateFunction
                  - lambda:DeleteFunction

                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration

                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration

                  - lambda:AddPermission
                  - lambda:RemovePermission

                  - lambda:TagResource
                  - lambda:UntagResource

                Resource: "*"

              # =================================================
              # API GATEWAY
              # =================================================
              #
              # Used by api-gateway.yaml.
              #
              # This is intentionally broad for the lab.
              #
              # Production should use only the required
              # API Gateway actions.
              #
              # =================================================

              - Effect: Allow

                Action:
                  - apigateway:*

                Resource: "*"

              # =================================================
              # RDS
              # =================================================
              #
              # Used by rds.yaml.
              #
              # Supports:
              #
              #   - DB instance
              #   - DB subnet group
              #   - database modification/deletion
              #   - tagging
              #
              # The RDS template uses AWS-managed master-password
              # generation through Secrets Manager.
              #
              # =================================================

              - Effect: Allow

                Action:

                  - rds:CreateDBInstance
                  - rds:DeleteDBInstance
                  - rds:ModifyDBInstance

                  - rds:DescribeDBInstances

                  - rds:CreateDBSubnetGroup
                  - rds:DeleteDBSubnetGroup

                  - rds:DescribeDBSubnetGroups

                  - rds:AddTagsToResource
                  - rds:ListTagsForResource

                Resource: "*"

              # =================================================
              # DYNAMODB
              # =================================================
              #
              # Used by dynamodb.yaml.
              #
              # =================================================

              - Effect: Allow

                Action:

                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable

                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable

                  - dynamodb:TagResource
                  - dynamodb:UntagResource

                Resource: "*"

              # =================================================
              # ECR
              # =================================================
              #
              # Used by ecr.yaml.
              #
              # IMPORTANT:
              #
              # This role manages the ECR REPOSITORY.
              #
              # It does NOT perform Docker image pushes.
              #
              # GitHub Actions is responsible for:
              #
              #   - Docker build
              #   - ECR login
              #   - image tagging
              #   - image push
              #
              # Therefore ecr:PutImage is intentionally NOT
              # included here.
              #
              # =================================================

              - Effect: Allow

                Action:

                  - ecr:CreateRepository
                  - ecr:DeleteRepository

                  - ecr:DescribeRepositories

                  - ecr:GetRepositoryPolicy
                  - ecr:SetRepositoryPolicy
                  - ecr:DeleteRepositoryPolicy

                  - ecr:TagResource
                  - ecr:UntagResource

                Resource: "*"

              # =================================================
              # EKS
              # =================================================
              #
              # Used by eks.yaml.
              #
              # Supports:
              #
              #   - EKS cluster
              #   - EKS managed node group
              #   - cluster/node-group tagging
              #
              # IAM permissions required for the EKS roles are
              # provided by the IAM section above.
              #
              # =================================================

              - Effect: Allow

                Action:

                  - eks:CreateCluster
                  - eks:DeleteCluster
                  - eks:DescribeCluster

                  - eks:CreateNodegroup
                  - eks:DeleteNodegroup
                  - eks:DescribeNodegroup

                  - eks:TagResource
                  - eks:UntagResource

                Resource: "*"

              # =================================================
              # CLOUDWATCH LOGS
              # =================================================
              #
              # Used by Lambda and other application resources
              # that create CloudWatch Logs resources.
              #
              # =================================================

              - Effect: Allow

                Action:

                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup

                  - logs:DescribeLogGroups

                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy

                  - logs:TagResource
                  - logs:UntagResource

                Resource: "*"

              # =================================================
              # CLOUDFRONT
              # =================================================
              #
              # Used by cloudfront.yaml.
              #
              # Supports:
              #
              #   - CloudFront distribution
              #   - Origin Access Control
              #   - tagging
              #
              # =================================================

              - Effect: Allow

                Action:

                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution

                  - cloudfront:GetDistribution
                  - cloudfront:ListDistributions

                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl

                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl

                  - cloudfront:TagResource
                  - cloudfront:UntagResource

                Resource: "*"

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ==========================================================
  # EXECUTION ROLE ARN
  # ==========================================================
  #
  # This ARN is supplied to the root CloudFormation deployment
  # through:
  #
  #   --role-arn
  #
  # Example:
  #
  #   arn:aws:iam::<ACCOUNT_ID>:role/
  #   hybridiaclab-dev-CFNExecutionRole
  #
  # ==========================================================

  ExecutionRoleArn:
    Description: ARN of the CloudFormation execution role.
    Value: !GetAtt CloudFormationExecutionRole.Arn

  # ==========================================================
  # EXECUTION ROLE NAME
  # ==========================================================
  #
  # Example:
  #
  #   hybridiaclab-dev-CFNExecutionRole
  #
  # ==========================================================

  ExecutionRoleName:
    Description: Name of the CloudFormation execution role.
    Value: !Ref CloudFormationExecutionRole

# ============================================================
# END OF CLOUDFORMATION EXECUTION ROLE
# ============================================================