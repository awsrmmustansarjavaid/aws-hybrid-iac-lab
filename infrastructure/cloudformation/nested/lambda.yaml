# ============================================================
# AWS HYBRID IaC LAB
# AWS LAMBDA APPLICATION LAYER
# ============================================================
#
# File:
#
#   infrastructure/cloudformation/nested/lambda.yaml
#
# Purpose:
#
#   Creates the Lambda application layer for the
#   hybridiaclab AWS Hybrid IaC DevOps Lab.
#
# Architecture:
#
#   Client
#      |
#      v
#   API Gateway
#      |
#      | POST /orders
#      v
#   AWS Lambda
#      |
#      +----------------------+
#      |                      |
#      v                      v
#   CloudWatch Logs       DynamoDB
#
# This template creates:
#
#   1. Lambda execution IAM role
#   2. CloudWatch logging permissions
#   3. DynamoDB access permissions
#   4. Python 3.12 Lambda function
#   5. CloudFormation outputs
#
# ============================================================
# NAMING STANDARD
# ============================================================
#
# The entire project uses the following naming convention:
#
#   ProjectName: hybridiaclab
#   Environment: dev
#
# Resource naming pattern:
#
#   ${ProjectName}-${Environment}-<ResourceName>
#
# Example:
#
#   hybridiaclab-dev-ApplicationLambda
#
# IMPORTANT: 
#
# The canonical project identifier is:
#
#   hybridiaclab
#
# ============================================================
# DEPLOYMENT MODEL
# ============================================================
#
# This template is designed to work as part of the
# CloudFormation application layer of the Hybrid IaC lab.
#
# Terraform manages the higher-level infrastructure/bootstrap
# orchestration while CloudFormation manages AWS application
# resources.
#
# Lambda can later be connected to:
#
#   API Gateway
#        |
#        v
#   Lambda
#        |
#        v
#   DynamoDB
#
# ============================================================
# LAMBDA CODE MODEL
# ============================================================
#
# This template uses CloudFormation's ZipFile property.
#
# Advantages for this learning lab:
#
#   - No external ZIP package is required.
#   - No build server is required.
#   - The Lambda code remains visible in the template.
#   - Easy to deploy and understand.
#
# For larger production applications, Lambda source code would
# normally be maintained separately and packaged through CI/CD.
#
# ============================================================
# AWS CLI COMMANDS
# ============================================================
#
# These commands assume the AWS CLI is configured for:
#
#   Region:
#     us-east-1
#
# ============================================================
# 1. VERIFY AWS CLI
# ============================================================
#
# aws --version
#
# ============================================================
# 2. VERIFY AWS ACCOUNT
# ============================================================
#
# aws sts get-caller-identity
#
# ============================================================
# 3. CHECK AWS REGION
# ============================================================
#
# aws configure get region
#
# Expected lab region:
#
#   us-east-1
#
# ============================================================
# 4. VALIDATE CLOUDFORMATION TEMPLATE
# ============================================================
#
# From the project root:
#
# aws cloudformation validate-template `
#   --template-body file://infrastructure/cloudformation/nested/lambda.yaml `
#   --region us-east-1
#
# ============================================================
# 5. DEPLOY LAMBDA STACK DIRECTLY
# ============================================================
#
# This command is useful for testing the Lambda template
# independently.
#
# aws cloudformation deploy `
#   --template-file infrastructure/cloudformation/nested/lambda.yaml `
#   --stack-name hybridiaclab-Lambda `
#   --parameter-overrides `
#     ProjectName=hybridiaclab `
#     Environment=dev `
#   --capabilities CAPABILITY_NAMED_IAM `
#   --region us-east-1
#
# ============================================================
# 6. CHECK STACK STATUS
# ============================================================
#
# aws cloudformation describe-stacks `
#   --stack-name hybridiaclab-Lambda `
#   --region us-east-1
#
# ============================================================
# 7. WATCH CLOUDFORMATION EVENTS
# ============================================================
#
# aws cloudformation describe-stack-events `
#   --stack-name hybridiaclab-Lambda `
#   --region us-east-1
#
# ============================================================
# 8. GET CLOUDFORMATION OUTPUTS
# ============================================================
#
# aws cloudformation describe-stacks `
#   --stack-name hybridiaclab-Lambda `
#   --query "Stacks[0].Outputs" `
#   --output table `
#   --region us-east-1
#
# ============================================================
# 9. GET LAMBDA FUNCTION
# ============================================================
#
# aws lambda get-function `
#   --function-name hybridiaclab-dev-ApplicationLambda `
#   --region us-east-1
#
# ============================================================
# 10. GET LAMBDA CONFIGURATION
# ============================================================
#
# aws lambda get-function-configuration `
#   --function-name hybridiaclab-dev-ApplicationLambda `
#   --region us-east-1
#
# ============================================================
# 11. INVOKE LAMBDA DIRECTLY
# ============================================================
#
# Lambda can be tested without API Gateway.
#
# aws lambda invoke `
#   --function-name hybridiaclab-dev-ApplicationLambda `
#   --payload '{}' `
#   response.json `
#   --region us-east-1
#
# View the response:
#
# Get-Content response.json
#
# ============================================================
# 12. INVOKE WITH TEST JSON
# ============================================================
#
# Example:
#
# aws lambda invoke `
#   --function-name hybridiaclab-dev-ApplicationLambda `
#   --payload '{"item":"Coffee","quantity":2}' `
#   response.json `
#   --region us-east-1
#
# ============================================================
# 13. VIEW LAMBDA LOG GROUP
# ============================================================
#
# Lambda writes execution logs to CloudWatch Logs because the
# execution role includes AWSLambdaBasicExecutionRole.
#
# aws logs describe-log-groups `
#   --log-group-name-prefix /aws/lambda/hybridiaclab-dev `
#   --region us-east-1
#
# ============================================================
# 14. VIEW RECENT LOG STREAMS
# ============================================================
#
# aws logs describe-log-streams `
#   --log-group-name /aws/lambda/hybridiaclab-dev-ApplicationLambda `
#   --order-by LastEventTime `
#   --descending `
#   --region us-east-1
#
# ============================================================
# 15. API GATEWAY INTEGRATION
# ============================================================
#
# The API Gateway layer should consume:
#
#   LambdaFunctionArn
#
# Integration flow:
#
#   API Gateway
#        |
#        | invokes
#        v
#   Lambda
#
# API Gateway can then expose an endpoint such as:
#
#   POST /orders
#
# ============================================================
# 16. DELETE LAMBDA STACK
# ============================================================
#
# aws cloudformation delete-stack `
#   --stack-name hybridiaclab-Lambda `
#   --region us-east-1
#
# ============================================================
# CLOUDFORMATION TEMPLATE
# ============================================================

AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Lambda application layer for the hybridiaclab AWS Hybrid IaC
  DevOps Lab.

# ============================================================
# PARAMETERS
# ============================================================
#
# These parameters provide the common project/environment naming
# contract used across the lab.
#
# Standard values:
#
#   ProjectName = hybridiaclab
#   Environment = dev
#
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # PROJECT NAME
  # ----------------------------------------------------------
  #
  # Canonical project identifier:
  #
  #   hybridiaclab
  #
  # ----------------------------------------------------------

  ProjectName:
    Type: String
    Description: >
      Canonical project name used for AWS resource naming.

  # ----------------------------------------------------------
  # ENVIRONMENT
  # ----------------------------------------------------------
  #
  # Example:
  #
  #   dev
  #   test
  #   staging
  #   prod
  #
  # ----------------------------------------------------------

  Environment:
    Type: String
    Description: >
      Deployment environment used for AWS resource naming.

  # ============================================================
  # DYNAMODB ORDERS TABLE PARAMETERS
  # ============================================================
  #
  # These parameters provide the Lambda function with the name
  # and ARN of the DynamoDB Orders table.
  #
  # OrdersTableName:
  #   Used by the Lambda function to identify the DynamoDB table
  #   at runtime.
  #
  # OrdersTableArn:
  #   Used by IAM policies to restrict Lambda permissions to the
  #   specific DynamoDB Orders table instead of allowing access
  #   to all DynamoDB tables.
  #
  # ============================================================

  OrdersTableName:
    Type: String
    Description: >
      Name of the DynamoDB Orders table used by the Lambda function.

  OrdersTableArn:
    Type: String
    Description: >
      ARN of the DynamoDB Orders table used to restrict Lambda IAM
      permissions to the application table.    

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # LAMBDA EXECUTION ROLE
  # ==========================================================
  #
  # Lambda requires an IAM execution role.
  #
  # The role defines which AWS services the Lambda function can
  # access during execution.
  #
  # Current permissions:
  #
  #   1. CloudWatch Logs
  #   2. DynamoDB
  #
  # IMPORTANT:
  #
  # RoleName is intentionally NOT specified.
  #
  # CloudFormation generates the physical IAM role name.
  #
  # This reduces the possibility of IAM role-name conflicts when
  # the stack is recreated.
  #
  # ==========================================================

  LambdaExecutionRole:
    Type: AWS::IAM::Role

    Properties:

      # --------------------------------------------------------
      # TRUST POLICY
      # --------------------------------------------------------
      #
      # Allows the AWS Lambda service to assume this role.
      #
      # Flow:
      #
      #   AWS Lambda
      #       |
      #       | sts:AssumeRole
      #       v
      #   LambdaExecutionRole
      #
      # --------------------------------------------------------

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      # --------------------------------------------------------
      # AWS MANAGED LOGGING POLICY
      # --------------------------------------------------------
      #
      # Provides standard Lambda logging permissions.
      #
      # This allows Lambda to create/write CloudWatch Logs.
      #
      # Typical permissions include:
      #
      #   logs:CreateLogGroup
      #   logs:CreateLogStream
      #   logs:PutLogEvents
      #
      # --------------------------------------------------------

      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      # ========================================================
      # INLINE DYNAMODB POLICY
      # ========================================================
      #
      # Provides the Lambda function with the DynamoDB actions
      # required by the application layer.
      #
      # Current actions:
      #
      #   PutItem
      #   GetItem
      #   UpdateItem
      #   Query
      #   Scan
      #
      # 
      #
      # ========================================================

      Policies:

        - PolicyName: DynamoDBAccess

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              - Effect: Allow

                Action:

                  # Insert a new DynamoDB item.
                  - dynamodb:PutItem

                  # Read a specific DynamoDB item.
                  - dynamodb:GetItem

                  # Update an existing DynamoDB item.
                  - dynamodb:UpdateItem

                  # Query table/index data.
                  - dynamodb:Query

                  # Scan table data.
                  - dynamodb:Scan                 

                # ------------------------------------------------
                # LEAST-PRIVILEGE TABLE ACCESS
                # ------------------------------------------------
                #
                # Lambda access is restricted to the specific
                # DynamoDB Orders table ARN supplied by the parent
                # CloudFormation stack.
                #
                # This avoids granting Lambda access to unrelated
                # DynamoDB tables.
                #
                # ------------------------------------------------

                Resource: !Ref OrdersTableArn

  # ==========================================================
  # APPLICATION LAMBDA FUNCTION
  # ==========================================================
  #
  # Creates the Lambda application function.
  #
  # ==========================================================

  ApplicationFunction:
    Type: AWS::Lambda::Function

    Properties:

      # --------------------------------------------------------
      # FUNCTION NAME
      # --------------------------------------------------------
      #
      # Result:
      #
      #   hybridiaclab-dev-ApplicationLambda
      #
      # --------------------------------------------------------

      FunctionName: !Sub "${ProjectName}-${Environment}-ApplicationLambda"

      # --------------------------------------------------------
      # RUNTIME
      # --------------------------------------------------------
      #
      # Python 3.12 is used for the application.
      #
      # --------------------------------------------------------

      Runtime: python3.12

      # --------------------------------------------------------
      # HANDLER
      # --------------------------------------------------------
      #
      # CloudFormation stores the inline code as index.py.
      #
      # Therefore:
      #
      #   filename = index
      #   function = handler
      #
      # Handler:
      #
      #   index.handler
      #
      # --------------------------------------------------------

      Handler: index.handler

      # --------------------------------------------------------
      # EXECUTION ROLE
      # --------------------------------------------------------
      #
      # Lambda assumes this role when executing.
      #
      # --------------------------------------------------------

      Role: !GetAtt LambdaExecutionRole.Arn

      # --------------------------------------------------------
      # TIMEOUT
      # --------------------------------------------------------
      #
      # Maximum execution time:
      #
      #   30 seconds
      #
      # --------------------------------------------------------

      Timeout: 30

      # --------------------------------------------------------
      # MEMORY
      # --------------------------------------------------------
      #
      # Memory allocation:
      #
      #   256 MB
      #
      # --------------------------------------------------------

      MemorySize: 256

      # --------------------------------------------------------
      # DYNAMODB ORDERS TABLE ENVIRONMENT
      # --------------------------------------------------------

      Environment:

        Variables:

          # ========================================================
          # DYNAMODB ORDERS TABLE ENVIRONMENT VARIABLE
          # ========================================================
          #
          # Provides the DynamoDB Orders table name to the Lambda
          # function through an environment variable.
          #
          # The value is populated from the CloudFormation
          # OrdersTableName parameter.
          #
          # Lambda code can access this value using:
          #   process.env.ORDERS_TABLE_NAME   # Node.js
          #   os.environ["ORDERS_TABLE_NAME"] # Python
          #
          # This avoids hard-coding the DynamoDB table name inside
          # the Lambda application code.
          #
          # ========================================================
          ORDERS_TABLE_NAME: !Ref OrdersTableName

      # ========================================================
      # INLINE APPLICATION CODE
      # ========================================================
      #
      # CloudFormation packages this code automatically.
      #
      # No external ZIP package is required.
      #
      # ========================================================

      Code:

        ZipFile: !Sub |
          import json
          import os
          import uuid
          from datetime import datetime, timezone

          import boto3


          # ------------------------------------------------
          # DYNAMODB TABLE
          # ------------------------------------------------
          #
          # The table name is provided through the Lambda
          # environment variable.
          #
          # CloudFormation sets this value from:
          #
          #   OrdersTableName
          #
          # ------------------------------------------------

          dynamodb = boto3.resource("dynamodb")

          table = dynamodb.Table(
              os.environ["ORDERS_TABLE_NAME"]
          )


          def handler(event, context):

              # ------------------------------------------------
              # LOG THE INCOMING EVENT
              # ------------------------------------------------

              print("Received event:")
              print(json.dumps(event))


              # ------------------------------------------------
              # READ REQUEST BODY
              # ------------------------------------------------
              #
              # API Gateway normally sends the request body as
              # a string inside event["body"].
              #
              # Direct Lambda testing can also provide a normal
              # dictionary.
              #
              # ------------------------------------------------

              body = event.get("body", event)

              if isinstance(body, str):
                  body = json.loads(body)


              # ------------------------------------------------
              # READ ORDER DATA
              # ------------------------------------------------

              item = body.get("item")

              quantity = body.get("quantity")


              # ------------------------------------------------
              # BASIC VALIDATION
              # ------------------------------------------------

              if not item or quantity is None:

                  return {
                      "statusCode": 400,
                      "headers": {
                          "Content-Type": "application/json"
                      },
                      "body": json.dumps({
                          "message": "item and quantity are required"
                      })
                  }


              # ------------------------------------------------
              # GENERATE ORDER ID
              # ------------------------------------------------
              #
              # DynamoDB uses OrderId as the partition key.
              #
              # ------------------------------------------------

              order_id = str(uuid.uuid4())


              # ------------------------------------------------
              # CREATE ORDER RECORD
              # ------------------------------------------------

              order = {

                  "OrderId": order_id,

                  "Item": item,

                  "Quantity": quantity,

                  "CreatedAt": datetime.now(
                      timezone.utc
                  ).isoformat()
              }


              # ------------------------------------------------
              # WRITE ORDER TO DYNAMODB
              # ------------------------------------------------

              table.put_item(
                  Item=order
              )


              # ------------------------------------------------
              # RETURN SUCCESS RESPONSE
              # ------------------------------------------------

              return {

                  "statusCode": 201,

                  "headers": {
                      "Content-Type": "application/json"
                  },

                  "body": json.dumps({

                      "message": "Order created successfully",

                      "order": order

                  })
              }              

# ============================================================
# OUTPUTS
# ============================================================
#
# Outputs expose important Lambda information to:
#
#   - Parent CloudFormation stacks
#   - API Gateway stack
#   - Terraform
#   - GitHub Actions
#   - AWS CLI
#   - Manual testing
#
# ============================================================

Outputs:

  # ==========================================================
  # LAMBDA FUNCTION NAME
  # ==========================================================

  LambdaFunctionName:
    Description: >
      Name of the application Lambda function.

    Value: !Ref ApplicationFunction

  # ==========================================================
  # LAMBDA FUNCTION ARN
  # ==========================================================
  #
  # This is the most important output for API Gateway
  # integration.
  #
  # Integration flow:
  #
  #   Lambda CloudFormation Stack
  #             |
  #             | LambdaFunctionArn
  #             v
  #       API Gateway Stack
  #
  # ==========================================================

  LambdaFunctionArn:
    Description: >
      ARN of the application Lambda function.

    Value: !GetAtt ApplicationFunction.Arn

