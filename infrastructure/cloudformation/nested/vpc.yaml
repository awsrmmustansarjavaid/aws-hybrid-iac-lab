AWSTemplateFormatVersion: "2010-09-09"

# ============================================================
# HYBRID IaC AWS DEVOPS LAB
# ============================================================
#
# File:
#   infrastructure/cloudformation/nested/vpc.yaml
#
# Purpose:
#   This nested CloudFormation stack creates the NETWORK layer
#   of the Hybrid IaC AWS DevOps Lab.
#
#   The network is designed to support:
#
#     - EC2
#     - ECS
#     - EKS
#     - RDS
#     - Lambda
#     - ALB
#     - Other private AWS workloads
#
# ============================================================
# ARCHITECTURE
# ============================================================
#
#                              Internet
#                                  |
#                                  v
#                          Internet Gateway
#                                  |
#                   +--------------+--------------+
#                   |                             |
#                   v                             v
#            Public Subnet 1              Public Subnet 2
#             10.0.1.0/24                  10.0.2.0/24
#                   |                             |
#                   |                             |
#                   v                             |
#              NAT Gateway                       |
#                   |                             |
#                   +--------------+--------------+
#                                  |
#                                  v
#                         Private Route Table
#                                  |
#                   +--------------+--------------+
#                   |                             |
#                   v                             v
#            Private Subnet 1             Private Subnet 2
#             10.0.11.0/24                 10.0.12.0/24
#                   |                             |
#                   |                             |
#                   +--------------+--------------+
#                                  |
#                                  v
#                         Private AWS Workloads
#                                  |
#                         +--------+--------+
#                         |                 |
#                         v                 v
#                    EKS Worker        Other Private
#                       Nodes            Workloads
#
#
# ============================================================
# NETWORK FLOW
# ============================================================
#
# PUBLIC SUBNETS:
#
#   PublicSubnet1
#         |
#         v
#   PublicRouteTable
#         |
#         | 0.0.0.0/0
#         v
#   Internet Gateway
#         |
#         v
#      Internet
#
#
# PRIVATE SUBNETS:
#
#   PrivateSubnet1
#         |
#         |
#         +----------------------+
#                                |
#   PrivateSubnet2               |
#         |                      |
#         +----------+-----------+
#                    |
#                    v
#             PrivateRouteTable
#                    |
#                    | 0.0.0.0/0
#                    v
#               NAT Gateway
#                    |
#                    v
#             PublicSubnet1
#                    |
#                    v
#             Internet Gateway
#                    |
#                    v
#                 Internet
#
#
# ============================================================
# EKS NETWORK DESIGN
# ============================================================
#
# The EKS template places worker nodes in:
#
#   PrivateSubnet1
#   PrivateSubnet2
#
# Worker nodes:
#
#   - Do NOT receive public IPv4 addresses.
#   - Use the private route table.
#   - Use the NAT Gateway for outbound Internet access.
#
# Example:
#
#   EKS Worker Node
#          |
#          v
#   Private Subnet
#          |
#          v
#   Private Route Table
#          |
#          | 0.0.0.0/0
#          v
#   NAT Gateway
#          |
#          v
#   Internet Gateway
#          |
#          v
#       Internet
#
#
# This is important for EKS because worker nodes may need
# outbound connectivity for:
#
#   - ECR image pulls
#   - Kubernetes components
#   - Package downloads
#   - Container image downloads
#   - AWS APIs
#   - Operating system updates
#   - External Internet endpoints
#
#
# ============================================================
# NAT GATEWAY DESIGN
# ============================================================
#
# This lab intentionally uses:
#
#   ONE NAT Gateway
#
# The NAT Gateway is placed in:
#
#   PublicSubnet1
#
# The reason is cost control and simplicity for the lab.
#
# Architecture:
#
#   Private Subnets
#          |
#          v
#   One Private Route Table
#          |
#          v
#   One NAT Gateway
#          |
#          v
#   Internet Gateway
#
#
# IMPORTANT:
#
# One NAT Gateway is suitable for this learning lab.
#
# However, this is NOT the highest-availability production
# architecture.
#
# A production Multi-AZ architecture would normally use:
#
#   NAT Gateway 1 -> AZ 1
#   NAT Gateway 2 -> AZ 2
#
# with separate private route tables so that each private
# subnet uses the NAT Gateway in its own Availability Zone.
#
# This lab intentionally keeps ONE NAT Gateway to reduce:
#
#   - AWS cost
#   - Resource count
#   - Configuration complexity
#
#
# ============================================================
# NAT GATEWAY TRAFFIC
# ============================================================
#
# NAT Gateway provides OUTBOUND Internet connectivity.
#
# Example:
#
#   EKS Node
#      |
#      v
#   Private Subnet
#      |
#      v
#   Private Route Table
#      |
#      v
#   NAT Gateway
#      |
#      v
#   Internet Gateway
#      |
#      v
#   Internet
#
#
# IMPORTANT:
#
# NAT Gateway does NOT make the private subnet public.
#
# Resources in private subnets still:
#
#   - Do not receive public IPv4 addresses automatically.
#   - Are not directly reachable from the Internet through
#     the NAT Gateway.
#
# NAT Gateway primarily provides outbound connectivity.
#
#
# ============================================================
# NETWORK DESIGN
# ============================================================
#
# VPC:
#
#   10.0.0.0/16
#
# Public Subnets:
#
#   PublicSubnet1
#       10.0.1.0/24
#       AZ 1
#
#   PublicSubnet2
#       10.0.2.0/24
#       AZ 2
#
# Private Subnets:
#
#   PrivateSubnet1
#       10.0.11.0/24
#       AZ 1
#
#   PrivateSubnet2
#       10.0.12.0/24
#       AZ 2
#
#
# ============================================================
# ROUTE TABLE DESIGN
# ============================================================
#
# PUBLIC:
#
#   ONLY ONE PublicRouteTable
#
#   Used by:
#
#     - PublicSubnet1
#     - PublicSubnet2
#
#   Default route:
#
#     0.0.0.0/0 -> Internet Gateway
#
#
# PRIVATE:
#
#   ONLY ONE PrivateRouteTable
#
#   Used by:
#
#     - PrivateSubnet1
#     - PrivateSubnet2
#
#   Default route:
#
#     0.0.0.0/0 -> NAT Gateway
#
#
# ============================================================
# DESCRIPTION
# ============================================================

Description: >
  Network layer for the Hybrid IaC Lab.
  Creates a VPC with two public and two private subnets
  distributed across two Availability Zones.
  Uses one shared public route table and one shared private
  route table. A single NAT Gateway is deployed in the first
  public subnet to provide outbound Internet connectivity
  for private workloads such as EKS worker nodes.


# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # PROJECT NAME
  # ----------------------------------------------------------
  #
  # Example:
  #
  #   HybridIaCLab
  #
  # Used for resource names and tags.
  #

  ProjectName:
    Type: String

    Description: >
      Name of the project used for resource naming and tagging.


  # ----------------------------------------------------------
  # ENVIRONMENT
  # ----------------------------------------------------------
  #
  # Example:
  #
  #   dev
  #
  # Other examples:
  #
  #   test
  #   staging
  #   prod
  #

  Environment:
    Type: String

    Description: >
      Deployment environment for the infrastructure.


# ============================================================
# RESOURCES
# ============================================================

Resources:


  # ==========================================================
  # VPC
  # ==========================================================
  #
  # Main networking boundary for the AWS infrastructure.
  #
  # CIDR:
  #
  #   10.0.0.0/16
  #
  # ==========================================================

  VPC:
    Type: AWS::EC2::VPC

    Properties:

      # --------------------------------------------------------
      # VPC CIDR RANGE
      # --------------------------------------------------------
      #
      # Entire VPC network:
      #
      #   10.0.0.0/16
      #

      CidrBlock: 10.0.0.0/16


      # --------------------------------------------------------
      # DNS SUPPORT
      # --------------------------------------------------------
      #
      # Allows resources inside the VPC to perform DNS
      # resolution.
      #

      EnableDnsSupport: true


      # --------------------------------------------------------
      # DNS HOSTNAMES
      # --------------------------------------------------------
      #
      # Enables DNS hostnames for resources in the VPC.
      #

      EnableDnsHostnames: true


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name

          Value: !Sub "${ProjectName}-${Environment}-VPC"


        - Key: Project

          Value: !Ref ProjectName


        - Key: Environment

          Value: !Ref Environment


  # ==========================================================
  # INTERNET GATEWAY
  # ==========================================================
  #
  # Provides connectivity between the VPC and the Internet.
  #
  # IMPORTANT:
  #
  # Creating an Internet Gateway alone does NOT make a subnet
  # public.
  #
  # A public subnet requires:
  #
  #   1. A route table association.
  #   2. A default route to the Internet Gateway.
  #   3. Appropriate public addressing and security rules.
  #
  # ==========================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway

    Properties:

      Tags:

        - Key: Name

          Value: !Sub "${ProjectName}-${Environment}-IGW"


        - Key: Project

          Value: !Ref ProjectName


        - Key: Environment

          Value: !Ref Environment


  # ==========================================================
  # VPC / INTERNET GATEWAY ATTACHMENT
  # ==========================================================
  #
  # Attaches the Internet Gateway to the VPC.
  #
  # Relationship:
  #
  #   VPC
  #    |
  #    +---- Internet Gateway
  #
  # ==========================================================

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment

    Properties:

      # VPC that will use the Internet Gateway.

      VpcId: !Ref VPC


      # Internet Gateway being attached.

      InternetGatewayId: !Ref InternetGateway


  # ==========================================================
  # PUBLIC SUBNET 1
  # ==========================================================
  #
  # CIDR:
  #
  #   10.0.1.0/24
  #
  # Availability Zone:
  #
  #   First AZ returned by AWS.
  #
  # This subnet is used as the NAT Gateway subnet.
  #
  # ==========================================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet

    Properties:

      # Attach subnet to our VPC.

      VpcId: !Ref VPC


      # Network range for Public Subnet 1.

      CidrBlock: 10.0.1.0/24


      # --------------------------------------------------------
      # AVAILABILITY ZONE
      # --------------------------------------------------------
      #
      # Select the first Availability Zone.
      #

      AvailabilityZone:
        Fn::Select:

          - 0

          - Fn::GetAZs: !Ref AWS::Region


      # --------------------------------------------------------
      # PUBLIC IPv4 ADDRESS
      # --------------------------------------------------------
      #
      # Resources launched into this subnet can automatically
      # receive public IPv4 addresses when supported by their
      # launch configuration.
      #
      # The NAT Gateway is located in this public subnet.
      #

      MapPublicIpOnLaunch: true


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name

          Value: !Sub "${ProjectName}-${Environment}-PublicSubnet1"


        - Key: Tier

          Value: Public


        - Key: Project

          Value: !Ref ProjectName


        - Key: Environment

          Value: !Ref Environment


  # ==========================================================
  # PUBLIC SUBNET 2
  # ==========================================================
  #
  # CIDR:
  #
  #   10.0.2.0/24
  #
  # Availability Zone:
  #
  #   Second AZ returned by AWS.
  #
  # ==========================================================

  PublicSubnet2:
    Type: AWS::EC2::Subnet

    Properties:

      # Attach subnet to the VPC.

      VpcId: !Ref VPC


      # Network range for Public Subnet 2.

      CidrBlock: 10.0.2.0/24


      # Select the second Availability Zone.

      AvailabilityZone:
        Fn::Select:

          - 1

          - Fn::GetAZs: !Ref AWS::Region


      # Automatically assign public IPv4 addresses.

      MapPublicIpOnLaunch: true


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name

          Value: !Sub "${ProjectName}-${Environment}-PublicSubnet2"


        - Key: Tier

          Value: Public


        - Key: Project

          Value: !Ref ProjectName


        - Key: Environment

          Value: !Ref Environment


  # ==========================================================
  # PRIVATE SUBNET 1
  # ==========================================================
  #
  # CIDR:
  #
  #   10.0.11.0/24
  #
  # Availability Zone:
  #
  #   First AZ
  #
  # Used by:
  #
  #   - EKS worker nodes
  #   - Private application workloads
  #
  # ==========================================================

  PrivateSubnet1:
    Type: AWS::EC2::Subnet

    Properties:

      # Attach subnet to the VPC.

      VpcId: !Ref VPC


      # Private network range.

      CidrBlock: 10.0.11.0/24


      # Place subnet in the first Availability Zone.

      AvailabilityZone:
        Fn::Select:

          - 0

          - Fn::GetAZs: !Ref AWS::Region


      # --------------------------------------------------------
      # PUBLIC IPv4 ADDRESS
      # --------------------------------------------------------
      #
      # Private resources must not automatically receive public
      # IPv4 addresses.
      #

      MapPublicIpOnLaunch: false


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name

          Value: !Sub "${ProjectName}-${Environment}-PrivateSubnet1"


        - Key: Tier

          Value: Private


        - Key: Project

          Value: !Ref ProjectName


        - Key: Environment

          Value: !Ref Environment


  # ==========================================================
  # PRIVATE SUBNET 2
  # ==========================================================
  #
  # CIDR:
  #
  #   10.0.12.0/24
  #
  # Availability Zone:
  #
  #   Second AZ
  #
  # Used by:
  #
  #   - EKS worker nodes
  #   - Private application workloads
  #
  # ==========================================================

  PrivateSubnet2:
    Type: AWS::EC2::Subnet

    Properties:

      # Attach subnet to the VPC.

      VpcId: !Ref VPC


      # Private network range.

      CidrBlock: 10.0.12.0/24


      # Place subnet in the second Availability Zone.

      AvailabilityZone:
        Fn::Select:

          - 1

          - Fn::GetAZs: !Ref AWS::Region


      # Do not automatically assign public IPv4 addresses.

      MapPublicIpOnLaunch: false


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name

          Value: !Sub "${ProjectName}-${Environment}-PrivateSubnet2"


        - Key: Tier

          Value: Private


        - Key: Project

          Value: !Ref ProjectName


        - Key: Environment

          Value: !Ref Environment


  # ==========================================================
  # PUBLIC ROUTE TABLE
  # ==========================================================
  #
  # ONLY ONE public route table is created.
  #
  # Used by:
  #
  #   - PublicSubnet1
  #   - PublicSubnet2
  #
  # Default route:
  #
  #   0.0.0.0/0
  #          |
  #          v
  #   Internet Gateway
  #
  # This route table makes the two public subnets public.
  #
  # ==========================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:

      # Route table belongs to our VPC.

      VpcId: !Ref VPC


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name

          Value: !Sub "${ProjectName}-${Environment}-PublicRouteTable"


        - Key: Tier

          Value: Public


        - Key: Project

          Value: !Ref ProjectName


        - Key: Environment

          Value: !Ref Environment


  # ==========================================================
  # DEFAULT PUBLIC ROUTE
  # ==========================================================
  #
  # Creates:
  #
  #   Destination:
  #
  #       0.0.0.0/0
  #
  #   Target:
  #
  #       Internet Gateway
  #
  # ==========================================================

  DefaultPublicRoute:
    Type: AWS::EC2::Route


    # --------------------------------------------------------
    # DEPENDS ON
    # --------------------------------------------------------
    #
    # Ensure the Internet Gateway is attached to the VPC before
    # creating the route.
    #

    DependsOn: VPCGatewayAttachment


    Properties:

      # Route table receiving this route.

      RouteTableId: !Ref PublicRouteTable


      # Default IPv4 route.

      DestinationCidrBlock: 0.0.0.0/0


      # Send traffic to the Internet Gateway.

      GatewayId: !Ref InternetGateway


  # ==========================================================
  # ELASTIC IP FOR NAT GATEWAY
  # ==========================================================
  #
  # A NAT Gateway requires an Elastic IP address when using
  # a public NAT Gateway.
  #
  # The Elastic IP provides the public IPv4 address used by
  # the NAT Gateway when communicating with the Internet.
  #
  # Architecture:
  #
  #   Private Resource
  #          |
  #          v
  #      NAT Gateway
  #          |
  #          v
  #      Elastic IP
  #          |
  #          v
  #       Internet
  #
  # ==========================================================

  NATGatewayEIP:
    Type: AWS::EC2::EIP

    Properties:

      # --------------------------------------------------------
      # DOMAIN
      # --------------------------------------------------------
      #
      # "vpc" means this Elastic IP is allocated for use inside
      # a VPC.
      #

      Domain: vpc


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name

          Value: !Sub "${ProjectName}-${Environment}-NAT-EIP"


        - Key: Project

          Value: !Ref ProjectName


        - Key: Environment

          Value: !Ref Environment


  # ==========================================================
  # NAT GATEWAY
  # ==========================================================
  #
  # The NAT Gateway provides outbound Internet connectivity
  # for resources located in private subnets.
  #
  # IMPORTANT:
  #
  # The NAT Gateway MUST be placed inside a PUBLIC subnet.
  #
  # In this lab:
  #
  #   NAT Gateway
  #        |
  #        v
  #   PublicSubnet1
  #        |
  #        v
  #   PublicRouteTable
  #        |
  #        v
  #   Internet Gateway
  #
  # Private resources use the NAT Gateway through the private
  # route table.
  #
  # ==========================================================

  NATGateway:
    Type: AWS::EC2::NatGateway


    # --------------------------------------------------------
    # DEPENDS ON
    # --------------------------------------------------------
    #
    # Make sure the Internet Gateway is attached before the
    # NAT Gateway is created.
    #
    # The public subnet must have a functional path toward the
    # Internet Gateway.
    #

    DependsOn: VPCGatewayAttachment


    Properties:

      # --------------------------------------------------------
      # ELASTIC IP
      # --------------------------------------------------------
      #
      # Public IPv4 address assigned to the NAT Gateway.
      #

      AllocationId: !GetAtt NATGatewayEIP.AllocationId


      # --------------------------------------------------------
      # PUBLIC SUBNET
      # --------------------------------------------------------
      #
      # NAT Gateway is intentionally placed in PublicSubnet1.
      #
      # This subnet has a route:
      #
      #   0.0.0.0/0 -> Internet Gateway
      #
      SubnetId: !Ref PublicSubnet1


      # --------------------------------------------------------
      # CONNECTIVITY TYPE
      # --------------------------------------------------------
      #
      # Public NAT Gateway provides Internet connectivity to
      # resources in private subnets.
      #

      ConnectivityType: public


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name

          Value: !Sub "${ProjectName}-${Environment}-NATGateway"


        - Key: Tier

          Value: Public


        - Key: Project

          Value: !Ref ProjectName


        - Key: Environment

          Value: !Ref Environment


  # ==========================================================
  # PRIVATE ROUTE TABLE
  # ==========================================================
  #
  # ONLY ONE private route table is created.
  #
  # Used by:
  #
  #   - PrivateSubnet1
  #   - PrivateSubnet2
  #
  # Default route:
  #
  #   0.0.0.0/0
  #          |
  #          v
  #     NAT Gateway
  #
  # Therefore private resources can initiate outbound Internet
  # connections without having public IP addresses.
  #
  # ==========================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable

    Properties:

      # Route table belongs to our VPC.

      VpcId: !Ref VPC


      # --------------------------------------------------------
      # TAGS
      # --------------------------------------------------------

      Tags:

        - Key: Name

          Value: !Sub "${ProjectName}-${Environment}-PrivateRouteTable"


        - Key: Tier

          Value: Private


        - Key: Project

          Value: !Ref ProjectName


        - Key: Environment

          Value: !Ref Environment


  # ==========================================================
  # DEFAULT PRIVATE ROUTE
  # ==========================================================
  #
  # This is the most important addition for EKS.
  #
  # Creates:
  #
  #   Destination:
  #
  #       0.0.0.0/0
  #
  #   Target:
  #
  #       NAT Gateway
  #
  # Result:
  #
  #   PrivateSubnet1
  #          |
  #   PrivateSubnet2
  #          |
  #          v
  #   PrivateRouteTable
  #          |
  #          v
  #      NAT Gateway
  #          |
  #          v
  #   Internet Gateway
  #          |
  #          v
  #       Internet
  #
  # ==========================================================

  DefaultPrivateRoute:
    Type: AWS::EC2::Route


    # --------------------------------------------------------
    # DEPENDS ON
    # --------------------------------------------------------
    #
    # Ensure NAT Gateway exists before creating the route.
    #

    DependsOn: NATGateway


    Properties:

      # Private route table receiving this route.

      RouteTableId: !Ref PrivateRouteTable


      # Default IPv4 route.

      DestinationCidrBlock: 0.0.0.0/0


      # Send private subnet traffic to the NAT Gateway.

      NatGatewayId: !Ref NATGateway


  # ==========================================================
  # PUBLIC SUBNET 1 ROUTE TABLE ASSOCIATION
  # ==========================================================
  #
  # Associates PublicSubnet1 with the shared public route
  # table.
  #
  # Result:
  #
  #   PublicSubnet1
  #         |
  #         v
  #   PublicRouteTable
  #         |
  #         v
  #   Internet Gateway
  #
  # PublicSubnet1 also contains the NAT Gateway.
  #
  # ==========================================================

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      # Public subnet being associated.

      SubnetId: !Ref PublicSubnet1


      # Shared public route table.

      RouteTableId: !Ref PublicRouteTable


  # ==========================================================
  # PUBLIC SUBNET 2 ROUTE TABLE ASSOCIATION
  # ==========================================================
  #
  # Associates PublicSubnet2 with the SAME public route table.
  #
  # ==========================================================

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      # Public subnet being associated.

      SubnetId: !Ref PublicSubnet2


      # SAME shared public route table.

      RouteTableId: !Ref PublicRouteTable


  # ==========================================================
  # PRIVATE SUBNET 1 ROUTE TABLE ASSOCIATION
  # ==========================================================
  #
  # Associates PrivateSubnet1 with the shared private route
  # table.
  #
  # The private route table contains:
  #
  #   0.0.0.0/0 -> NAT Gateway
  #
  # ==========================================================

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      # Private subnet being associated.

      SubnetId: !Ref PrivateSubnet1


      # Shared private route table.

      RouteTableId: !Ref PrivateRouteTable


  # ==========================================================
  # PRIVATE SUBNET 2 ROUTE TABLE ASSOCIATION
  # ==========================================================
  #
  # Associates PrivateSubnet2 with the SAME private route
  # table.
  #
  # ==========================================================

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation

    Properties:

      # Private subnet being associated.

      SubnetId: !Ref PrivateSubnet2


      # SAME shared private route table.

      RouteTableId: !Ref PrivateRouteTable


# ============================================================
# OUTPUTS
# ============================================================
#
# Outputs expose important resource IDs to:
#
#   - Parent CloudFormation stack
#   - AWS Console
#   - AWS CLI
#   - Automation
#   - Future Terraform integration
#
# ============================================================

Outputs:


  # ==========================================================
  # VPC ID
  # ==========================================================

  VpcId:

    Description: >
      ID of the VPC created by this nested stack.

    Value: !Ref VPC

    Export:

      Name: !Sub "${ProjectName}-${Environment}-VpcId"


  # ==========================================================
  # PUBLIC SUBNET 1 ID
  # ==========================================================

  PublicSubnet1Id:

    Description: >
      ID of Public Subnet 1.

    Value: !Ref PublicSubnet1


  # ==========================================================
  # PUBLIC SUBNET 2 ID
  # ==========================================================

  PublicSubnet2Id:

    Description: >
      ID of Public Subnet 2.

    Value: !Ref PublicSubnet2


  # ==========================================================
  # PRIVATE SUBNET 1 ID
  # ==========================================================

  PrivateSubnet1Id:

    Description: >
      ID of Private Subnet 1 used by private workloads
      including EKS worker nodes.

    Value: !Ref PrivateSubnet1


  # ==========================================================
  # PRIVATE SUBNET 2 ID
  # ==========================================================

  PrivateSubnet2Id:

    Description: >
      ID of Private Subnet 2 used by private workloads
      including EKS worker nodes.

    Value: !Ref PrivateSubnet2


  # ==========================================================
  # INTERNET GATEWAY ID
  # ==========================================================

  InternetGatewayId:

    Description: >
      ID of the Internet Gateway attached to the VPC.

    Value: !Ref InternetGateway


  # ==========================================================
  # NAT GATEWAY ID
  # ==========================================================
  #
  # Useful for:
  #
  #   - AWS CLI verification
  #   - Troubleshooting
  #   - Future Terraform integration
  #   - Monitoring
  #
  # ==========================================================

  NatGatewayId:

    Description: >
      ID of the NAT Gateway providing outbound Internet
      connectivity to private subnets.

    Value: !Ref NATGateway


  # ==========================================================
  # NAT GATEWAY ELASTIC IP
  # ==========================================================

  NatGatewayEip:

    Description: >
      Elastic IP address associated with the NAT Gateway.

    Value: !Ref NATGatewayEIP


  # ==========================================================
  # PUBLIC ROUTE TABLE ID
  # ==========================================================

  PublicRouteTableId:

    Description: >
      ID of the single public route table used by all public
      subnets.

    Value: !Ref PublicRouteTable


  # ==========================================================
  # PRIVATE ROUTE TABLE ID
  # ==========================================================

  PrivateRouteTableId:

    Description: >
      ID of the single private route table used by all private
      subnets. The table routes Internet-bound traffic through
      the NAT Gateway.

    Value: !Ref PrivateRouteTable