# ============================================================
# AWS HYBRID IaC LAB
# AMAZON EKS KUBERNETES PLATFORM
# ============================================================
#
# File:
#
#   infrastructure/cloudformation/nested/eks.yaml
#
# Purpose:
#
#   Creates an Amazon EKS Kubernetes cluster with an AWS
#   managed node group.
#
# ============================================================
# PROJECT NAMING STANDARD
# ============================================================
#
# IMPORTANT:
#
# This project uses ONE consistent project name across the
# entire Hybrid IaC lab:
#
#   ProjectName = hybridiaclab
#
# The environment used by this lab is:
#
#   Environment = dev
#
# Therefore the standard resource naming pattern is:
#
#   hybridiaclab-dev-<ResourceName>
#
# Examples:
#
#   EKS Cluster:
#     hybridiaclab-dev-EKS
#
#   EKS Node Group:
#     hybridiaclab-dev-NodeGroup
#
#   EKS Cluster IAM Role:
#     hybridiaclab-dev-EKSClusterRole
#
#   EKS Node IAM Role:
#     hybridiaclab-dev-EKSNodeRole
#
# This naming convention MUST NOT be changed to:
#
#   HybridIaCLab
#   Hybrid-IaC-Lab
#   hybrid-iac-lab
#
# The Terraform project name is:
#
#   project_name = "hybridiaclab"
#
# The CloudFormation root stack therefore follows:
#
#   hybridiaclab-dev-MainStack
#
# ============================================================
# RESOURCES CREATED
# ============================================================
#
# 1. EKS Cluster IAM Role
# 2. EKS Node IAM Role
# 3. EKS Kubernetes Cluster
# 4. EKS Managed Node Group
#
# ============================================================
# ARCHITECTURE
# ============================================================
#
# AWS VPC
#     |
#     +-------------------+
#     |                   |
#     v                   v
# Private Subnet 1    Private Subnet 2
#     |                   |
#     +---------+---------+
#               |
#               v
#        Amazon EKS
#       Kubernetes
#          Cluster
#               |
#          +----+----+
#          |         |
#          v         v
#     Worker Node  Worker Node
#      t3.medium    t3.medium
#          |         |
#          +----+----+
#               |
#               v
#        Kubernetes Pods
#
# ============================================================
# IMPORTANT
# ============================================================
#
# This template creates an actual EKS control plane and EC2
# worker nodes.
#
# EKS is considerably more expensive than the basic ECS
# Fargate lab.
#
# For cost control, use:
#
#   MinSize:     1
#   DesiredSize: 1
#   MaxSize:     2
#
# and DELETE the EKS stack when you finish practicing.
#
# ============================================================
# KUBERNETES VERSION
# ============================================================
#
# This lab uses:
#
#   KubernetesVersion = 1.33
#
# The Kubernetes version is defined as a CloudFormation
# parameter rather than being hard-coded in the EKS resource.
#
# Default:
#
#   1.33
#
# If your AWS region/account does not support this version,
# deploy the stack with another EKS-supported version by
# overriding the KubernetesVersion parameter.
#
# ============================================================
# NETWORK DESIGN
# ============================================================
#
# EKS control-plane API endpoint:
#
#   Public access  = ENABLED
#   Private access = ENABLED
#
# Worker nodes:
#
#   PrivateSubnet1Id
#   PrivateSubnet2Id
#
# Nodes do not receive public IP addresses.
#
# They therefore require suitable outbound connectivity through
# the VPC, normally using a NAT Gateway, VPC endpoints, or
# another appropriate network design.
#
# ============================================================
# AWS CLI / KUBECTL LAB COMMANDS
# ============================================================
#
# These commands are examples for working with this EKS stack.
#
# Run CloudFormation commands from:
#
#   infrastructure/cloudformation/
#
# ============================================================
# 1. VERIFY AWS CLI
# ============================================================
#
# aws --version
#
# ============================================================
# 2. VERIFY AWS ACCOUNT
# ============================================================
#
# aws sts get-caller-identity
#
# ============================================================
# 3. CHECK AWS REGION
# ============================================================
#
# aws configure get region
#
# ============================================================
# 4. CHECK AVAILABLE EKS VERSIONS
# ============================================================
#
# aws eks describe-addon-versions `
#   --query "addons[].addonVersions[].compatibilities[].clusterVersion" `
#   --output text `
#   --region us-east-1
#
# ============================================================
# 5. CHECK VPC
# ============================================================
#
# aws ec2 describe-vpcs `
#   --query "Vpcs[].{VpcId:VpcId,Cidr:CidrBlock}" `
#   --output table `
#   --region us-east-1
#
# ============================================================
# 6. CHECK PRIVATE SUBNETS
# ============================================================
#
# aws ec2 describe-subnets `
#   --query "Subnets[].{SubnetId:SubnetId,VpcId:VpcId,AZ:AvailabilityZone,Cidr:CidrBlock}" `
#   --output table `
#   --region us-east-1
#
# ============================================================
# 7. VALIDATE CLOUDFORMATION TEMPLATE
# ============================================================
#
# aws cloudformation validate-template `
#   --template-body file://nested/eks.yaml `
#   --region us-east-1
#
# ============================================================
# 8. DEPLOY EKS STACK
# ============================================================
#
# The ProjectName and Environment values MUST follow the
# project's standard naming convention:
#
#   ProjectName = hybridiaclab
#   Environment = dev
#
# Example:
#
# aws cloudformation deploy `
#   --template-file nested/eks.yaml `
#   --stack-name hybridiaclab-dev-EKS `
#   --parameter-overrides `
#     ProjectName=hybridiaclab `
#     Environment=dev `
#     VpcId=vpc-xxxxxxxxxxxxxxxxx `
#     PrivateSubnet1Id=subnet-xxxxxxxxxxxxxxxxx `
#     PrivateSubnet2Id=subnet-yyyyyyyyyyyyyyyyy `
#   --capabilities CAPABILITY_NAMED_IAM `
#   --region us-east-1
#
# ============================================================
# 9. CHECK CLOUDFORMATION STACK
# ============================================================
#
# aws cloudformation describe-stacks `
#   --stack-name hybridiaclab-dev-EKS `
#   --region us-east-1
#
# ============================================================
# 10. WATCH CLOUDFORMATION EVENTS
# ============================================================
#
# aws cloudformation describe-stack-events `
#   --stack-name hybridiaclab-dev-EKS `
#   --region us-east-1
#
# ============================================================
# EKS CLI
# ============================================================
#
# ============================================================
# 11. LIST EKS CLUSTERS
# ============================================================
#
# aws eks list-clusters `
#   --region us-east-1
#
# ============================================================
# 12. DESCRIBE EKS CLUSTER
# ============================================================
#
# The cluster name is generated from:
#
#   ${ProjectName}-${Environment}-EKS
#
# With the lab values:
#
#   hybridiaclab-dev-EKS
#
# ============================================================
#
# aws eks describe-cluster `
#   --name hybridiaclab-dev-EKS `
#   --region us-east-1
#
# ============================================================
# 13. CHECK CLUSTER STATUS
# ============================================================
#
# aws eks describe-cluster `
#   --name hybridiaclab-dev-EKS `
#   --query "cluster.{Name:name,Status:status,Version:version,Endpoint:endpoint}" `
#   --output table `
#   --region us-east-1
#
# Expected:
#
#   Status = ACTIVE
#
# ============================================================
# 14. LIST NODE GROUPS
# ============================================================
#
# aws eks list-nodegroups `
#   --cluster-name hybridiaclab-dev-EKS `
#   --region us-east-1
#
# ============================================================
# 15. DESCRIBE NODE GROUP
# ============================================================
#
# aws eks describe-nodegroup `
#   --cluster-name hybridiaclab-dev-EKS `
#   --nodegroup-name hybridiaclab-dev-NodeGroup `
#   --region us-east-1
#
# ============================================================
# 16. CHECK NODE GROUP STATUS
# ============================================================
#
# aws eks describe-nodegroup `
#   --cluster-name hybridiaclab-dev-EKS `
#   --nodegroup-name hybridiaclab-dev-NodeGroup `
#   --query "nodegroup.{Status:status,Desired:scalingConfig.desiredSize,Min:scalingConfig.minSize,Max:scalingConfig.maxSize}" `
#   --output table `
#   --region us-east-1
#
# ============================================================
# KUBECTL CONFIGURATION
# ============================================================
#
# Before using kubectl, configure your local kubeconfig.
#
# ============================================================
# 17. CHECK KUBECTL
# ============================================================
#
# kubectl version --client
#
# ============================================================
# 18. UPDATE KUBECONFIG
# ============================================================
#
# aws eks update-kubeconfig `
#   --region us-east-1 `
#   --name hybridiaclab-dev-EKS
#
# ============================================================
# 19. CHECK CURRENT KUBECTL CONTEXT
# ============================================================
#
# kubectl config current-context
#
# ============================================================
# 20. VIEW KUBERNETES NODES
# ============================================================
#
# kubectl get nodes
#
# Expected:
#
#   STATUS = Ready
#
# ============================================================
# 21. DETAILED NODE INFORMATION
# ============================================================
#
# kubectl get nodes -o wide
#
# ============================================================
# 22. DESCRIBE NODE
# ============================================================
#
# kubectl describe nodes
#
# ============================================================
# 23. CHECK KUBERNETES SYSTEM PODS
# ============================================================
#
# kubectl get pods -A
#
# ============================================================
# 24. CHECK ALL NAMESPACES
# ============================================================
#
# kubectl get namespaces
#
# ============================================================
# KUBERNETES PRACTICE
# ============================================================
#
# Create a simple nginx deployment:
#
# kubectl create deployment nginx `
#   --image=nginx:alpine
#
# ============================================================
# 25. CHECK DEPLOYMENT
# ============================================================
#
# kubectl get deployments
#
# ============================================================
# 26. CHECK PODS
# ============================================================
#
# kubectl get pods
#
# ============================================================
# 27. EXPOSE DEPLOYMENT
# ============================================================
#
# kubectl expose deployment nginx `
#   --port=80 `
#   --target-port=80 `
#   --type=LoadBalancer
#
# ============================================================
# 28. CHECK SERVICE
# ============================================================
#
# kubectl get services
#
# ============================================================
# 29. WATCH SERVICE
# ============================================================
#
# kubectl get service nginx -w
#
# ============================================================
# 30. SCALE DEPLOYMENT
# ============================================================
#
# kubectl scale deployment nginx `
#   --replicas=2
#
# ============================================================
# 31. CHECK POD DISTRIBUTION
# ============================================================
#
# kubectl get pods -o wide
#
# ============================================================
# 32. CHECK DEPLOYMENT
# ============================================================
#
# kubectl describe deployment nginx
#
# ============================================================
# 33. VIEW POD LOGS
# ============================================================
#
# kubectl logs deployment/nginx
#
# ============================================================
# 34. DELETE PRACTICE DEPLOYMENT
# ============================================================
#
# kubectl delete service nginx
#
# kubectl delete deployment nginx
#
# ============================================================
# EKS ADD-ONS
# ============================================================
#
# EKS commonly uses managed add-ons for cluster functionality.
#
# ============================================================
# 35. LIST ADD-ONS
# ============================================================
#
# aws eks list-addons `
#   --cluster-name hybridiaclab-dev-EKS `
#   --region us-east-1
#
# ============================================================
# 36. CHECK EKS VPC CNI
# ============================================================
#
# aws eks describe-addon `
#   --cluster-name hybridiaclab-dev-EKS `
#   --addon-name vpc-cni `
#   --region us-east-1
#
# ============================================================
# IAM ROLE VERIFICATION
# ============================================================
#
# ============================================================
# 37. CHECK CLUSTER ROLE
# ============================================================
#
# aws iam get-role `
#   --role-name hybridiaclab-dev-EKSClusterRole
#
# ============================================================
# 38. CHECK NODE ROLE
# ============================================================
#
# aws iam get-role `
#   --role-name hybridiaclab-dev-EKSNodeRole
#
# ============================================================
# NETWORK TROUBLESHOOTING
# ============================================================
#
# If worker nodes do not become Ready, check:
#
#   1. Private subnet routing
#   2. NAT Gateway / VPC endpoints
#   3. Route tables
#   4. Security groups
#   5. EKS node IAM role
#   6. EKS VPC CNI
#
# Check route tables:
#
# aws ec2 describe-route-tables `
#   --query "RouteTables[].{RouteTableId:RouteTableId,VpcId:VpcId}" `
#   --output table `
#   --region us-east-1
#
# ============================================================
# CLOUDWATCH / EKS LOGGING
# ============================================================
#
# This basic template does not enable all EKS control-plane
# log types.
#
# That can be added later when you practice:
#
#   - API server logs
#   - Audit logs
#   - Authenticator logs
#   - Controller manager logs
#   - Scheduler logs
#
# ============================================================
# CLEANUP
# ============================================================
#
# IMPORTANT:
#
# Delete Kubernetes workloads before deleting the EKS cluster
# if they created external AWS resources such as Load Balancers.
#
# ============================================================
# 39. DELETE TEST WORKLOAD
# ============================================================
#
# kubectl delete service nginx
#
# kubectl delete deployment nginx
#
# ============================================================
# 40. DELETE EKS CLOUDFORMATION STACK
# ============================================================
#
# aws cloudformation delete-stack `
#   --stack-name hybridiaclab-dev-EKS `
#   --region us-east-1
#
# ============================================================
# 41. CHECK DELETION
# ============================================================
#
# aws cloudformation describe-stack-events `
#   --stack-name hybridiaclab-dev-EKS `
#   --region us-east-1
#
# ============================================================
# CLOUDFORMATION TEMPLATE
# ============================================================

AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Amazon EKS Kubernetes platform for the AWS Hybrid IaC Lab.
  Creates an EKS control plane and an AWS managed node group
  running EC2 worker nodes in private subnets.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # PROJECT NAME
  # ----------------------------------------------------------
  #
  # IMPORTANT:
  #
  # This value MUST match the Terraform project name:
  #
  #   project_name = "hybridiaclab"
  #
  # It is also used as the prefix for EKS resources.
  #
  # Example:
  #
  #   hybridiaclab-dev-EKS
  #
  # ----------------------------------------------------------

  ProjectName:
    Type: String
    Default: "hybridiaclab"
    Description: >
      Project name. Must match the Terraform project name
      "hybridiaclab".

  # ----------------------------------------------------------
  # ENVIRONMENT
  # ----------------------------------------------------------
  #
  # Current lab environment:
  #
  #   dev
  #
  # Resource names therefore follow:
  #
  #   hybridiaclab-dev-<ResourceName>
  #
  # ----------------------------------------------------------

  Environment:
    Type: String
    Default: "dev"
    Description: Deployment environment

  # ----------------------------------------------------------
  # KUBERNETES VERSION
  # ----------------------------------------------------------
  #
  # Kubernetes version used by the EKS control plane.
  #
  # Keeping this as a parameter makes the template easier
  # to maintain when AWS EKS introduces newer versions.
  #
  # ----------------------------------------------------------

  KubernetesVersion:
    Type: String
    Default: "1.33"
    Description: EKS Kubernetes version

  # ----------------------------------------------------------
  # VPC
  # ----------------------------------------------------------

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the EKS cluster will run

  # ----------------------------------------------------------
  # PRIVATE SUBNET 1
  # ----------------------------------------------------------

  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id
    Description: First private subnet for EKS

  # ----------------------------------------------------------
  # PRIVATE SUBNET 2
  # ----------------------------------------------------------

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id
    Description: Second private subnet for EKS

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # EKS CLUSTER IAM ROLE
  # ==========================================================
  #
  # Allows the Amazon EKS service to manage AWS resources
  # required by the Kubernetes control plane.
  #
  # Generated name:
  #
  #   hybridiaclab-dev-EKSClusterRole
  #
  # ==========================================================

  EKSClusterRole:
    Type: AWS::IAM::Role

    Properties:

      # ------------------------------------------------------
      # IAM ROLE NAME
      # ------------------------------------------------------

      RoleName: !Sub "${ProjectName}-${Environment}-EKSClusterRole"

      # ------------------------------------------------------
      # TRUST POLICY
      # ------------------------------------------------------
      #
      # Allows the Amazon EKS service to assume this role.
      #
      # ------------------------------------------------------

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - eks.amazonaws.com

            Action:
              - sts:AssumeRole

      # ------------------------------------------------------
      # MANAGED IAM POLICY
      # ------------------------------------------------------
      #
      # Provides the permissions required by the EKS
      # control plane.
      #
      # ------------------------------------------------------

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  # ==========================================================
  # EKS NODE IAM ROLE
  # ==========================================================
  #
  # IAM role assumed by the EC2 worker nodes.
  #
  # Generated name:
  #
  #   hybridiaclab-dev-EKSNodeRole
  #
  # ==========================================================

  EKSNodeRole:
    Type: AWS::IAM::Role

    Properties:

      # ------------------------------------------------------
      # IAM ROLE NAME
      # ------------------------------------------------------

      RoleName: !Sub "${ProjectName}-${Environment}-EKSNodeRole"

      # ------------------------------------------------------
      # TRUST POLICY
      # ------------------------------------------------------
      #
      # Allows EC2 worker nodes to assume this role.
      #
      # ------------------------------------------------------

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      # ------------------------------------------------------
      # MANAGED IAM POLICIES
      # ------------------------------------------------------

      ManagedPolicyArns:

        # Allows worker nodes to communicate with EKS.

        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy

        # Allows worker nodes to pull container images from ECR.

        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly

        # Allows the AWS VPC CNI to manage networking.

        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy

  # ==========================================================
  # EKS CLUSTER
  # ==========================================================
  #
  # Creates the Amazon EKS Kubernetes control plane.
  #
  # Generated cluster name:
  #
  #   hybridiaclab-dev-EKS
  #
  # ==========================================================

  EKSCluster:
    Type: AWS::EKS::Cluster

    Properties:

      # ------------------------------------------------------
      # CLUSTER NAME
      # ------------------------------------------------------
      #
      # Standard project naming:
      #
      #   <ProjectName>-<Environment>-EKS
      #
      # With the lab values:
      #
      #   hybridiaclab-dev-EKS
      #
      # ------------------------------------------------------

      Name: !Sub "${ProjectName}-${Environment}-EKS"

      # ------------------------------------------------------
      # KUBERNETES VERSION
      # ------------------------------------------------------

      Version: !Ref KubernetesVersion

      # ------------------------------------------------------
      # EKS CLUSTER IAM ROLE
      # ------------------------------------------------------

      RoleArn: !GetAtt EKSClusterRole.Arn

      # ======================================================
      # VPC CONFIGURATION
      # ======================================================

      ResourcesVpcConfig:

        # ----------------------------------------------------
        # VPC
        # ----------------------------------------------------

        VpcId: !Ref VpcId

        # ----------------------------------------------------
        # PRIVATE SUBNETS
        # ----------------------------------------------------
        #
        # The EKS control plane uses these subnets and the
        # managed node group will also use these subnets.
        #
        # ----------------------------------------------------

        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id

        # ----------------------------------------------------
        # API ENDPOINT ACCESS
        # ----------------------------------------------------
        #
        # Public access:
        #
        #   Allows kubectl access through the public EKS API
        #   endpoint.
        #
        # Private access:
        #
        #   Allows resources inside the VPC to communicate
        #   with the Kubernetes API endpoint privately.
        #
        # Both are enabled for this learning lab.
        #
        # ----------------------------------------------------

        EndpointPublicAccess: true
        EndpointPrivateAccess: true

      # ======================================================
      # TAGS
      # ======================================================

      Tags:

        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # EKS MANAGED NODE GROUP
  # ==========================================================
  #
  # AWS manages the lifecycle of the EC2 worker nodes.
  #
  # Generated node group name:
  #
  #   hybridiaclab-dev-NodeGroup
  #
  # ==========================================================

  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup

    DependsOn:
      - EKSCluster

    Properties:

      # ------------------------------------------------------
      # EKS CLUSTER
      # ------------------------------------------------------

      ClusterName: !Ref EKSCluster

      # ------------------------------------------------------
      # NODE GROUP NAME
      # ------------------------------------------------------
      #
      # Standard project naming:
      #
      #   <ProjectName>-<Environment>-NodeGroup
      #
      # ------------------------------------------------------

      NodegroupName: !Sub "${ProjectName}-${Environment}-NodeGroup"

      # ------------------------------------------------------
      # WORKER NODE IAM ROLE
      # ------------------------------------------------------

      NodeRole: !GetAtt EKSNodeRole.Arn

      # ------------------------------------------------------
      # PRIVATE SUBNETS
      # ------------------------------------------------------
      #
      # Worker nodes are deployed into private subnets.
      #
      # They do not receive public IP addresses.
      #
      # ------------------------------------------------------

      Subnets:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id

      # ------------------------------------------------------
      # EC2 INSTANCE TYPE
      # ------------------------------------------------------
      #
      # t3.medium is intentionally used for this Kubernetes
      # learning lab because Kubernetes components and
      # workloads require more resources than a minimal
      # EC2 web server.
      #
      # ------------------------------------------------------

      InstanceTypes:
        - t3.medium

      # ------------------------------------------------------
      # AMAZON LINUX 2023
      # ------------------------------------------------------

      AmiType: AL2023_x86_64_STANDARD

      # ------------------------------------------------------
      # CAPACITY TYPE
      # ------------------------------------------------------

      CapacityType: ON_DEMAND

      # ======================================================
      # AUTO SCALING CONFIGURATION
      # ======================================================

      ScalingConfig:

        # Minimum number of worker nodes.

        MinSize: 1

        # Number of worker nodes created initially.

        DesiredSize: 1

        # Maximum number of worker nodes.

        MaxSize: 2

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ==========================================================
  # CLUSTER NAME
  # ==========================================================
  #
  # Expected:
  #
  #   hybridiaclab-dev-EKS
  #
  # ==========================================================

  ClusterName:
    Description: EKS cluster name
    Value: !Ref EKSCluster

  # ==========================================================
  # CLUSTER ENDPOINT
  # ==========================================================

  ClusterEndpoint:
    Description: EKS Kubernetes API endpoint
    Value: !GetAtt EKSCluster.Endpoint

  # ==========================================================
  # NODE GROUP NAME
  # ==========================================================
  #
  # Expected:
  #
  #   hybridiaclab-dev-NodeGroup
  #
  # ==========================================================

  NodeGroupName:
    Description: EKS managed node group name
    Value: !Ref EKSNodeGroup

  # ==========================================================
  # CLUSTER ARN
  # ==========================================================

  ClusterArn:
    Description: EKS cluster ARN
    Value: !GetAtt EKSCluster.Arn

  # ==========================================================
  # NODE ROLE ARN
  # ==========================================================

  NodeRoleArn:
    Description: EKS worker node IAM role ARN
    Value: !GetAtt EKSNodeRole.Arn

