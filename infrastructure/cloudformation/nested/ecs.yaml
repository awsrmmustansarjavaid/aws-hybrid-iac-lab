AWSTemplateFormatVersion: "2010-09-09"

# ============================================================
# AWS HYBRID IaC LAB
# ECS FARGATE + APPLICATION LOAD BALANCER
# ============================================================
#
# File:
#   infrastructure/cloudformation/nested/ecs.yaml
#
# PURPOSE:
#   Creates the ECS Fargate application platform for the
#   Hybrid IaC AWS DevOps Lab.
#
# ============================================================
#
# IMPORTANT ARCHITECTURE NOTE
# ============================================================
#
# Although this template is stored under:
#
#   infrastructure/cloudformation/nested/
#
# it is currently deployed as an INDEPENDENT CloudFormation
# stack.
#
# It is NOT currently deployed as:
#
#   AWS::CloudFormation::Stack
#
# inside MainStack.
#
# This is intentional.
#
# The deployment pipeline follows this general flow:
#
#   Main Infrastructure
#          |
#          +--> VPC
#          +--> ECR
#          +--> Other infrastructure
#
#   GitHub Actions
#          |
#          +--> Build Docker image
#          |
#          +--> Push image to ECR
#          |
#          +--> Deploy/update ECS stack
#
# ECS is deployed only after the Docker image already exists
# in ECR.
#
#
# ============================================================
# ARCHITECTURE
# ============================================================
#
#                         INTERNET
#                             |
#                             | HTTP :80
#                             v
#                  +----------------------+
#                  | Application Load     |
#                  | Balancer             |
#                  | Internet-facing      |
#                  +----------+-----------+
#                             |
#                             | HTTP :80
#                             v
#                  +----------------------+
#                  | ECS Target Group     |
#                  | Target Type: IP      |
#                  +----------+-----------+
#                             |
#                    +--------+--------+
#                    |                 |
#                    v                 v
#             Private Subnet 1   Private Subnet 2
#                    |                 |
#                    v                 v
#               ECS Task          ECS Task
#               Fargate           Fargate
#                    |
#                    |
#                    v
#               NAT Gateway
#                    |
#                    v
#                Internet
#
#
# ============================================================
# NETWORK DESIGN
# ============================================================
#
# ALB:
#
#   - Internet-facing
#   - PublicSubnet1
#   - PublicSubnet2
#   - HTTP port 80
#
# ECS:
#
#   - Fargate
#   - PrivateSubnet1
#   - PrivateSubnet2
#   - No public IP
#   - AssignPublicIp: DISABLED
#
#
# IMPORTANT:
#
# Private ECS tasks require outbound network connectivity for
# operations such as:
#
#   - Pulling container images from ECR
#   - Sending logs to CloudWatch Logs
#   - Accessing external APIs
#
# This lab uses a NAT Gateway for that outbound connectivity.
#
# VPC endpoints can be introduced later as an optimization.
#
#
# ============================================================
# MULTI-AZ DESIGN
# ============================================================
#
# ALB:
#
#   PublicSubnet1
#   PublicSubnet2
#
# ECS:
#
#   PrivateSubnet1
#   PrivateSubnet2
#
# The ALB is therefore deployed across two Availability Zones.
#
# However:
#
#   DesiredCount: 1
#
# means that only ONE ECS task is maintained.
#
# Therefore, one task does NOT provide application redundancy
# across both Availability Zones.
#
# For a more highly available deployment:
#
#   DesiredCount: 2
#
# could be used.
#
# ============================================================
# SECURITY GROUP FLOW
# ============================================================
#
# INTERNET
#    |
#    | TCP 80
#    v
# ALB SECURITY GROUP
#    |
#    | TCP 80
#    | ONLY from ALB Security Group
#    v
# ECS SECURITY GROUP
#    |
#    v
# ECS FARGATE TASK
#
#
# IMPORTANT:
#
# ECS port 80 is NOT publicly accessible.
#
# There is intentionally NO rule:
#
#   0.0.0.0/0 -> ECS TCP 80
#
# Only the ALB security group can access the ECS tasks.
#
#
# ============================================================
# HTTP / HTTPS DESIGN
# ============================================================
#
# This learning lab currently uses HTTP.
#
# Traffic:
#
#   Internet
#      |
#      | HTTP :80
#      v
#     ALB
#      |
#      | HTTP :80
#      v
#   ECS Task
#
# HTTP is unencrypted.
#
# It is acceptable for this learning environment.
#
# A production architecture should normally use:
#
#   Internet
#      |
#      | HTTPS :443
#      v
#     ALB
#      |
#      | HTTP/HTTPS
#      v
#   ECS Task
#
# Production HTTPS would normally require:
#
#   - ACM certificate
#   - ALB HTTPS listener
#   - HTTP -> HTTPS redirect
#   - appropriate security group rules
#
# HTTPS is intentionally NOT included in this version.
#
#
# ============================================================
# ECR / DOCKER IMAGE DESIGN
# ============================================================
#
# ECR repository creation belongs to:
#
#   ecr.yaml
#
# This template does NOT create an ECR repository.
#
# Instead, ECS receives the COMPLETE Docker image URI through
# the CloudFormation parameter:
#
#   EcrImageUri
#
#
# Example:
#
#   537236558357.dkr.ecr.us-east-1.amazonaws.com/
#   hybridiaclab-dev-app:abcdef1234567890
#
#
# The important design decision is that EcrImageUri contains
# BOTH:
#
#   Repository URI
#        +
#   Immutable image tag
#
#
# Therefore the ECS Task Definition simply uses:
#
#   Image:
#     !Ref EcrImageUri
#
#
# ============================================================
# WHY EcrImageUri IS USED
# ============================================================
#
# Your docker.yml deployment passes:
#
#   EcrImageUri=$IMAGE_URI
#
# Therefore the ECS template must define:
#
#   EcrImageUri
#
# as a CloudFormation parameter.
#
# The previous template instead defined:
#
#   EcrRepositoryUri
#   ImageTag
#
# That did NOT match docker.yml.
#
# FINAL CONTRACT:
#
#   docker.yml
#       |
#       | EcrImageUri=$IMAGE_URI
#       v
#   ecs.yaml
#       |
#       | EcrImageUri
#       v
#   TaskDefinition.Image
#
#
# ============================================================
# IMMUTABLE IMAGE TAGGING
# ============================================================
#
# The image should NOT use:
#
#   latest
#
# Instead, GitHub Actions should use an immutable tag such as:
#
#   Git commit SHA
#
# Example:
#
#   abcdef1234567890
#
# Docker image:
#
#   ECR Repository
#          +
#   Git SHA
#          |
#          v
#   EcrImageUri
#
# Example:
#
#   537236558357.dkr.ecr.us-east-1.amazonaws.com/
#   hybridiaclab-dev-app:abcdef1234567890
#
#
# ============================================================
# ECR OUTPUT NAME
# ============================================================
#
# The ECR template should expose the repository URI using:
#
#   RepositoryUri
#
# This is the canonical ECR repository URI output.
#
# Example:
#
#   RepositoryUri =
#   537236558357.dkr.ecr.us-east-1.amazonaws.com/
#   hybridiaclab-dev-app
#
# docker.yml can then append the immutable image tag and
# construct:
#
#   IMAGE_URI=<RepositoryUri>:<GitSHA>
#
# The final IMAGE_URI is passed to this ECS template as:
#
#   EcrImageUri
#
#
# ============================================================
# ECR LIFECYCLE
# ============================================================
#
# ECR lifecycle rules belong in:
#
#   ecr.yaml
#
# They are intentionally NOT duplicated here.
#
# Recommended learning-lab policy:
#
#   Keep the newest 10 images.
#
#
# ============================================================
# IAM DESIGN
# ============================================================
#
# This template creates:
#
#   ECSTaskExecutionRole
#
# This role is DIFFERENT from the GitHub Actions OIDC role.
#
#
# ECS:
#
#   ECS/Fargate
#       |
#       v
#   ECSTaskExecutionRole
#       |
#       +--> Pull image from ECR
#       |
#       +--> Write logs to CloudWatch
#
#
# GitHub Actions:
#
#   GitHub
#       |
#       v
#   OIDC
#       |
#       v
#   GitHubActions IAM Role
#       |
#       +--> CloudFormation
#       +--> ECR
#       +--> ECS
#       +--> other deployment permissions
#
#
# The GitHub Actions IAM role MUST NOT be used as the ECS
# task execution role.
#
#
# ============================================================
# ECS TASK ROLE
# ============================================================
#
# This template intentionally does NOT create TaskRoleArn.
#
# Execution role:
#
#   Used by ECS/Fargate for infrastructure-level operations.
#
# Task role:
#
#   Used by the application running inside the container.
#
# If the application later needs:
#
#   - S3
#   - DynamoDB
#   - Secrets Manager
#   - SQS
#   - KMS
#   - other AWS APIs
#
# create a separate task role with least-privilege permissions.
#
#
# ============================================================
# HEALTH CHECKS
# ============================================================
#
# There are TWO independent health checks.
#
# ------------------------------------------------------------
# 1. ECS CONTAINER HEALTH CHECK
# ------------------------------------------------------------
#
# Runs INSIDE the container:
#
#   curl -f http://localhost/ || exit 1
#
# Therefore the Docker image must contain curl.
#
# If curl is not available, update the Docker image or change
# the command to an executable available in the image.
#
#
# ------------------------------------------------------------
# 2. ALB TARGET HEALTH CHECK
# ------------------------------------------------------------
#
# The ALB checks:
#
#   Protocol: HTTP
#   Port: 80
#   Path: /
#
# Expected response:
#
#   HTTP 200-399
#
#
# ============================================================
# DEPLOYMENT SAFETY
# ============================================================
#
# ECS deployment circuit breaker is enabled.
#
# If a new deployment fails:
#
#   ECS deployment
#        |
#        v
#   Health failure
#        |
#        v
#   Deployment circuit breaker
#        |
#        v
#   Automatic rollback
#
# This is useful when deploying immutable Docker images.
#
#
# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # PROJECT NAME
  # ----------------------------------------------------------
  #
  # Lowercase project name used for resource naming.
  #
  # Example:
  #
  #   hybridiaclab
  #
  ProjectName:
    Type: String
    Default: hybridiaclab

    Description: >
      Lowercase project name used for AWS resource naming.

    AllowedPattern: "^[a-z0-9-]+$"

    ConstraintDescription: >
      ProjectName must contain only lowercase letters,
      numbers, and hyphens.

  # ----------------------------------------------------------
  # ENVIRONMENT
  # ----------------------------------------------------------
  #
  # Deployment environment.
  #
  # Example:
  #
  #   dev
  #   test
  #   prod
  #
  Environment:
    Type: String
    Default: dev

    Description: >
      Deployment environment.

    AllowedPattern: "^[a-z0-9-]+$"

    ConstraintDescription: >
      Environment must contain only lowercase letters,
      numbers, and hyphens.

  # ----------------------------------------------------------
  # VPC ID
  # ----------------------------------------------------------
  #
  # The VPC is managed by the separate VPC infrastructure
  # stack.
  #
  VpcId:
    Type: AWS::EC2::VPC::Id

    Description: >
      VPC where the Application Load Balancer and ECS
      Fargate tasks will run.

  # ----------------------------------------------------------
  # PUBLIC SUBNET 1
  # ----------------------------------------------------------
  #
  # Used by the internet-facing Application Load Balancer.
  #
  PublicSubnet1Id:
    Type: AWS::EC2::Subnet::Id

    Description: >
      First public subnet used by the Application Load Balancer.

  # ----------------------------------------------------------
  # PUBLIC SUBNET 2
  # ----------------------------------------------------------
  #
  # Used by the internet-facing Application Load Balancer.
  #
  PublicSubnet2Id:
    Type: AWS::EC2::Subnet::Id

    Description: >
      Second public subnet used by the Application Load
      Balancer.

  # ----------------------------------------------------------
  # PRIVATE SUBNET 1
  # ----------------------------------------------------------
  #
  # Used by ECS Fargate tasks.
  #
  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id

    Description: >
      First private subnet used by ECS Fargate tasks.

  # ----------------------------------------------------------
  # PRIVATE SUBNET 2
  # ----------------------------------------------------------
  #
  # Used by ECS Fargate tasks.
  #
  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id

    Description: >
      Second private subnet used by ECS Fargate tasks.

  # ==========================================================
  # COMPLETE ECR IMAGE URI
  # ==========================================================
  #
  # IMPORTANT:
  #
  # This parameter replaces the previous combination:
  #
  #   EcrRepositoryUri
  #   ImageTag
  #
  # The complete image URI is supplied by docker.yml.
  #
  # Example:
  #
  #   537236558357.dkr.ecr.us-east-1.amazonaws.com/
  #   hybridiaclab-dev-app:abcdef1234567890
  #
  # This exactly matches:
  #
  #   EcrImageUri=$IMAGE_URI
  #
  # from the deployment workflow.
  #
  EcrImageUri:
    Type: String

    Description: >
      Complete immutable Amazon ECR Docker image URI,
      including the repository URI and image tag.

    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._:/@-]*$"

    ConstraintDescription: >
      EcrImageUri must contain a valid ECR image URI
      including its immutable image tag.

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # ECS CLUSTER
  # ==========================================================

  ECSCluster:
    Type: AWS::ECS::Cluster

    Properties:

      # ------------------------------------------------------
      # CLUSTER NAME
      # ------------------------------------------------------

      ClusterName:
        !Sub "${ProjectName}-${Environment}-ECSCluster"

      # ------------------------------------------------------
      # CONTAINER INSIGHTS
      # ------------------------------------------------------
      #
      # Enables enhanced ECS monitoring through CloudWatch.
      #
      # Useful for this DevOps learning lab.
      #
      ClusterSettings:

        - Name: containerInsights
          Value: enabled

      # ------------------------------------------------------
      # TAGS
      # ------------------------------------------------------

      Tags:

        - Key: Name
          Value:
            !Sub "${ProjectName}-${Environment}-ECSCluster"

        - Key: Project
          Value:
            !Ref ProjectName

        - Key: Environment
          Value:
            !Ref Environment

  # ==========================================================
  # ALB SECURITY GROUP
  # ==========================================================
  #
  # Allows public HTTP traffic to the internet-facing ALB.
  #
  # ==========================================================

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        !Sub "${ProjectName}-${Environment} ALB security group"

      VpcId:
        !Ref VpcId

      # ------------------------------------------------------
      # INBOUND HTTP
      # ------------------------------------------------------
      #
      # Internet
      #    |
      #    | TCP 80
      #    v
      # ALB
      #
      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public HTTP access to Application Load Balancer

      # ------------------------------------------------------
      # OUTBOUND
      # ------------------------------------------------------

      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound traffic

      # ------------------------------------------------------
      # TAGS
      # ------------------------------------------------------

      Tags:

        - Key: Name
          Value:
            !Sub "${ProjectName}-${Environment}-ALB-SG"

        - Key: Project
          Value:
            !Ref ProjectName

        - Key: Environment
          Value:
            !Ref Environment

  # ==========================================================
  # ECS SECURITY GROUP
  # ==========================================================
  #
  # Controls inbound traffic to ECS Fargate tasks.
  #
  # IMPORTANT:
  #
  # Port 80 is accessible ONLY from the ALB security group.
  #
  # ==========================================================

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup

    Properties:

      GroupDescription:
        !Sub "${ProjectName}-${Environment} ECS task security group"

      VpcId:
        !Ref VpcId

      # ------------------------------------------------------
      # INBOUND HTTP FROM ALB ONLY
      # ------------------------------------------------------
      #
      # ALB Security Group
      #       |
      #       | TCP 80
      #       v
      # ECS Security Group
      #
      SecurityGroupIngress:

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId:
            !Ref ALBSecurityGroup
          Description: HTTP access from Application Load Balancer

      # ------------------------------------------------------
      # OUTBOUND
      # ------------------------------------------------------
      #
      # Private ECS tasks need outbound connectivity for
      # operations such as ECR and CloudWatch Logs.
      #
      # The VPC routing/NAT configuration provides the path.
      #
      SecurityGroupEgress:

        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow outbound traffic

      # ------------------------------------------------------
      # TAGS
      # ------------------------------------------------------

      Tags:

        - Key: Name
          Value:
            !Sub "${ProjectName}-${Environment}-ECS-SG"

        - Key: Project
          Value:
            !Ref ProjectName

        - Key: Environment
          Value:
            !Ref Environment

  # ==========================================================
  # APPLICATION LOAD BALANCER
  # ==========================================================
  #
  # Internet-facing ALB deployed across two public subnets.
  #
  # ==========================================================

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer

    Properties:

      # ------------------------------------------------------
      # ALB NAME
      # ------------------------------------------------------

      Name:
        !Sub "${ProjectName}-${Environment}-ALB"

      # ------------------------------------------------------
      # INTERNET FACING
      # ------------------------------------------------------

      Scheme: internet-facing

      # ------------------------------------------------------
      # IP ADDRESS TYPE
      # ------------------------------------------------------

      IpAddressType: ipv4

      # ------------------------------------------------------
      # LOAD BALANCER TYPE
      # ------------------------------------------------------

      Type: application

      # ------------------------------------------------------
      # SECURITY GROUP
      # ------------------------------------------------------

      SecurityGroups:

        - !Ref ALBSecurityGroup

      # ------------------------------------------------------
      # PUBLIC SUBNETS
      # ------------------------------------------------------
      #
      # Two public subnets provide multi-AZ ALB placement.
      #
      Subnets:

        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id

      # ------------------------------------------------------
      # ACCESS LOGGING
      # ------------------------------------------------------
      #
      # Disabled for this cost-conscious learning lab.
      #
      # Production can enable ALB access logging to S3.
      #
      # LoadBalancerAttributes:
      #
      #   - Key: access_logs.s3.enabled
      #     Value: "true"

      # ------------------------------------------------------
      # TAGS
      # ------------------------------------------------------

      Tags:

        - Key: Name
          Value:
            !Sub "${ProjectName}-${Environment}-ALB"

        - Key: Project
          Value:
            !Ref ProjectName

        - Key: Environment
          Value:
            !Ref Environment

  # ==========================================================
  # ECS TARGET GROUP
  # ==========================================================
  #
  # Fargate with awsvpc networking requires:
  #
  #   TargetType: ip
  #
  # The target group therefore registers ECS task ENI IP
  # addresses.
  #
  # ==========================================================

  ECSTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup

    Properties:

      Name:
        !Sub "${ProjectName}-${Environment}-TG"

      # ------------------------------------------------------
      # FARGATE TARGET TYPE
      # ------------------------------------------------------

      TargetType: ip

      # ------------------------------------------------------
      # APPLICATION PROTOCOL
      # ------------------------------------------------------

      Protocol: HTTP

      # ------------------------------------------------------
      # APPLICATION PORT
      # ------------------------------------------------------

      Port: 80

      VpcId:
        !Ref VpcId

      # ------------------------------------------------------
      # ALB HEALTH CHECK
      # ------------------------------------------------------

      HealthCheckEnabled: true

      HealthCheckProtocol: HTTP

      HealthCheckPort: traffic-port

      HealthCheckPath: /

      HealthCheckIntervalSeconds: 30

      HealthCheckTimeoutSeconds: 5

      HealthyThresholdCount: 2

      UnhealthyThresholdCount: 3

      # ------------------------------------------------------
      # EXPECTED HTTP STATUS CODES
      # ------------------------------------------------------

      Matcher:
        HttpCode: "200-399"

      # ------------------------------------------------------
      # DEREGISTRATION DELAY
      # ------------------------------------------------------
      #
      # Gives existing connections time to finish when ECS
      # removes a task during deployment.
      #
      TargetGroupAttributes:

        - Key: deregistration_delay.timeout_seconds
          Value: "30"

      # ------------------------------------------------------
      # TAGS
      # ------------------------------------------------------

      Tags:

        - Key: Name
          Value:
            !Sub "${ProjectName}-${Environment}-TargetGroup"

        - Key: Project
          Value:
            !Ref ProjectName

        - Key: Environment
          Value:
            !Ref Environment

  # ==========================================================
  # ALB HTTP LISTENER
  # ==========================================================
  #
  # HTTP port 80 is intentionally used for this lab.
  #
  # ==========================================================

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener

    Properties:

      # ------------------------------------------------------
      # LOAD BALANCER
      # ------------------------------------------------------

      LoadBalancerArn:
        !Ref ApplicationLoadBalancer

      # ------------------------------------------------------
      # LISTENER PORT
      # ------------------------------------------------------

      Port: 80

      # ------------------------------------------------------
      # LISTENER PROTOCOL
      # ------------------------------------------------------

      Protocol: HTTP

      # ------------------------------------------------------
      # DEFAULT ACTION
      # ------------------------------------------------------
      #
      # Forward traffic to the ECS target group.
      #
      DefaultActions:

        - Type: forward

          TargetGroupArn:
            !Ref ECSTargetGroup

  # ==========================================================
  # ECS TASK EXECUTION ROLE
  # ==========================================================
  #
  # IMPORTANT:
  #
  # This is the ECS task execution role.
  #
  # It is NOT the GitHub Actions OIDC role.
  #
  # ==========================================================

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub "${ProjectName}-${Environment}-ECSTaskExecutionRole"

      # ------------------------------------------------------
      # TRUST POLICY
      # ------------------------------------------------------
      #
      # ECS tasks are allowed to assume this role.
      #
      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:

              Service:
                - ecs-tasks.amazonaws.com

            Action:
              - sts:AssumeRole

      # ------------------------------------------------------
      # AWS MANAGED ECS EXECUTION POLICY
      # ------------------------------------------------------
      #
      # Provides the standard ECS task execution permissions,
      # including:
      #
      #   - ECR image pulling
      #   - CloudWatch Logs
      #
      ManagedPolicyArns:

        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

      # ------------------------------------------------------
      # TAGS
      # ------------------------------------------------------

      Tags:

        - Key: Name
          Value:
            !Sub "${ProjectName}-${Environment}-ECSTaskExecutionRole"

        - Key: Project
          Value:
            !Ref ProjectName

        - Key: Environment
          Value:
            !Ref Environment

  # ==========================================================
  # CLOUDWATCH LOG GROUP
  # ==========================================================
  #
  # Stores container stdout/stderr logs.
  #
  # ==========================================================

  LogGroup:
    Type: AWS::Logs::LogGroup

    Properties:

      LogGroupName:
        !Sub "/ecs/${ProjectName}-${Environment}"

      # ------------------------------------------------------
      # LOG RETENTION
      # ------------------------------------------------------
      #
      # Seven days keeps the learning lab inexpensive.
      #
      RetentionInDays: 7

      # ------------------------------------------------------
      # TAGS
      # ------------------------------------------------------

      Tags:

        - Key: Project
          Value:
            !Ref ProjectName

        - Key: Environment
          Value:
            !Ref Environment

  # ==========================================================
  # ECS TASK DEFINITION
  # ==========================================================
  #
  # Defines the Fargate container configuration.
  #
  # ==========================================================

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition

    Properties:

      # ------------------------------------------------------
      # TASK FAMILY
      # ------------------------------------------------------

      Family:
        !Sub "${ProjectName}-${Environment}-Task"

      # ------------------------------------------------------
      # NETWORK MODE
      # ------------------------------------------------------
      #
      # awsvpc is required for Fargate.
      #
      NetworkMode: awsvpc

      # ------------------------------------------------------
      # FARGATE COMPATIBILITY
      # ------------------------------------------------------

      RequiresCompatibilities:

        - FARGATE

      # ------------------------------------------------------
      # CPU
      # ------------------------------------------------------
      #
      # 256 CPU units = 0.25 vCPU.
      #
      Cpu: "256"

      # ------------------------------------------------------
      # MEMORY
      # ------------------------------------------------------
      #
      # 512 MiB.
      #
      Memory: "512"

      # ------------------------------------------------------
      # EXECUTION ROLE
      # ------------------------------------------------------

      ExecutionRoleArn:
        !GetAtt ECSTaskExecutionRole.Arn

      # ------------------------------------------------------
      # TASK ROLE
      # ------------------------------------------------------
      #
      # Intentionally omitted.
      #
      # The application does not receive AWS API permissions
      # through a task role in this version of the lab.
      #
      # If required later, create a separate least-privilege
      # task role.
      #
      # TaskRoleArn:
      #   !GetAtt ECSTaskRole.Arn

      # ======================================================
      # CONTAINER DEFINITIONS
      # ======================================================

      ContainerDefinitions:

        - Name: application

          # --------------------------------------------------
          # IMMUTABLE ECR IMAGE
          # --------------------------------------------------
          #
          # The COMPLETE image URI is provided by docker.yml.
          #
          # Example:
          #
          #   537236558357.dkr.ecr.us-east-1.amazonaws.com/
          #   hybridiaclab-dev-app:abcdef1234567890
          #
          # This fixes the previous mismatch between:
          #
          #   docker.yml
          #
          # and:
          #
          #   ecs.yaml
          #
          Image:
            !Ref EcrImageUri

          # --------------------------------------------------
          # ESSENTIAL CONTAINER
          # --------------------------------------------------

          Essential: true

          # --------------------------------------------------
          # PORT MAPPING
          # --------------------------------------------------
          #
          # Application listens on port 80.
          #
          PortMappings:

            - ContainerPort: 80
              Protocol: tcp

          # ==================================================
          # ECS CONTAINER HEALTH CHECK
          # ==================================================
          #
          # Runs INSIDE the container.
          #
          # The Docker image must contain curl.
          #
          HealthCheck:

            Command:

              - CMD-SHELL
              - "curl -f http://localhost/ || exit 1"

            # ------------------------------------------------
            # CHECK INTERVAL
            # ------------------------------------------------

            Interval: 30

            # ------------------------------------------------
            # CHECK TIMEOUT
            # ------------------------------------------------

            Timeout: 5

            # ------------------------------------------------
            # FAILURE RETRIES
            # ------------------------------------------------

            Retries: 3

            # ------------------------------------------------
            # START PERIOD
            # ------------------------------------------------
            #
            # Allows the application time to start before
            # health-check failures count.
            #
            StartPeriod: 60

          # ==================================================
          # CLOUDWATCH LOGGING
          # ==================================================

          LogConfiguration:

            LogDriver: awslogs

            Options:

              # ------------------------------------------------
              # LOG GROUP
              # ------------------------------------------------

              awslogs-group:
                !Ref LogGroup

              # ------------------------------------------------
              # AWS REGION
              # ------------------------------------------------

              awslogs-region:
                !Ref AWS::Region

              # ------------------------------------------------
              # LOG STREAM PREFIX
              # ------------------------------------------------

              awslogs-stream-prefix: ecs

  # ==========================================================
  # ECS SERVICE
  # ==========================================================
  #
  # Maintains the desired number of Fargate tasks.
  #
  # ==========================================================

  ECSService:
    Type: AWS::ECS::Service

    # --------------------------------------------------------
    # DEPENDENCY
    # --------------------------------------------------------
    #
    # Ensure the ALB listener exists before the ECS service
    # begins registering tasks with the target group.
    #
    DependsOn:

      - ALBListener

    Properties:

      # ------------------------------------------------------
      # SERVICE NAME
      # ------------------------------------------------------

      ServiceName:
        !Sub "${ProjectName}-${Environment}-Service"

      # ------------------------------------------------------
      # ECS CLUSTER
      # ------------------------------------------------------

      Cluster:
        !Ref ECSCluster

      # ------------------------------------------------------
      # LAUNCH TYPE
      # ------------------------------------------------------

      LaunchType: FARGATE

      # ------------------------------------------------------
      # DESIRED COUNT
      # ------------------------------------------------------
      #
      # One task keeps this lab cost-conscious.
      #
      # IMPORTANT:
      #
      # One task does NOT provide actual task redundancy
      # across both Availability Zones.
      #
      DesiredCount: 1

      # ------------------------------------------------------
      # TASK DEFINITION
      # ------------------------------------------------------

      TaskDefinition:
        !Ref TaskDefinition

      # ======================================================
      # DEPLOYMENT CONFIGURATION
      # ======================================================
      #
      # Enables ECS deployment circuit breaker and automatic
      # rollback.
      #
      DeploymentConfiguration:

        DeploymentCircuitBreaker:

          Enable: true

          Rollback: true

        # ----------------------------------------------------
        # MAXIMUM PERCENT
        # ----------------------------------------------------
        #
        # DesiredCount = 1
        #
        # MaximumPercent = 200
        #
        # ECS can temporarily run up to 2 tasks during a
        # rolling deployment when capacity permits.
        #
        MaximumPercent: 200

        # ----------------------------------------------------
        # MINIMUM HEALTHY PERCENT
        # ----------------------------------------------------
        #
        # DesiredCount = 1
        #
        # MinimumHealthyPercent = 50
        #
        # ECS may temporarily operate below one healthy task
        # during deployment according to ECS scheduling rules.
        #
        MinimumHealthyPercent: 50

      # ======================================================
      # NETWORK CONFIGURATION
      # ======================================================

      NetworkConfiguration:

        AwsvpcConfiguration:

          # --------------------------------------------------
          # PUBLIC IP
          # --------------------------------------------------
          #
          # DISABLED.
          #
          # ECS tasks remain private.
          #
          AssignPublicIp: DISABLED

          # --------------------------------------------------
          # PRIVATE SUBNETS
          # --------------------------------------------------

          Subnets:

            - !Ref PrivateSubnet1Id
            - !Ref PrivateSubnet2Id

          # --------------------------------------------------
          # ECS SECURITY GROUP
          # --------------------------------------------------

          SecurityGroups:

            - !Ref ECSSecurityGroup

      # ======================================================
      # ALB INTEGRATION
      # ======================================================
      #
      # Connects the ECS service to the ALB target group.
      #
      LoadBalancers:

        - ContainerName: application

          ContainerPort: 80

          TargetGroupArn:
            !Ref ECSTargetGroup

      # ------------------------------------------------------
      # SERVICE TAGS
      # ------------------------------------------------------

      Tags:

        - Key: Name
          Value:
            !Sub "${ProjectName}-${Environment}-ECSService"

        - Key: Project
          Value:
            !Ref ProjectName

        - Key: Environment
          Value:
            !Ref Environment

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ==========================================================
  # ECS CLUSTER NAME
  # ==========================================================

  ECSClusterName:

    Description: >
      ECS cluster name.

    Value:
      !Ref ECSCluster

  # ==========================================================
  # ECS SERVICE NAME
  # ==========================================================

  ECSServiceName:

    Description: >
      ECS service name.

    Value:
      !GetAtt ECSService.Name

  # ==========================================================
  # TASK DEFINITION ARN
  # ==========================================================

  TaskDefinitionArn:

    Description: >
      ECS task definition ARN.

    Value:
      !Ref TaskDefinition

  # ==========================================================
  # ECS SECURITY GROUP ID
  # ==========================================================

  ECSSecurityGroupId:

    Description: >
      Security group attached to ECS Fargate tasks.

    Value:
      !Ref ECSSecurityGroup

  # ==========================================================
  # ALB SECURITY GROUP ID
  # ==========================================================

  ALBSecurityGroupId:

    Description: >
      Security group attached to the Application Load Balancer.

    Value:
      !Ref ALBSecurityGroup

  # ==========================================================
  # APPLICATION LOAD BALANCER ARN
  # ==========================================================

  ALBArn:

    Description: >
      Application Load Balancer ARN.

    Value:
      !Ref ApplicationLoadBalancer

  # ==========================================================
  # APPLICATION LOAD BALANCER DNS NAME
  # ==========================================================

  ALBDnsName:

    Description: >
      DNS name of the internet-facing Application Load Balancer.

    Value:
      !GetAtt ApplicationLoadBalancer.DNSName

  # ==========================================================
  # TARGET GROUP ARN
  # ==========================================================

  TargetGroupArn:

    Description: >
      ECS target group ARN.

    Value:
      !Ref ECSTargetGroup

  # ==========================================================
  # TARGET GROUP FULL NAME
  # ==========================================================

  TargetGroupFullName:

    Description: >
      Full name of the ECS target group.

    Value:
      !GetAtt ECSTargetGroup.TargetGroupFullName

  # ==========================================================
  # ALB LISTENER ARN
  # ==========================================================

  ALBListenerArn:

    Description: >
      Application Load Balancer HTTP listener ARN.

    Value:
      !Ref ALBListener

  # ==========================================================
  # CLOUDWATCH LOG GROUP
  # ==========================================================

  LogGroupName:

    Description: >
      ECS CloudWatch log group.

    Value:
      !Ref LogGroup

  # ==========================================================
  # ECS TASK EXECUTION ROLE ARN
  # ==========================================================

  ECSTaskExecutionRoleArn:

    Description: >
      ECS task execution IAM role ARN.

    Value:
      !GetAtt ECSTaskExecutionRole.Arn

  # ==========================================================
  # DEPLOYED ECR IMAGE URI
  # ==========================================================
  #
  # This outputs the exact image URI deployed by ECS.
  #
  # Example:
  #
  #   repository:abcdef1234567890
  #
  # ==========================================================

  EcrImageUri:

    Description: >
      Complete immutable ECR image URI deployed to ECS.

    Value:
      !Ref EcrImageUri

  # ==========================================================
  # APPLICATION URL
  # ==========================================================
  #
  # HTTP is intentionally used for this learning lab.
  #
  # ==========================================================

  ApplicationURL:

    Description: >
      HTTP URL for accessing the application through the
      Application Load Balancer.

    Value:
      !Sub "http://${ApplicationLoadBalancer.DNSName}"

