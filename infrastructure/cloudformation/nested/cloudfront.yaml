# ============================================================
# AWS HYBRID IaC LAB
# CLOUDFRONT CDN LAYER
# ============================================================
#
# File:
#
# infrastructure/cloudformation/nested/cloudfront.yaml
#
# Purpose:
#
# Creates the CloudFront CDN layer for the application.
#
# CloudFront securely accesses the private S3 application
# bucket using Origin Access Control (OAC).
#
#
# Architecture:
#
# Internet
# |
# | HTTPS
# v
# +----------------------+
# |      CloudFront      |
# |         CDN          |
# +----------------------+
# |
# | Origin Access Control
# | AWS Signature Version 4
# v
# +----------------------+
# |      Private S3      |
# | Application Bucket   |
# +----------------------+
#
#
# Security model:
#
# Internet
# |
# v
# CloudFront
# |
# | SigV4 signed request
# v
# Private S3 bucket
#
#
# The S3 bucket is NOT publicly readable.
#
# CloudFront is the public application endpoint.
#
#
# ============================================================
# RESOURCES CREATED
# ============================================================
#
# 1. CloudFront Origin Access Control
# 2. CloudFront Distribution
# 3. S3 Bucket Policy
#
#
# ============================================================
# HYBRID IaC OWNERSHIP
# ============================================================
#
# Terraform:
#
# - Uploads the CloudFormation templates to S3.
# - Creates/manages the root CloudFormation stack.
#
#
# CloudFormation:
#
# - Creates/manages the CloudFront distribution.
# - Creates/manages the CloudFront OAC.
# - Creates/manages the S3 bucket policy required by
# CloudFront.
#
#
# ============================================================
# SECURITY DESIGN
# ============================================================
#
# This template uses:
#
# Origin Access Control (OAC)
#
# instead of the legacy:
#
# Origin Access Identity (OAI)
#
#
# OAC signs requests to the S3 origin using:
#
# AWS Signature Version 4
#
#
# The S3 bucket policy allows:
#
# cloudfront.amazonaws.com
#
# to read objects only when the request originates from the
# CloudFront distribution created by this stack.
#
#
# ============================================================
# S3 ORIGIN DESIGN
# ============================================================
#
# The CloudFront origin uses the S3 REST endpoint:
#
# bucket-name.s3.REGION.amazonaws.com
#
#
# It does NOT use the S3 static website endpoint:
#
# bucket-name.s3-website-REGION.amazonaws.com
#
#
# This is intentional because OAC is being used with a private
# S3 origin.
#
#
# ============================================================

AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudFront CDN layer for the AWS Hybrid IaC Lab.
  Creates a CloudFront distribution with Origin Access Control
  for secure access to a private S3 application bucket.

# ============================================================
# PARAMETERS
# ============================================================

Parameters:

  # ----------------------------------------------------------
  # Project Name
  # ----------------------------------------------------------
  #
  # Example:
  #
  # hybridiaclab
  #
  # This value is supplied by the parent CloudFormation stack.
  #
  # ----------------------------------------------------------

  ProjectName:
    Type: String
    Description: >
      Project name used for CloudFront resource naming
      and resource identification.

  # ----------------------------------------------------------
  # Environment
  # ----------------------------------------------------------
  #
  # Example:
  #
  # dev
  #
  # ----------------------------------------------------------

  Environment:
    Type: String
    Description: >
      Deployment environment such as dev, test, staging,
      or prod.

  # ----------------------------------------------------------
  # Existing S3 Application Bucket
  # ----------------------------------------------------------
  #
  # The S3 bucket is created by the S3 nested stack.
  #
  # This CloudFront stack consumes that bucket as its
  # private S3 origin.
  #
  # ----------------------------------------------------------

  ApplicationBucketName:
    Type: String
    Description: >
      Name of the existing private S3 application bucket.

# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # 1. CLOUDFRONT ORIGIN ACCESS CONTROL
  # ==========================================================
  #
  # OAC provides authenticated access from CloudFront to the
  # private S3 bucket.
  #
  # Requests are signed using AWS Signature Version 4.
  #
  # The naming pattern intentionally follows the previously
  # working Charlie Cafe CloudFront implementation:
  #
  # ProjectName-Region-OAC
  #
  # Example:
  #
  # hybridiaclab-us-east-1-OAC
  #
  # ==========================================================

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:

        # ----------------------------------------------------
        # OAC NAME
        # ----------------------------------------------------
        #
        # Region is included to provide deterministic naming
        # across AWS regions.
        #
        # ----------------------------------------------------

        Name:
          !Sub "${ProjectName}-${AWS::Region}-OAC"


        # ----------------------------------------------------
        # OAC DESCRIPTION
        # ----------------------------------------------------

        Description:
          !Sub >
            CloudFront Origin Access Control for
            ${ProjectName}-${Environment}
            private S3 application bucket.


        # ----------------------------------------------------
        # ORIGIN TYPE
        # ----------------------------------------------------
        #
        # The origin is Amazon S3.
        #
        # ----------------------------------------------------

        OriginAccessControlOriginType: s3


        # ----------------------------------------------------
        # SIGNING BEHAVIOR
        # ----------------------------------------------------
        #
        # always:
        #
        # CloudFront signs every request sent to the S3
        # origin.
        #
        # ----------------------------------------------------

        SigningBehavior: always


        # ----------------------------------------------------
        # SIGNING PROTOCOL
        # ----------------------------------------------------
        #
        # AWS Signature Version 4.
        #
        # ----------------------------------------------------

        SigningProtocol: sigv4

  # ==========================================================
  # 2. CLOUDFRONT DISTRIBUTION
  # ==========================================================
  #
  # Creates the public CDN endpoint.
  #
  # The distribution uses the private S3 bucket as its origin.
  #
  # ==========================================================

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:

        # ----------------------------------------------------
        # ENABLE DISTRIBUTION
        # ----------------------------------------------------

        Enabled: true


        # ----------------------------------------------------
        # DISTRIBUTION COMMENT
        # ----------------------------------------------------

        Comment:
          !Sub >
            CloudFront distribution for
            ${ProjectName}-${Environment}
            private S3 application.


        # ----------------------------------------------------
        # DEFAULT ROOT OBJECT
        # ----------------------------------------------------
        #
        # A request for:
        #
        #   /
        #
        # is resolved to:
        #
        #   /index.html
        #
        # ----------------------------------------------------

        DefaultRootObject: index.html


        # ----------------------------------------------------
        # HTTP VERSION
        # ----------------------------------------------------
        #
        # Supports HTTP/2 and HTTP/3 for viewers.
        #
        # ----------------------------------------------------

        HttpVersion: http2and3


        # ----------------------------------------------------
        # IPv6
        # ----------------------------------------------------
        #
        # Enables IPv6 access to the CloudFront distribution.
        #
        # ----------------------------------------------------

        IPV6Enabled: true


        # ====================================================
        # CLOUDFRONT ORIGIN
        # ====================================================

        Origins:

          - Id: S3WebsiteOrigin

            # ------------------------------------------------
            # S3 REGIONAL DOMAIN
            # ------------------------------------------------
            #
            # Uses the S3 REST endpoint.
            #
            # Example:
            #
            #   bucket-name.s3.us-east-1.amazonaws.com
            #
            # This is NOT the S3 static website endpoint.
            #
            # ------------------------------------------------

            DomainName:
              !Sub "${ApplicationBucketName}.s3.${AWS::Region}.amazonaws.com"


            # ------------------------------------------------
            # S3 ORIGIN CONFIGURATION
            # ------------------------------------------------
            #
            # OAC is used instead of the legacy OAI.
            #
            # S3OriginConfig is intentionally present with an
            # empty object for an S3 REST origin.
            #
            # ------------------------------------------------

            S3OriginConfig: {}


            # ------------------------------------------------
            # ORIGIN ACCESS CONTROL
            # ------------------------------------------------
            #
            # Attach the OAC created above to this origin.
            #
            # ------------------------------------------------

            OriginAccessControlId:
              !Ref CloudFrontOAC


        # ====================================================
        # DEFAULT CACHE BEHAVIOR
        # ====================================================

        DefaultCacheBehavior:

          # --------------------------------------------------
          # TARGET ORIGIN
          # --------------------------------------------------

          TargetOriginId: S3WebsiteOrigin


          # --------------------------------------------------
          # VIEWER PROTOCOL POLICY
          # --------------------------------------------------
          #
          # HTTP requests are redirected to HTTPS.
          #
          # --------------------------------------------------

          ViewerProtocolPolicy: redirect-to-https


          # --------------------------------------------------
          # ALLOWED METHODS
          # --------------------------------------------------
          #
          # GET and HEAD are required for normal static
          # website delivery.
          #
          # OPTIONS is included for browser/CORS compatibility.
          #
          # --------------------------------------------------

          AllowedMethods:

            - GET
            - HEAD
            - OPTIONS


          # --------------------------------------------------
          # CACHED METHODS
          # --------------------------------------------------
          #
          # Only GET and HEAD responses are cached.
          #
          # OPTIONS is intentionally not cached.
          #
          # --------------------------------------------------

          CachedMethods:

            - GET
            - HEAD


          # --------------------------------------------------
          # COMPRESSION
          # --------------------------------------------------
          #
          # Allows CloudFront to compress supported responses.
          #
          # --------------------------------------------------

          Compress: true


          # --------------------------------------------------
          # FORWARDED VALUES
          # --------------------------------------------------
          #
          # This lab uses a simple static S3 application.
          #
          # Query strings are not forwarded.
          #
          # Cookies are not forwarded.
          #
          # --------------------------------------------------

          ForwardedValues:

            QueryString: false

            Cookies:

              Forward: none


        # ====================================================
        # PRICE CLASS
        # ====================================================
        #
        # Cost-conscious configuration for the learning lab.
        #
        # ====================================================

        PriceClass: PriceClass_100


        # ====================================================
        # GEO RESTRICTION
        # ====================================================
        #
        # No geographic restriction.
        #
        # ====================================================

        Restrictions:

          GeoRestriction:

            RestrictionType: none


        # ====================================================
        # VIEWER CERTIFICATE
        # ====================================================
        #
        # Uses the default CloudFront certificate.
        #
        # HTTPS is therefore available through:
        #
        #   https://<distribution>.cloudfront.net
        #
        # A custom domain can be added later using ACM and
        # Route 53.
        #
        # ====================================================

        ViewerCertificate:

          CloudFrontDefaultCertificate: true

  # ==========================================================
  # 3. S3 BUCKET POLICY
  # ==========================================================
  #
  # Allows the CloudFront service principal to read objects
  # from the application bucket.
  #
  # Access is restricted to the specific CloudFront
  # distribution created by this stack.
  #
  # ==========================================================

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:

      # ------------------------------------------------------
      # TARGET APPLICATION BUCKET
      # ------------------------------------------------------

      Bucket:
        !Ref ApplicationBucketName


      # ------------------------------------------------------
      # POLICY DOCUMENT
      # ------------------------------------------------------

      PolicyDocument:

        Version: "2012-10-17"

        Statement:

          # ==================================================
          # ALLOW CLOUDFRONT READ ACCESS
          # ==================================================
          #
          # CloudFront receives read-only object access.
          #
          # ==================================================

          - Sid: AllowCloudFrontServicePrincipalReadOnly

            Effect: Allow


            # ------------------------------------------------
            # CLOUDFRONT SERVICE PRINCIPAL
            # ------------------------------------------------

            Principal:

              Service:
                cloudfront.amazonaws.com


            # ------------------------------------------------
            # S3 OBJECT READ PERMISSION
            # ------------------------------------------------

            Action:

              - s3:GetObject


            # ------------------------------------------------
            # OBJECT RESOURCE
            # ------------------------------------------------
            #
            # /* represents every object inside the bucket.
            #
            # ------------------------------------------------

            Resource:
              !Sub "arn:${AWS::Partition}:s3:::${ApplicationBucketName}/*"


            # ------------------------------------------------
            # RESTRICT ACCESS TO THIS DISTRIBUTION
            # ------------------------------------------------
            #
            # The SourceArn condition prevents another
            # CloudFront distribution from using this bucket
            # policy.
            #
            # ------------------------------------------------

            Condition:

              StringEquals:

                AWS:SourceArn:
                  !Sub >
                    arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  # ==========================================================
  # CLOUDFRONT DISTRIBUTION ID
  # ==========================================================

  CloudFrontDistributionId:
    Description: >
      ID of the CloudFront distribution.
    Value:
      !Ref CloudFrontDistribution

  # ==========================================================
  # CLOUDFRONT DOMAIN NAME
  # ==========================================================

  CloudFrontDomainName:
    Description: >
      Domain name assigned to the CloudFront distribution.
    Value:
      !GetAtt CloudFrontDistribution.DomainName

  # ==========================================================
  # CLOUDFRONT HTTPS URL
  # ==========================================================

  CloudFrontWebsiteURL:
    Description: >
      HTTPS URL for the CloudFront distribution.
    Value:
      !Sub "https://${CloudFrontDistribution.DomainName}/"

  # ==========================================================
  # APPLICATION BUCKET NAME
  # ==========================================================

  ApplicationBucketName:
    Description: >
      Existing S3 application bucket used as the CloudFront
      origin.
    Value:
      !Ref ApplicationBucketName

  # ==========================================================
  # ORIGIN ACCESS CONTROL ID
  # ==========================================================

  OriginAccessControlId:
    Description: >
      ID of the CloudFront Origin Access Control used by the
      S3 origin.
    Value:
      !Ref CloudFrontOAC