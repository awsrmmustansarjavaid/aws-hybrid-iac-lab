# ==========================================================
# HYBRID TERRAFORM + CLOUDFORMATION AWS DEVOPS LAB
# COMPLETE INFRASTRUCTURE DELETION WORKFLOW
# ==========================================================
#
# File:
#   .github/workflows/delete.yml
#
# Purpose:
#
#   Safely and completely destroy the AWS infrastructure
#   created by this Hybrid Terraform + CloudFormation lab.
#
# ==========================================================
# ARCHITECTURE / OWNERSHIP MODEL
# ==========================================================
#
# GitHub Actions
#       |
#       v
# GitHub OIDC
#       |
#       v
# AWS IAM Role
#       |
#       v
# Terraform
#       |
#       v
# Terraform-managed Main CloudFormation Stack
#       |
#       +--> EKS Cluster
#       |       |
#       |       +--> Kubernetes application resources
#       |
#       +--> Other MainStack resources
#
# Terraform manages the Main CloudFormation stack.
#
# CloudFormation manages the resources declared in
# MainStack.
#
# ----------------------------------------------------------
# ECS OWNERSHIP
# ----------------------------------------------------------
#
# ECS is deployed as a separate CloudFormation stack by
# docker.yml.
#
# Therefore Terraform destroy does NOT automatically remove
# the ECS stack.
#
# delete.yml explicitly deletes the ECS stack before
# Terraform destroys MainStack.
#
# ECS stack:
#
#   +--> ECS Cluster
#   +--> ECS Service
#   +--> ECS Tasks
#   +--> Application Load Balancer
#   +--> Target Group
#   +--> ECS Security Groups
#   +--> ECS Task Execution Role
#
# ----------------------------------------------------------
# KUBERNETES OWNERSHIP
# ----------------------------------------------------------
#
# Kubernetes manages namespace-scoped application resources
# inside the EKS cluster.
#
# Kubernetes application resources are cleaned up BEFORE
# MainStack / EKS deletion.
#
# This gives Kubernetes controllers an opportunity to remove
# AWS resources created by Kubernetes Services, such as
# load balancers.
#
# ==========================================================
# DELETION ORDER
# ==========================================================
#
# 1.  Checkout repository
# 2.  Require manual DESTROY confirmation
# 3.  Validate workflow configuration and required tools
# 4.  Validate GitHub OIDC configuration
# 5.  Authenticate to AWS using GitHub OIDC
# 6.  Verify AWS account and IAM role
# 7.  Install the required Terraform version
# 8.  Initialize Terraform and connect to the remote backend
# 9.  Display current Terraform state
# 10. Check whether the Terraform-managed MainStack exists
# 11. Detect the EKS Kubernetes version
# 12. Install the kubectl version compatible with EKS
# 13. Clean Kubernetes application resources
# 14. Wait 30 seconds for Kubernetes-managed AWS resource cleanup
# 15. Delete the independent ECS CloudFormation stack
# 16. Delete ECR images before deleting the ECR repository
# 17. Verify ECR images have been removed
# 18. Destroy Terraform-managed infrastructure
# 19. Verify Terraform state after destruction
# 20. Verify MainStack deletion
# 21. Verify independent ECS stack deletion
# 22. Verify ECR repository deletion
# 23. Verify EKS cluster deletion
# 24. Optionally delete the Terraform backend S3 bucket
# 25. Perform final infrastructure verification
#
# ==========================================================

# ==========================================================
# IMPORTANT SAFETY RULE
# ==========================================================
#
# This workflow DESTROYS AWS infrastructure.
#
# It MUST NOT run automatically on:
#
#   push
#   pull_request
#
# It is intentionally restricted to:
#
#   workflow_dispatch
#
# The workflow also requires the user to type:
#
#   DESTROY
#
# into the manual workflow input.
#
# ==========================================================
# TERRAFORM BACKEND SAFETY
# ==========================================================
#
# Terraform requires its S3 backend during:
#
#   terraform init
#   terraform destroy
#
# Therefore the Terraform state bucket MUST remain available
# until Terraform destruction has completed.
#
# The backend bucket is deleted only when:
#
#   delete_terraform_backend = true
#
# and only after terraform destroy has completed.
#
# ==========================================================

name: Delete Infrastructure

# ==========================================================
# MANUAL TRIGGER ONLY
# ==========================================================

on:
  workflow_dispatch:
    inputs:

      # ------------------------------------------------------
      # Mandatory destructive-action confirmation.
      # ------------------------------------------------------
      confirm_destroy:
        description: "Type DESTROY to confirm complete infrastructure deletion."
        required: true
        type: string

      # ------------------------------------------------------
      # Optional Terraform backend deletion.
      #
      # false:
      #   Keep the Terraform state bucket.
      #
      # true:
      #   Delete the Terraform state bucket after all
      #   infrastructure has been destroyed.
      # ------------------------------------------------------
      delete_terraform_backend:
        description: "Delete the Terraform S3 state bucket after Terraform destroy."
        required: true
        default: false
        type: boolean

# ==========================================================
# GLOBAL ENVIRONMENT
# ==========================================================

env:

  # --------------------------------------------------------
  # AWS
  # --------------------------------------------------------

  AWS_REGION: "us-east-1"

  AWS_EXPECTED_ROLE_NAME: "aws-hybrid-iac-lab-GitHubActions"

  AWS_ROLE_SESSION_NAME: "GitHubActions-Delete"

  AWS_OIDC_AUDIENCE: "sts.amazonaws.com"

  # --------------------------------------------------------
  # PROJECT
  # --------------------------------------------------------

  PROJECT_NAME: "hybridiaclab"

  ENVIRONMENT: "dev"

  # --------------------------------------------------------
  # MAIN CLOUDFORMATION STACK
  #
  # Terraform manages this stack.
  # --------------------------------------------------------

  MAIN_STACK_NAME: "hybridiaclab-dev-MainStack"

  # --------------------------------------------------------
  # ECS CLOUDFORMATION STACK
  #
  # ECS is independently deployed by docker.yml.
  # --------------------------------------------------------

  ECS_STACK_NAME: "hybridiaclab-dev-ECSStack"

  # --------------------------------------------------------
  # EKS
  #
  # EKS is contained inside MainStack.
  #
  # delete.yml cleans Kubernetes resources first, but
  # CloudFormation/Terraform remains responsible for deleting
  # the actual EKS cluster.
  # --------------------------------------------------------

  EKS_CLUSTER_NAME: "hybridiaclab-dev-EKS"

  EKS_NODE_GROUP_NAME: "hybridiaclab-dev-NodeGroup"

  # --------------------------------------------------------
  # KUBERNETES
  # --------------------------------------------------------

  K8S_NAMESPACE: "hybridiaclab"

  # --------------------------------------------------------
  # ECR
  # --------------------------------------------------------

  ECR_REPOSITORY_NAME: "hybridiaclab-dev-app"

  # --------------------------------------------------------
  # TERRAFORM
  # --------------------------------------------------------

  TF_WORKING_DIRECTORY: "infrastructure/terraform"

  # Terraform version used by this workflow.
  #
  # Pinning the version keeps the deletion workflow
  # reproducible.
  #
  TF_VERSION: "1.15.7"

  # --------------------------------------------------------
  # TERRAFORM S3 BACKEND
  # --------------------------------------------------------

  TF_STATE_BUCKET: "aws-hybrid-iac-lab-terraform-state-537236558357"

  TF_STATE_REGION: "us-east-1"

  TF_STATE_KEY: "aws-hybrid-iac-lab/terraform.tfstate"

# ==========================================================
# CONCURRENCY
# ==========================================================
#
# Infrastructure operations should not run simultaneously.
#
# The same concurrency group should also be used by the
# deployment workflow(s) if you want GitHub Actions to prevent
# deployment and deletion from running at the same time.
#
# cancel-in-progress is false because an infrastructure
# destruction operation must never be silently cancelled.
# ==========================================================

concurrency:
  group: "hybrid-iac-infrastructure-${{ github.repository }}"
  cancel-in-progress: false

# ==========================================================
# GITHUB ACTIONS PERMISSIONS
# ==========================================================
#
# id-token: write
#   Required for GitHub OIDC authentication with AWS.
#
# contents: read
#   Required by actions/checkout.
# ==========================================================

permissions:
  id-token: write
  contents: read

# ==========================================================
# JOB
# ==========================================================

jobs:

  delete:

    name: Destroy AWS Infrastructure

    runs-on: ubuntu-latest

    # ======================================================
    # JOB ENVIRONMENT
    # ======================================================

    env:

      # Repository variables.
      #
      # Configure these in:
      #
      # GitHub Repository
      #   -> Settings
      #   -> Secrets and variables
      #   -> Actions
      #   -> Variables
      #
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}

      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    # ======================================================
    # STEPS
    # ======================================================

    steps:

      # ====================================================
      # 1. CHECKOUT REPOSITORY
      # ====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ====================================================
      # 2. VALIDATE DESTRUCTION CONFIRMATION
      # ====================================================

      - name: Validate Destruction Confirmation
        shell: bash
        env:
          CONFIRM_DESTROY: ${{ inputs.confirm_destroy }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VALIDATING DESTRUCTION CONFIRMATION"
          echo "================================================"

          if [ "$CONFIRM_DESTROY" != "DESTROY" ]; then
            echo ""
            echo "ERROR: Destruction confirmation failed."
            echo ""
            echo "You must enter exactly:"
            echo ""
            echo "DESTROY"
            echo ""
            exit 1
          fi

          echo ""
          echo "Destruction confirmation accepted."
          echo "================================================"

      # ====================================================
      # 3. VALIDATE DEPLOYMENT CONFIGURATION
      # ====================================================

      - name: Validate Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VALIDATING DELETE WORKFLOW CONFIGURATION"
          echo "================================================"

          # ------------------------------------------------
          # Validate AWS account ID.
          # ------------------------------------------------

          if [ -z "${AWS_ACCOUNT_ID:-}" ]; then
            echo "ERROR: AWS_ACCOUNT_ID is empty."
            echo "Configure GitHub Repository Variable: AWS_ACCOUNT_ID"
            exit 1
          fi

          if ! [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "ERROR: AWS_ACCOUNT_ID must contain exactly 12 digits."
            exit 1
          fi

          # ------------------------------------------------
          # Validate AWS role ARN.
          # ------------------------------------------------

          if [ -z "${AWS_ROLE_ARN:-}" ]; then
            echo "ERROR: AWS_ROLE_ARN is empty."
            echo "Configure GitHub Repository Variable: AWS_ROLE_ARN"
            exit 1
          fi

          EXPECTED_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${AWS_EXPECTED_ROLE_NAME}"

          if [ "$AWS_ROLE_ARN" != "$EXPECTED_ROLE_ARN" ]; then
            echo ""
            echo "ERROR: AWS_ROLE_ARN does not match the expected role."
            echo ""
            echo "Expected:"
            echo "$EXPECTED_ROLE_ARN"
            echo ""
            echo "Received:"
            echo "$AWS_ROLE_ARN"
            exit 1
          fi

          # ------------------------------------------------
          # Validate AWS region.
          # ------------------------------------------------

          if [ -z "$AWS_REGION" ]; then
            echo "ERROR: AWS_REGION is empty."
            exit 1
          fi

          # ------------------------------------------------
          # Validate project configuration.
          # ------------------------------------------------

          if [ -z "$PROJECT_NAME" ]; then
            echo "ERROR: PROJECT_NAME is empty."
            exit 1
          fi

          if [ -z "$ENVIRONMENT" ]; then
            echo "ERROR: ENVIRONMENT is empty."
            exit 1
          fi

          # ------------------------------------------------
          # Validate Terraform directory.
          # ------------------------------------------------

          if [ ! -d "$TF_WORKING_DIRECTORY" ]; then
            echo "ERROR: Terraform directory does not exist:"
            echo "$TF_WORKING_DIRECTORY"
            exit 1
          fi

          # ------------------------------------------------
          # Validate Terraform configuration files.
          # ------------------------------------------------

          if ! find "$TF_WORKING_DIRECTORY" \
            -maxdepth 1 \
            -type f \
            -name "*.tf" \
            | grep -q .; then

            echo "ERROR: No Terraform files were found."
            exit 1
          fi

          # ------------------------------------------------
          # Validate required commands.
          #
          # aws, jq, and curl are required by the validation,
          # authentication, and diagnostic steps.
          # ------------------------------------------------

          for COMMAND in aws jq curl; do
            if ! command -v "$COMMAND" >/dev/null 2>&1; then
              echo "ERROR: Required command not found: $COMMAND"
              exit 1
            fi
          done

          # ------------------------------------------------
          # Ensure long-lived AWS credentials are not being
          # used.
          #
          # This workflow must authenticate through GitHub
          # OIDC.
          # ------------------------------------------------

          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] || \
             [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then

            echo ""
            echo "ERROR: Long-lived AWS credentials detected."
            echo "This workflow must authenticate using GitHub OIDC."
            exit 1
          fi

          # ------------------------------------------------
          # Verify GitHub OIDC runtime variables.
          # ------------------------------------------------

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || \
             [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then

            echo ""
            echo "ERROR: GitHub OIDC runtime variables are unavailable."
            exit 1
          fi

          echo ""
          echo "Configuration validation successful."
          echo ""

          echo "Project:              $PROJECT_NAME"
          echo "Environment:          $ENVIRONMENT"
          echo "AWS Region:           $AWS_REGION"
          echo "AWS Account:          $AWS_ACCOUNT_ID"
          echo "AWS Role:             $AWS_ROLE_ARN"
          echo "Main Stack:           $MAIN_STACK_NAME"
          echo "ECS Stack:            $ECS_STACK_NAME"
          echo "EKS Cluster:          $EKS_CLUSTER_NAME"
          echo "ECR Repository:       $ECR_REPOSITORY_NAME"
          echo "Kubernetes Namespace: $K8S_NAMESPACE"
          echo "Terraform Directory:  $TF_WORKING_DIRECTORY"
          echo "Terraform Version:    $TF_VERSION"
          echo "State Bucket:         $TF_STATE_BUCKET"

          echo "================================================"

      # ====================================================
      # 4. VERIFY GITHUB OIDC CONFIGURATION
      # ====================================================

      - name: Verify GitHub OIDC Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING GITHUB OIDC CONFIGURATION"
          echo "================================================"

          OIDC_TOKEN_RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AWS_OIDC_AUDIENCE}")

          OIDC_TOKEN=$(echo "$OIDC_TOKEN_RESPONSE" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: GitHub OIDC token was not returned."
            exit 1
          fi

          # ------------------------------------------------
          # Decode only the JWT payload.
          #
          # The actual JWT is NEVER printed.
          # ------------------------------------------------

          OIDC_PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f2)

          OIDC_PAYLOAD=$(printf '%s' "$OIDC_PAYLOAD" | tr '_-' '/+')

          case $((${#OIDC_PAYLOAD} % 4)) in
            2)
              OIDC_PAYLOAD="${OIDC_PAYLOAD}=="
              ;;
            3)
              OIDC_PAYLOAD="${OIDC_PAYLOAD}="
              ;;
          esac

          CLAIMS=$(printf '%s' "$OIDC_PAYLOAD" | base64 -d 2>/dev/null || true)

          if [ -z "$CLAIMS" ]; then
            echo "ERROR: Unable to decode GitHub OIDC claims."
            exit 1
          fi

          ISSUER=$(echo "$CLAIMS" | jq -r '.iss // empty')
          AUDIENCE=$(echo "$CLAIMS" | jq -r '.aud // empty')
          SUBJECT=$(echo "$CLAIMS" | jq -r '.sub // empty')
          REPOSITORY=$(echo "$CLAIMS" | jq -r '.repository // empty')

          echo ""
          echo "OIDC Issuer:"
          echo "$ISSUER"

          echo ""
          echo "OIDC Audience:"
          echo "$AUDIENCE"

          echo ""
          echo "OIDC Subject:"
          echo "$SUBJECT"

          echo ""
          echo "OIDC Repository:"
          echo "$REPOSITORY"

          if [ "$ISSUER" != "https://token.actions.githubusercontent.com" ]; then
            echo "ERROR: Unexpected OIDC issuer."
            exit 1
          fi

          if [ "$AUDIENCE" != "$AWS_OIDC_AUDIENCE" ]; then
            echo "ERROR: Unexpected OIDC audience."
            exit 1
          fi

          if [ "$REPOSITORY" != "awsrmmustansarjavaid/aws-hybrid-iac-lab" ]; then
            echo "ERROR: Unexpected GitHub repository."
            exit 1
          fi

          echo ""
          echo "GitHub OIDC validation successful."
          echo "================================================"

      # ====================================================
      # 5. CONFIGURE AWS CREDENTIALS
      # ====================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: ${{ env.AWS_ROLE_SESSION_NAME }}
          audience: ${{ env.AWS_OIDC_AUDIENCE }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      # ====================================================
      # 6. VERIFY AWS IDENTITY
      # ====================================================

      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING AWS IDENTITY"
          echo "================================================"

          IDENTITY=$(aws sts get-caller-identity)

          CALLER_ACCOUNT=$(echo "$IDENTITY" | jq -r '.Account')
          CALLER_ARN=$(echo "$IDENTITY" | jq -r '.Arn')

          echo ""
          echo "AWS Account:"
          echo "$CALLER_ACCOUNT"

          echo ""
          echo "AWS ARN:"
          echo "$CALLER_ARN"

          if [ "$CALLER_ACCOUNT" != "$AWS_ACCOUNT_ID" ]; then
            echo ""
            echo "ERROR: AWS account mismatch."
            echo "Expected: $AWS_ACCOUNT_ID"
            echo "Actual:   $CALLER_ACCOUNT"
            exit 1
          fi

          if [[ "$CALLER_ARN" != *"$AWS_EXPECTED_ROLE_NAME"* ]]; then
            echo ""
            echo "ERROR: Unexpected IAM role."
            exit 1
          fi

          echo ""
          echo "AWS identity verification successful."
          echo "================================================"

      # ====================================================
      # 7. INSTALL TERRAFORM
      # ====================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ====================================================
      # 8. INITIALIZE TERRAFORM
      # ====================================================
      #
      # The Terraform backend must exist at this point.
      #
      # The backend is intentionally preserved until the very
      # end of this workflow.
      # ====================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "INITIALIZING TERRAFORM"
          echo "================================================"

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}"

          echo ""
          echo "Terraform initialization successful."
          echo "================================================"

      # ====================================================
      # 9. SHOW TERRAFORM STATE BEFORE DESTROY
      # ====================================================

      - name: Terraform State List Before Destroy
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "TERRAFORM STATE BEFORE DESTROY"
          echo "================================================"

          if terraform state list > /tmp/terraform-state.txt 2>/tmp/terraform-state-error.txt; then

            if [ -s /tmp/terraform-state.txt ]; then
              echo ""
              cat /tmp/terraform-state.txt
            else
              echo ""
              echo "Terraform state contains no managed resources."
            fi

          else

            echo ""
            echo "WARNING: Unable to read Terraform state."
            cat /tmp/terraform-state-error.txt || true

          fi

          echo "================================================"

      # ====================================================
      # 10. CHECK MAIN CLOUDFORMATION STACK
      # ====================================================

      - name: Check Main CloudFormation Stack
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "CHECKING MAIN CLOUDFORMATION STACK"
          echo "================================================"

          if aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            >/tmp/main-stack.json 2>/tmp/main-stack-error.txt; then

            aws cloudformation describe-stacks \
              --stack-name "$MAIN_STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].{StackName:StackName,Status:StackStatus}' \
              --output table

          else

            echo ""
            echo "Main CloudFormation stack could not be described."
            echo "It may not currently exist."

          fi

          echo "================================================"

      # ====================================================
      # 11. DETERMINE EKS KUBERNETES VERSION
      # ====================================================
      #
      # The EKS API server version is discovered dynamically.
      #
      # This prevents the workflow from depending on a fixed
      # kubectl version that may become incompatible later.
      # ====================================================

      - name: Determine EKS Kubernetes Version
        id: eks-version
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "DETERMINING EKS KUBERNETES VERSION"
          echo "================================================"

          if ! aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo ""
            echo "EKS cluster does not exist."
            echo "Kubernetes cleanup will be skipped."

            echo "version=" >> "$GITHUB_OUTPUT"

            echo "================================================"
            exit 0
          fi

          EKS_VERSION=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.version' \
            --output text)

          if [ -z "$EKS_VERSION" ] || [ "$EKS_VERSION" = "None" ]; then
            echo ""
            echo "ERROR: Unable to determine EKS Kubernetes version."
            exit 1
          fi

          echo ""
          echo "EKS Cluster:"
          echo "$EKS_CLUSTER_NAME"

          echo ""
          echo "EKS Kubernetes Version:"
          echo "$EKS_VERSION"

          echo "version=$EKS_VERSION" >> "$GITHUB_OUTPUT"

          echo ""
          echo "EKS Kubernetes version detected successfully."
          echo "================================================"

      # ====================================================
      # 12. INSTALL KUBECTL
      # ====================================================
      #
      # Install the kubectl version matching the EKS
      # Kubernetes API server version.
      # ====================================================

      - name: Install kubectl
        if: steps.eks-version.outputs.version != ''
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ steps.eks-version.outputs.version }}

      # ====================================================
      # 13. CLEAN KUBERNETES APPLICATION RESOURCES
      # ====================================================
      #
      # Namespace-scoped Kubernetes application resources are
      # cleaned before the EKS cluster deletion is attempted.
      #
      # The cleanup targets resources inside:
      #
      #   $K8S_NAMESPACE
      #
      # Cluster-scoped Kubernetes resources are not explicitly
      # removed by this step.
      #
      # If the Kubernetes API is unavailable, cleanup is skipped
      # and the workflow continues with infrastructure deletion.
      # ====================================================

      - name: Cleanup Kubernetes Resources
        if: steps.eks-version.outputs.version != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "CLEANING KUBERNETES RESOURCES"
          echo "================================================"

          EKS_STATUS=$(aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            --query 'cluster.status' \
            --output text)

          echo ""
          echo "EKS Cluster:"
          echo "$EKS_CLUSTER_NAME"

          echo ""
          echo "EKS Status:"
          echo "$EKS_STATUS"

          if [ "$EKS_STATUS" != "ACTIVE" ]; then
            echo ""
            echo "EKS cluster is not ACTIVE."
            echo "Kubernetes API cleanup will be skipped."
            exit 0
          fi

          # ------------------------------------------------
          # Configure kubeconfig.
          # ------------------------------------------------

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          # ------------------------------------------------
          # Verify Kubernetes connectivity.
          # ------------------------------------------------

          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo ""
            echo "WARNING: Kubernetes API is unavailable."
            echo "Skipping Kubernetes application cleanup."
            exit 0
          fi

          # ------------------------------------------------
          # Check namespace.
          # ------------------------------------------------

          if ! kubectl get namespace "$K8S_NAMESPACE" \
            >/dev/null 2>&1; then

            echo ""
            echo "Kubernetes namespace does not exist."
            echo "Skipping namespace cleanup."
            exit 0
          fi

          # ------------------------------------------------
          # Display current resources.
          # ------------------------------------------------

          echo ""
          echo "Resources currently in namespace:"
          kubectl get all \
            -n "$K8S_NAMESPACE" \
            -o wide \
            || true

          # ------------------------------------------------
          # Delete Services first.
          #
          # This gives LoadBalancer resources a chance to
          # trigger AWS load balancer deletion.
          # ------------------------------------------------

          echo ""
          echo "Deleting Kubernetes Services..."

          kubectl delete service \
            --all \
            -n "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            --wait=true \
            || true

          # ------------------------------------------------
          # Delete Ingress resources.
          #
          # Ingress resources may also create AWS load
          # balancers depending on the installed controller.
          # ------------------------------------------------

          echo ""
          echo "Deleting Kubernetes Ingress resources..."

          kubectl delete ingress \
            --all \
            -n "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            --wait=true \
            || true

          # ------------------------------------------------
          # Delete Deployments.
          # ------------------------------------------------

          echo ""
          echo "Deleting Kubernetes Deployments..."

          kubectl delete deployment \
            --all \
            -n "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            --wait=true \
            || true

          # ------------------------------------------------
          # Delete StatefulSets.
          # ------------------------------------------------

          echo ""
          echo "Deleting Kubernetes StatefulSets..."

          kubectl delete statefulset \
            --all \
            -n "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            --wait=true \
            || true

          # ------------------------------------------------
          # Delete DaemonSets.
          # ------------------------------------------------

          echo ""
          echo "Deleting Kubernetes DaemonSets..."

          kubectl delete daemonset \
            --all \
            -n "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            --wait=true \
            || true

          # ------------------------------------------------
          # Delete ConfigMaps.
          # ------------------------------------------------

          echo ""
          echo "Deleting Kubernetes ConfigMaps..."

          kubectl delete configmap \
            --all \
            -n "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            || true

          # ------------------------------------------------
          # Delete Secrets.
          # ------------------------------------------------

          echo ""
          echo "Deleting Kubernetes Secrets..."

          kubectl delete secret \
            --all \
            -n "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            || true

          # ------------------------------------------------
          # Delete PVCs.
          # ------------------------------------------------

          echo ""
          echo "Deleting Kubernetes PersistentVolumeClaims..."

          kubectl delete pvc \
            --all \
            -n "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            --wait=true \
            || true

          # ------------------------------------------------
          # Delete ServiceAccounts.
          # ------------------------------------------------

          echo ""
          echo "Deleting Kubernetes ServiceAccounts..."

          kubectl delete serviceaccount \
            --all \
            -n "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            || true

          # ------------------------------------------------
          # Delete remaining standard resources.
          # ------------------------------------------------

          echo ""
          echo "Deleting remaining standard Kubernetes resources..."

          kubectl delete all \
            --all \
            -n "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            --wait=true \
            || true

          # ------------------------------------------------
          # Delete namespace last.
          # ------------------------------------------------

          echo ""
          echo "Deleting Kubernetes namespace..."

          kubectl delete namespace \
            "$K8S_NAMESPACE" \
            --ignore-not-found=true \
            --wait=true \
            || true

          echo ""
          echo "Kubernetes cleanup completed."
          echo "================================================"

      # ====================================================
      # 14. WAIT FOR KUBERNETES AWS RESOURCE CLEANUP
      # ====================================================
      #
      # Kubernetes controllers may need additional time to process
      # deletion of AWS resources associated with Kubernetes objects.
      #
      # The workflow waits 30 seconds after Kubernetes cleanup before
      # continuing with AWS infrastructure deletion.
      #
      # This is a fixed delay only; the workflow does not query AWS
      # to independently confirm that controller-managed resources
      # have been fully removed.
      # ====================================================

      - name: Wait For Kubernetes AWS Resource Cleanup
        if: steps.eks-version.outputs.version != ''
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "WAITING FOR KUBERNETES AWS RESOURCE CLEANUP"
          echo "================================================"

          echo ""
          echo "Waiting 30 seconds for Kubernetes controllers..."
          sleep 30

          echo ""
          echo "Kubernetes controller cleanup wait completed."
          echo "================================================"

      # ====================================================
      # 15. DELETE ECS CLOUDFORMATION STACK
      # ====================================================
      #
      # ECS is independently deployed and therefore is not
      # destroyed by Terraform's MainStack destruction.
      #
      # Delete the ECS stack before destroying MainStack.
      # ====================================================

      - name: Delete ECS CloudFormation Stack
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "DELETING ECS CLOUDFORMATION STACK"
          echo "================================================"

          if ! aws cloudformation describe-stacks \
            --stack-name "$ECS_STACK_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo ""
            echo "ECS CloudFormation stack does not exist."
            exit 0
          fi

          ECS_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$ECS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          echo ""
          echo "ECS Stack:"
          echo "$ECS_STACK_NAME"

          echo ""
          echo "Current Status:"
          echo "$ECS_STATUS"

          case "$ECS_STATUS" in

            DELETE_COMPLETE)
              echo ""
              echo "ECS stack is already deleted."
              exit 0
              ;;

            DELETE_IN_PROGRESS)
              echo ""
              echo "ECS stack deletion is already in progress."
              ;;

            *)
              echo ""
              echo "Starting ECS stack deletion..."

              aws cloudformation delete-stack \
                --stack-name "$ECS_STACK_NAME" \
                --region "$AWS_REGION"
              ;;

          esac

          echo ""
          echo "Waiting for ECS stack deletion..."

          aws cloudformation wait stack-delete-complete \
            --stack-name "$ECS_STACK_NAME" \
            --region "$AWS_REGION"

          echo ""
          echo "ECS CloudFormation stack deleted successfully."
          echo "================================================"

      # ====================================================
      # 16. DELETE ECR IMAGES
      # ====================================================
      #
      # The ECR repository is owned by MainStack.
      #
      # CloudFormation ECR repositories can fail deletion if
      # images are still present.
      #
      # Therefore all repository images are removed before
      # Terraform destroys MainStack.
      #
      # The repository itself is NOT deleted here.
      # CloudFormation remains responsible for deleting it.
      # ====================================================

      - name: Delete ECR Images
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "CLEANING ECR IMAGES"
          echo "================================================"

          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo ""
            echo "ECR repository does not exist."
            exit 0
          fi

          echo ""
          echo "ECR Repository:"
          echo "$ECR_REPOSITORY_NAME"

          # ------------------------------------------------
          # ECR batch-delete-image accepts a maximum of 100
          # image identifiers per request.
          #
          # Therefore images are deleted in batches.
          # ------------------------------------------------

          while true; do

            IMAGE_IDS=$(aws ecr list-images \
              --repository-name "$ECR_REPOSITORY_NAME" \
              --region "$AWS_REGION" \
              --filter tagStatus=ANY \
              --query 'imageIds[0:100]' \
              --output json)

            IMAGE_COUNT=$(echo "$IMAGE_IDS" | jq 'length')

            if [ "$IMAGE_COUNT" -eq 0 ]; then
              break
            fi

            echo ""
            echo "Deleting ECR image batch:"
            echo "$IMAGE_COUNT images"

            aws ecr batch-delete-image \
              --repository-name "$ECR_REPOSITORY_NAME" \
              --region "$AWS_REGION" \
              --image-ids "$IMAGE_IDS" \
              >/dev/null

          done

          echo ""
          echo "ECR image cleanup completed."
          echo "================================================"

      # ====================================================
      # 17. VERIFY ECR IMAGE CLEANUP
      # ====================================================

      - name: Verify ECR Image Cleanup
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING ECR IMAGE CLEANUP"
          echo "================================================"

          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo ""
            echo "ECR repository no longer exists."
            exit 0
          fi

          REMAINING_IMAGES=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --region "$AWS_REGION" \
            --query 'length(imageDetails)' \
            --output text)

          echo ""
          echo "Remaining ECR images:"
          echo "$REMAINING_IMAGES"

          if [ "$REMAINING_IMAGES" != "0" ]; then
            echo ""
            echo "ERROR: ECR repository still contains images."
            exit 1
          fi

          echo ""
          echo "ECR repository is empty."
          echo "================================================"

      # ====================================================
      # 18. TERRAFORM DESTROY
      # ====================================================
      #
      # Terraform owns the Main CloudFormation stack.
      #
      # Therefore Terraform destroy removes:
      #
      #   aws_cloudformation_stack.main
      #
      # CloudFormation then deletes the resources contained
      # inside MainStack.
      #
      # The MainStack deletion removes the resources currently
      # defined as part of MainStack.
      #
      # Depending on the current MainStack template, these may
      # include:
      #
      #   VPC
      #   EC2
      #   S3
      #   RDS
      #   ECR
      #   EKS
      #   supporting resources
      # ====================================================

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "STARTING TERRAFORM DESTROY"
          echo "================================================"

          echo ""
          echo "Project:"
          echo "$PROJECT_NAME"

          echo ""
          echo "Environment:"
          echo "$ENVIRONMENT"

          echo ""
          echo "Main CloudFormation Stack:"
          echo "$MAIN_STACK_NAME"

          echo ""
          echo "Terraform State Bucket:"
          echo "$TF_STATE_BUCKET"

          echo ""
          echo "Terraform State Key:"
          echo "$TF_STATE_KEY"

          # ------------------------------------------------
          # The workflow already required the explicit
          # DESTROY confirmation, therefore Terraform can use
          # -auto-approve here.
          # ------------------------------------------------

          terraform destroy \
            -input=false \
            -auto-approve

          echo ""
          echo "Terraform destroy completed."
          echo "================================================"

      # ====================================================
      # 19. CHECK TERRAFORM STATE AFTER DESTROY
      #
      # Confirm that Terraform state is empty after destruction.
      #
      # A non-empty state or state-read failure is reported as a
      # warning here; the workflow continues to the AWS resource
      # verification steps.
      # ====================================================

      - name: Verify Terraform State After Destroy
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING TERRAFORM STATE AFTER DESTROY"
          echo "================================================"

          if terraform state list \
            > /tmp/terraform-state-after.txt \
            2>/tmp/terraform-state-after-error.txt; then

            if [ -s /tmp/terraform-state-after.txt ]; then

              echo ""
              echo "WARNING: Terraform still contains resources:"
              cat /tmp/terraform-state-after.txt

            else

              echo ""
              echo "Terraform state is empty."

            fi

          else

            echo ""
            echo "Terraform state could not be read."
            cat /tmp/terraform-state-after-error.txt || true

          fi

          echo "================================================"

      # ====================================================
      # 20. VERIFY MAIN CLOUDFORMATION STACK DELETION
      # ====================================================

      - name: Verify Main CloudFormation Stack Deletion
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING MAIN CLOUDFORMATION STACK DELETION"
          echo "================================================"

          if aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            STACK_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$MAIN_STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text)

            echo ""
            echo "ERROR: MainStack still exists."
            echo "Stack status:"
            echo "$STACK_STATUS"

            exit 1
          fi

          echo ""
          echo "Main CloudFormation stack no longer exists."
          echo "================================================"

      # ====================================================
      # 21. VERIFY ECS STACK DELETION
      # ====================================================

      - name: Verify ECS Stack Deletion
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING ECS STACK DELETION"
          echo "================================================"

          if aws cloudformation describe-stacks \
            --stack-name "$ECS_STACK_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo ""
            echo "ERROR: ECS stack still exists."
            exit 1
          fi

          echo ""
          echo "ECS stack no longer exists."
          echo "================================================"

      # ====================================================
      # 22. VERIFY ECR REPOSITORY DELETION
      # ====================================================
      #
      # MainStack/CloudFormation should normally delete the
      # repository after the images were removed.
      #
      # A remaining repository indicates that CloudFormation
      # did not remove it successfully.
      # ====================================================

      - name: Verify ECR Repository Deletion
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING ECR REPOSITORY DELETION"
          echo "================================================"

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo ""
            echo "ERROR: ECR repository still exists."
            echo ""
            echo "CloudFormation/MainStack did not remove the repository."
            echo "Manual investigation is required."

            exit 1

          else

            echo ""
            echo "ECR repository no longer exists."

          fi

          echo "================================================"

      # ====================================================
      # 23. VERIFY EKS CLUSTER DELETION
      # ====================================================
      #
      # EKS is owned by MainStack.
      #
      # This step verifies that CloudFormation successfully
      # removed the EKS cluster during MainStack destruction.
      # ====================================================

      - name: Verify EKS Cluster Deletion
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING EKS CLUSTER DELETION"
          echo "================================================"

          if aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo ""
            echo "ERROR: EKS cluster still exists."

            aws eks describe-cluster \
              --name "$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --query 'cluster.{Name:name,Status:status}' \
              --output table

            exit 1

          fi

          echo ""
          echo "EKS cluster no longer exists."
          echo "================================================"

      # ====================================================
      # 24. OPTIONAL TERRAFORM BACKEND DELETION
      # ====================================================
      #
      # This is intentionally the LAST destructive operation.
      #
      # Terraform no longer needs the backend because
      # terraform destroy has already completed.
      #
      # The bucket is versioned, so both object versions and
      # delete markers must be removed before deleting the
      # bucket itself.
      # ====================================================

      - name: Optionally Delete Terraform Backend
        if: ${{ inputs.delete_terraform_backend == true }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "DELETING TERRAFORM BACKEND"
          echo "================================================"

          echo ""
          echo "Terraform state bucket:"
          echo "$TF_STATE_BUCKET"

          # ------------------------------------------------
          # Verify bucket exists.
          # ------------------------------------------------

          if ! aws s3api head-bucket \
            --bucket "$TF_STATE_BUCKET" \
            --region "$TF_STATE_REGION" \
            >/dev/null 2>&1; then

            echo ""
            echo "Terraform state bucket does not exist."
            exit 0
          fi

          # ------------------------------------------------
          # Delete all object versions and delete markers.
          #
          # S3 versioning means ordinary:
          #
          #   aws s3 rm
          #
          # is not sufficient for complete bucket deletion.
          # ------------------------------------------------

          echo ""
          echo "Deleting all object versions and delete markers..."

          while true; do

            OBJECT_VERSIONS=$(aws s3api list-object-versions \
              --bucket "$TF_STATE_BUCKET" \
              --region "$TF_STATE_REGION" \
              --output json)

            VERSION_COUNT=$(echo "$OBJECT_VERSIONS" | jq '
              (
                (.Versions // []) +
                (.DeleteMarkers // [])
              ) | length
            ')

            if [ "$VERSION_COUNT" -eq 0 ]; then
              break
            fi

            echo "$OBJECT_VERSIONS" \
              | jq -c '
                  [
                    (.Versions // [])[],
                    (.DeleteMarkers // [])[]
                  ]
                  | {
                      Objects: map({
                        Key: .Key,
                        VersionId: .VersionId
                      })
                    }
                ' \
              > /tmp/delete-object-versions.json

            aws s3api delete-objects \
              --bucket "$TF_STATE_BUCKET" \
              --region "$TF_STATE_REGION" \
              --delete file:///tmp/delete-object-versions.json \
              >/dev/null

          done

          # ------------------------------------------------
          # Verify bucket has no current objects.
          # ------------------------------------------------

          REMAINING_OBJECTS=$(aws s3api list-objects-v2 \
            --bucket "$TF_STATE_BUCKET" \
            --region "$TF_STATE_REGION" \
            --query 'KeyCount' \
            --output text 2>/dev/null || echo "0")

          if [ "$REMAINING_OBJECTS" != "0" ]; then
            echo ""
            echo "ERROR: Terraform state bucket still contains objects."
            exit 1
          fi

          # ------------------------------------------------
          # Delete the empty bucket.
          # ------------------------------------------------

          aws s3api delete-bucket \
            --bucket "$TF_STATE_BUCKET" \
            --region "$TF_STATE_REGION"

          echo ""
          echo "Terraform state bucket deleted successfully."
          echo "================================================"

      # ====================================================
      # 25. FINAL INFRASTRUCTURE VERIFICATION
      # ====================================================

      - name: Final Infrastructure Verification
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================================="
          echo "FINAL HYBRID IaC INFRASTRUCTURE DELETION VERIFICATION"
          echo "=========================================================="

          echo ""
          echo "Project:"
          echo "$PROJECT_NAME"

          echo ""
          echo "Environment:"
          echo "$ENVIRONMENT"

          echo ""
          echo "AWS Account:"
          echo "$AWS_ACCOUNT_ID"

          echo ""
          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""
          echo "Main CloudFormation Stack:"
          echo "$MAIN_STACK_NAME"

          echo ""
          echo "ECS CloudFormation Stack:"
          echo "$ECS_STACK_NAME"

          echo ""
          echo "EKS Cluster:"
          echo "$EKS_CLUSTER_NAME"

          echo ""
          echo "ECR Repository:"
          echo "$ECR_REPOSITORY_NAME"

          echo ""
          echo "----------------------------------------------------------"
          echo "VERIFICATION RESULTS"
          echo "----------------------------------------------------------"

          # ------------------------------------------------
          # MainStack
          # ------------------------------------------------

          if aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "FAIL: Main CloudFormation stack still exists."
            exit 1

          else

            echo "PASS: Main CloudFormation stack deleted."

          fi

          # ------------------------------------------------
          # ECS stack
          # ------------------------------------------------

          if aws cloudformation describe-stacks \
            --stack-name "$ECS_STACK_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "FAIL: ECS CloudFormation stack still exists."
            exit 1

          else

            echo "PASS: ECS CloudFormation stack deleted."

          fi

          # ------------------------------------------------
          # EKS
          # ------------------------------------------------

          if aws eks describe-cluster \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "FAIL: EKS cluster still exists."
            exit 1

          else

            echo "PASS: EKS cluster deleted."

          fi

          # ------------------------------------------------
          # ECR
          # ------------------------------------------------

          if aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY_NAME" \
            --region "$AWS_REGION" \
            >/dev/null 2>&1; then

            echo "FAIL: ECR repository still exists."
            exit 1

          else

            echo "PASS: ECR repository deleted."

          fi

          # ------------------------------------------------
          # Terraform backend
          # ------------------------------------------------

          if [ "${{ inputs.delete_terraform_backend }}" = "true" ]; then

            if aws s3api head-bucket \
              --bucket "$TF_STATE_BUCKET" \
              --region "$TF_STATE_REGION" \
              >/dev/null 2>&1; then

              echo "FAIL: Terraform backend bucket still exists."
              exit 1

            else

              echo "PASS: Terraform backend bucket deleted."

            fi

          else

            echo "INFO: Terraform backend bucket intentionally preserved."

          fi

          echo ""
          echo "----------------------------------------------------------"
          echo "INFRASTRUCTURE DELETION VERIFICATION COMPLETED"
          echo "----------------------------------------------------------"

          echo ""
          echo "The Hybrid Terraform + CloudFormation AWS infrastructure"
          echo "deletion workflow completed successfully."

          echo ""
          echo "No automatic deployment was triggered."

          echo ""
          echo "=========================================================="
