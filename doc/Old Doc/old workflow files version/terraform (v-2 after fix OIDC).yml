# ==========================================================
# HYBRID TERRAFORM + CLOUDFORMATION AWS LAB
# Terraform Deployment Workflow
# ==========================================================
#
# Purpose:
#
# This GitHub Actions workflow deploys the AWS infrastructure
# defined by Terraform.
#
# Terraform is responsible for orchestrating the deployment
# and can create/manage CloudFormation resources as part of
# the hybrid Infrastructure-as-Code architecture.
#
#
# HIGH-LEVEL DEPLOYMENT FLOW
#
# GitHub Actions
#       |
#       v
# GitHub OIDC
#       |
#       v
# AWS STS
#       |
#       v
# IAM Role
# aws-hybrid-iac-lab-GitHubActions
#       |
#       v
# Temporary AWS Credentials
#       |
#       v
# Terraform
#       |
#       +--> S3 CloudFormation Template Bucket
#       |
#       +--> Upload CloudFormation Templates
#       |
#       +--> CloudFormation Execution IAM Role
#       |
#       +--> Main CloudFormation Stack
#       |
#       +--> AWS Infrastructure
#
#
# AUTHENTICATION
#
# This workflow uses GitHub OIDC authentication.
#
# No permanent AWS access keys are stored in GitHub.
#
# Authentication flow:
#
# GitHub Actions
#       |
#       | OIDC identity token
#       v
# GitHub OIDC
#       |
#       | Web identity token
#       v
# AWS STS
#       |
#       | AssumeRoleWithWebIdentity
#       v
# IAM Role
#       |
#       v
# Temporary AWS Credentials
#
#
# GITHUB CONFIGURATION REQUIRED
#
# Repository Variable:
#
#   AWS_REGION
#
# Example:
#
#   us-east-1
#
#
# Repository Secret:
#
#   AWS_ROLE_ARN
#
# Example:
#
#   arn:aws:iam::1234567889:role/aws-hybrid-iac-lab-GitHubActions
#
#
# TERRAFORM DIRECTORY
#
#   infrastructure/terraform
#
#
# WORKFLOW CALLER
#
# This workflow can be called by:
#
#   .github/workflows/main-deploy.yaml
#
#
# MANUAL EXECUTION
#
# This workflow can also be started manually from:
#
# GitHub
#   -> Actions
#   -> Terraform Infrastructure
#   -> Run workflow
#
# ==========================================================


name: Terraform Infrastructure


# ==========================================================
# TRIGGERS
# ==========================================================
#
# workflow_call:
#
# Allows another reusable GitHub Actions workflow to call
# this workflow.
#
# workflow_dispatch:
#
# Allows manual execution from the GitHub Actions interface.
#
# ==========================================================

on:

  # --------------------------------------------------------
  # Allow main-deploy.yaml or another workflow to call this
  # workflow.
  # --------------------------------------------------------

  workflow_call:


  # --------------------------------------------------------
  # Allow manual execution from GitHub Actions.
  # --------------------------------------------------------

  workflow_dispatch:


# ==========================================================
# GITHUB ACTIONS PERMISSIONS
# ==========================================================
#
# These permissions control what the GitHub Actions job is
# allowed to request from GitHub.
#
#
# id-token: write
#
# REQUIRED for GitHub OIDC authentication.
#
# It allows GitHub Actions to request an OIDC identity token.
#
#
# contents: read
#
# REQUIRED by actions/checkout to read repository contents.
#
#
# IMPORTANT:
#
# The id-token permission does NOT give AWS permissions.
#
# AWS permissions are granted only after:
#
# GitHub OIDC
#       ->
# AWS STS
#       ->
# IAM Role
#
# successfully authenticates the workflow.
#
# ==========================================================

permissions:

  # Required for GitHub OIDC authentication with AWS.
  id-token: write

  # Required to checkout repository files.
  contents: read


# ==========================================================
# JOBS
# ==========================================================

jobs:


  # ========================================================
  # TERRAFORM DEPLOYMENT JOB
  # ========================================================

  terraform:

    # ------------------------------------------------------
    # Human-readable job name.
    # ------------------------------------------------------

    name: Terraform Infrastructure Deployment


    # ------------------------------------------------------
    # GitHub-hosted Linux runner.
    #
    # ubuntu-latest provides the environment required for:
    #
    #   - Git
    #   - Bash
    #   - AWS CLI
    #   - curl
    #   - Terraform setup
    #
    # ------------------------------------------------------

    runs-on: ubuntu-latest


    # ======================================================
    # WORKFLOW STEPS
    # ======================================================

    steps:


      # ====================================================
      # 1. CHECKOUT REPOSITORY
      # ====================================================
      #
      # Downloads the GitHub repository into the temporary
      # GitHub Actions runner.
      #
      # After checkout, files such as:
      #
      #   infrastructure/terraform
      #
      # and:
      #
      #   infrastructure/cloudformation
      #
      # are available to the workflow.
      #
      # ====================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ====================================================
      # 2. CONFIGURE AWS CREDENTIALS
      # ====================================================
      #
      # This step authenticates GitHub Actions with AWS using
      # GitHub OIDC.
      #
      #
      # AUTHENTICATION FLOW
      #
      # GitHub Actions
      #       |
      #       | OIDC token
      #       v
      # GitHub OIDC Provider
      #       |
      #       | Web identity token
      #       v
      # AWS STS
      #       |
      #       | AssumeRoleWithWebIdentity
      #       v
      # IAM Role
      #       |
      #       v
      # Temporary AWS Credentials
      #
      #
      # IMPORTANT:
      #
      # We do NOT use:
      #
      #   AWS_ACCESS_KEY_ID
      #   AWS_SECRET_ACCESS_KEY
      #
      # for this workflow.
      #
      # Instead, GitHub obtains temporary AWS credentials by
      # assuming the IAM role through OIDC.
      #
      #
      # GitHub Secret:
      #
      #   AWS_ROLE_ARN
      #
      #
      # GitHub Variable:
      #
      #   AWS_REGION
      #
      # ====================================================

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

          # ------------------------------------------------
          # AWS region used by Terraform and AWS CLI.
          #
          # This value comes from:
          #
          # GitHub Repository
          #   -> Settings
          #   -> Secrets and variables
          #   -> Actions
          #   -> Variables
          #
          # Variable:
          #
          #   AWS_REGION
          #
          # Example:
          #
          #   us-east-1
          #
          # ------------------------------------------------

          aws-region: ${{ vars.AWS_REGION }}


          # ------------------------------------------------
          # IAM role that GitHub Actions assumes through
          # GitHub OIDC.
          #
          # This value comes from:
          #
          # GitHub Repository
          #   -> Settings
          #   -> Secrets and variables
          #   -> Actions
          #   -> Secrets
          #
          # Secret:
          #
          #   AWS_ROLE_ARN
          #
          # Example:
          #
          #   arn:aws:iam::123456789:role/aws-hybrid-iac-lab-GitHubActions
          #
          # ------------------------------------------------

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}


      # ====================================================
      # 3. VERIFY AWS IDENTITY
      # ====================================================
      #
      # This step confirms that GitHub Actions successfully
      # authenticated with AWS.
      #
      # The AWS CLI uses the temporary credentials created by:
      #
      #   aws-actions/configure-aws-credentials
      #
      #
      # Expected output will identify the assumed role:
      #
      #   arn:aws:sts::123456789:assumed-role/
      #   aws-hybrid-iac-lab-GitHubActions/...
      #
      #
      # SECURITY:
      #
      # This command does NOT display the AWS secret access key.
      #
      # It only displays the AWS caller identity.
      #
      # ====================================================

      - name: Verify AWS Identity

        shell: bash

        run: |

          # ------------------------------------------------
          # Display the AWS identity currently being used by
          # the GitHub Actions runner.
          # ------------------------------------------------

          aws sts get-caller-identity


      # ====================================================
      # 4. SETUP TERRAFORM
      # ====================================================
      #
      # Installs Terraform on the GitHub Actions runner.
      #
      # hashicorp/setup-terraform automatically downloads and
      # configures Terraform for use by subsequent steps.
      #
      # ====================================================

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3


      # ====================================================
      # 5. TERRAFORM INIT
      # ====================================================
      #
      # Initializes the Terraform working directory.
      #
      # Working directory:
      #
      #   infrastructure/terraform
      #
      #
      # terraform init performs tasks such as:
      #
      #   - Initializing Terraform
      #   - Downloading Terraform providers
      #   - Initializing the backend
      #   - Preparing modules
      #
      # ====================================================

      - name: Terraform Init

        working-directory: infrastructure/terraform

        run: terraform init


      # ====================================================
      # 6. TERRAFORM FORMAT CHECK
      # ====================================================
      #
      # Checks whether Terraform files follow the standard
      # Terraform formatting rules.
      #
      #
      # -check
      #
      # Causes the command to fail when formatting changes
      # are required.
      #
      #
      # -recursive
      #
      # Checks Terraform files in subdirectories as well.
      #
      # ====================================================

      - name: Terraform Format Check

        working-directory: infrastructure/terraform

        run: terraform fmt -check -recursive


      # ====================================================
      # 7. TERRAFORM VALIDATE
      # ====================================================
      #
      # Validates the Terraform configuration.
      #
      # Terraform checks:
      #
      #   - Terraform syntax
      #   - Configuration structure
      #   - Required arguments
      #   - Provider configuration
      #   - Internal configuration consistency
      #
      #
      # IMPORTANT:
      #
      # terraform validate does NOT create AWS resources.
      #
      # ====================================================

      - name: Terraform Validate

        working-directory: infrastructure/terraform

        run: terraform validate


      # ====================================================
      # 8. TERRAFORM PLAN
      # ====================================================
      #
      # Creates a Terraform execution plan.
      #
      # The plan shows what Terraform intends to do.
      #
      # Possible actions include:
      #
      #   + create
      #   ~ update
      #   - destroy
      #
      #
      # IMPORTANT:
      #
      # terraform plan does NOT normally make infrastructure
      # changes.
      #
      # It compares the Terraform configuration and current
      # infrastructure state and calculates the required
      # changes.
      #
      # ====================================================

      - name: Terraform Plan

        working-directory: infrastructure/terraform

        run: terraform plan


      # ====================================================
      # 9. TERRAFORM APPLY
      # ====================================================
      #
      # Applies the Terraform configuration to AWS.
      #
      #
      # Terraform may create or manage resources such as:
      #
      #   - S3
      #   - IAM
      #   - CloudFormation
      #   - VPC
      #   - EC2
      #   - Other AWS services defined by the lab
      #
      #
      # In this hybrid architecture Terraform can also
      # orchestrate CloudFormation resources.
      #
      #
      # -auto-approve
      #
      # Automatically approves the Terraform execution plan.
      #
      # This is useful for an automated GitHub Actions CI/CD
      # lab because there is no interactive terminal available
      # to manually approve the operation.
      #
      # ====================================================

      - name: Terraform Apply

        working-directory: infrastructure/terraform

        run: terraform apply -auto-approve


# ==========================================================
# END OF WORKFLOW
# ==========================================================
#
# FINAL WORKFLOW FLOW
#
# 1. Checkout Repository
#           |
#           v
# 2. Configure AWS Credentials
#           |
#           +--> GitHub OIDC
#           |
#           +--> AWS STS
#           |
#           +--> IAM Role
#           |
#           +--> Temporary AWS Credentials
#           |
#           v
# 3. Verify AWS Identity
#           |
#           v
# 4. Setup Terraform
#           |
#           v
# 5. Terraform Init
#           |
#           v
# 6. Terraform Format Check
#           |
#           v
# 7. Terraform Validate
#           |
#           v
# 8. Terraform Plan
#           |
#           v
# 9. Terraform Apply
#           |
#           v
#      AWS Infrastructure
#
#
# OIDC DEBUGGING STEPS REMOVED
#
# The following temporary troubleshooting steps have
# intentionally been removed from the final workflow:
#
#   - Debug GitHub OIDC Claims
#   - Direct STS OIDC Test
#
# These were useful during troubleshooting but are not
# required during normal Terraform deployments.
#
#
# OIDC AUTHENTICATION HAS ALREADY BEEN VERIFIED
#
# The direct STS test successfully confirmed:
#
# GitHub OIDC
#      ->
# AWS STS
#      ->
# IAM Role
#
# Therefore the production workflow only needs:
#
#   configure-aws-credentials
#
# to perform the normal authentication process.
#
# ==========================================================

