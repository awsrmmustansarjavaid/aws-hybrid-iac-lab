# ==========================================================
# HYBRID TERRAFORM + CLOUDFORMATION AWS DEVOPS LAB
# Docker + Amazon ECR + ECS Deployment Workflow
# ==========================================================
#
# File:
#   .github/workflows/docker.yml
#
# Purpose:
#
#   This workflow handles the APPLICATION CONTAINER
#   deployment phase of the Hybrid IaC AWS DevOps Lab.
#
#
# HIGH-LEVEL FLOW
# ==========================================================
#
# GitHub
#    |
#    v
# GitHub OIDC
#    |
#    v
# AWS IAM Role
#    |
#    v
# Docker Build
#    |
#    v
# Amazon ECR
#    |
#    | Repository URI + immutable GITHUB_SHA
#    v
# ECS CloudFormation
#    |
#    v
# ECS Fargate
#    |
#    v
# Private ECS Tasks
#
#
# IMPORTANT:
#
# ECR is created by:
#
#   infrastructure/cloudformation/nested/ecr.yaml
#
# ECS infrastructure is created by:
#
#   infrastructure/cloudformation/nested/ecs.yaml
#
# This workflow does NOT create either resource.
#
# ==========================================================


# ==========================================================
# WORKFLOW NAME
# ==========================================================

name: Docker Build, ECR Push and ECS Deployment


# ==========================================================
# GLOBAL ENVIRONMENT VARIABLES
# ==========================================================
#
# These values are available to every step in this job.
#
# GitHub Repository Variables required:
#
#   AWS_REGION
#   AWS_ACCOUNT_ID
#   AWS_ROLE_ARN
#
# AWS authentication uses GitHub OIDC.
#
# No long-lived:
#
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# is required.
#
# ==========================================================

env:

  # --------------------------------------------------------
  # AWS REGION
  # --------------------------------------------------------

  AWS_REGION: ${{ vars.AWS_REGION }}


  # --------------------------------------------------------
  # AWS ACCOUNT ID
  # --------------------------------------------------------
  #
  # Used only to verify that GitHub authenticated into the
  # expected AWS account.
  #
  # IMPORTANT:
  #
  # This value is NOT used to construct the ECR URI.
  #
  # The real ECR URI is retrieved directly from AWS.
  #
  # --------------------------------------------------------

  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}


  # --------------------------------------------------------
  # AWS IAM ROLE ARN
  # --------------------------------------------------------
  #
  # GitHub Actions assumes this IAM role using OIDC.
  #
  # Example:
  #
  # arn:aws:iam::<ACCOUNT_ID>:role/aws-hybrid-iac-lab-GitHubActions
  #
  # --------------------------------------------------------

  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}


  # --------------------------------------------------------
  # PROJECT NAME
  # --------------------------------------------------------

  PROJECT_NAME: hybridiaclab


  # --------------------------------------------------------
  # ENVIRONMENT
  # --------------------------------------------------------

  ENVIRONMENT: dev


  # --------------------------------------------------------
  # ECR REPOSITORY NAME
  # --------------------------------------------------------
  #
  # This MUST match the repository created by ecr.yaml.
  #
  # Expected:
  #
  # hybridiaclab-dev-app
  #
  # --------------------------------------------------------

  ECR_REPOSITORY_NAME: hybridiaclab-dev-app


  # --------------------------------------------------------
  # LOCAL DOCKER IMAGE NAME
  # --------------------------------------------------------
  #
  # Temporary image name used by the GitHub runner.
  #
  # --------------------------------------------------------

  DOCKER_IMAGE_NAME: hybrid-iac-app


  # --------------------------------------------------------
  # DOCKER BUILD CONTEXT
  # --------------------------------------------------------
  #
  # Expected:
  #
  # docker/app/
  #
  # containing:
  #
  # docker/app/Dockerfile
  #
  # --------------------------------------------------------

  DOCKER_BUILD_CONTEXT: docker/app


  # --------------------------------------------------------
  # MAIN CLOUDFORMATION STACK
  # --------------------------------------------------------
  #
  # Root stack exposing the network outputs required by ECS.
  #
  # --------------------------------------------------------

  MAIN_STACK_NAME: hybridiaclab-dev-MainStack


  # --------------------------------------------------------
  # ECS CLOUDFORMATION STACK
  # --------------------------------------------------------
  #
  # Creates the ECS/Fargate application platform.
  #
  # --------------------------------------------------------

  ECS_STACK_NAME: hybridiaclab-dev-ECSStack


  # --------------------------------------------------------
  # ECS CLOUDFORMATION TEMPLATE
  # --------------------------------------------------------

  ECS_TEMPLATE: infrastructure/cloudformation/nested/ecs.yaml


# ==========================================================
# WORKFLOW TRIGGERS
# ==========================================================

on:

  # --------------------------------------------------------
  # REUSABLE WORKFLOW
  # --------------------------------------------------------

  workflow_call:


  # --------------------------------------------------------
  # MANUAL EXECUTION
  # --------------------------------------------------------

  workflow_dispatch:


# ==========================================================
# GITHUB ACTIONS PERMISSIONS
# ==========================================================
#
# id-token:
#
#   Required for GitHub OIDC authentication.
#
# contents:
#
#   Required by actions/checkout.
#
# ==========================================================

permissions:

  id-token: write

  contents: read


# ==========================================================
# JOBS
# ==========================================================

jobs:

  docker:

    # ------------------------------------------------------
    # JOB NAME
    # ------------------------------------------------------

    name: Build Docker Image, Push to ECR and Deploy ECS


    # ------------------------------------------------------
    # RUNNER
    # ------------------------------------------------------

    runs-on: ubuntu-latest


    # ======================================================
    # STEPS
    # ======================================================

    steps:


      # ====================================================
      # 1. CHECKOUT REPOSITORY
      # ====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ====================================================
      # 2. VALIDATE DEPLOYMENT CONFIGURATION
      # ====================================================
      #
      # Fail early before AWS authentication or Docker build
      # if required configuration is missing.
      #
      # ====================================================

      - name: Validate Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VALIDATING DEPLOYMENT CONFIGURATION"
          echo "================================================"

          # ------------------------------------------------
          # Validate AWS configuration
          # ------------------------------------------------

          if [ -z "$AWS_REGION" ]; then
            echo "ERROR: AWS_REGION is empty."
            echo "Set GitHub Repository Variable: AWS_REGION"
            exit 1
          fi

          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "ERROR: AWS_ACCOUNT_ID is empty."
            echo "Set GitHub Repository Variable: AWS_ACCOUNT_ID"
            exit 1
          fi

          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "ERROR: AWS_ROLE_ARN is empty."
            echo "Set GitHub Repository Variable: AWS_ROLE_ARN"
            exit 1
          fi


          # ------------------------------------------------
          # Validate project configuration
          # ------------------------------------------------

          if [ -z "$PROJECT_NAME" ]; then
            echo "ERROR: PROJECT_NAME is empty."
            exit 1
          fi

          if [ -z "$ENVIRONMENT" ]; then
            echo "ERROR: ENVIRONMENT is empty."
            exit 1
          fi

          if [ -z "$ECR_REPOSITORY_NAME" ]; then
            echo "ERROR: ECR_REPOSITORY_NAME is empty."
            exit 1
          fi


          # ------------------------------------------------
          # Validate Docker build context
          # ------------------------------------------------

          if [ ! -d "$DOCKER_BUILD_CONTEXT" ]; then
            echo "ERROR: Docker build context does not exist:"
            echo "$DOCKER_BUILD_CONTEXT"
            exit 1
          fi


          # ------------------------------------------------
          # Validate Dockerfile
          # ------------------------------------------------

          if [ ! -f "$DOCKER_BUILD_CONTEXT/Dockerfile" ]; then
            echo "ERROR: Dockerfile does not exist:"
            echo "$DOCKER_BUILD_CONTEXT/Dockerfile"
            exit 1
          fi


          # ------------------------------------------------
          # Validate ECS CloudFormation template
          # ------------------------------------------------

          if [ ! -f "$ECS_TEMPLATE" ]; then
            echo "ERROR: ECS CloudFormation template does not exist:"
            echo "$ECS_TEMPLATE"
            exit 1
          fi


          # ------------------------------------------------
          # Validate GITHUB_SHA
          # ------------------------------------------------
          #
          # GITHUB_SHA is used as the immutable Docker image
          # tag.
          #
          # ------------------------------------------------

          if [ -z "${GITHUB_SHA:-}" ]; then
            echo "ERROR: GITHUB_SHA is empty."
            echo "Cannot create an immutable Docker image tag."
            exit 1
          fi


          echo ""
          echo "Configuration validation successful."
          echo ""
          echo "AWS Region:              $AWS_REGION"
          echo "AWS Account:             $AWS_ACCOUNT_ID"
          echo "Project:                 $PROJECT_NAME"
          echo "Environment:             $ENVIRONMENT"
          echo "ECR Repository:          $ECR_REPOSITORY_NAME"
          echo "Docker Context:          $DOCKER_BUILD_CONTEXT"
          echo "Main Stack:              $MAIN_STACK_NAME"
          echo "ECS Stack:               $ECS_STACK_NAME"
          echo "ECS Template:            $ECS_TEMPLATE"
          echo "Git Commit:              $GITHUB_SHA"

          echo "================================================"


      # ====================================================
      # 3. CONFIGURE AWS CREDENTIALS USING GITHUB OIDC
      # ====================================================
      #
      # GitHub
      #    |
      #    v
      # OIDC Token
      #    |
      #    v
      # AWS IAM Role
      #    |
      #    v
      # Temporary AWS Credentials
      #
      # ====================================================

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:

          aws-region: ${{ env.AWS_REGION }}

          role-to-assume: ${{ env.AWS_ROLE_ARN }}


      # ====================================================
      # 4. VERIFY AWS IDENTITY
      # ====================================================

      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING AWS IDENTITY"
          echo "================================================"

          CALLER_ACCOUNT_ID=$(aws sts get-caller-identity \
            --query 'Account' \
            --output text)


          if [ -z "$CALLER_ACCOUNT_ID" ] || [ "$CALLER_ACCOUNT_ID" = "None" ]; then
            echo "ERROR: Unable to determine authenticated AWS account."
            exit 1
          fi


          echo "Expected account:"
          echo "$AWS_ACCOUNT_ID"

          echo ""

          echo "Authenticated account:"
          echo "$CALLER_ACCOUNT_ID"


          if [ "$CALLER_ACCOUNT_ID" != "$AWS_ACCOUNT_ID" ]; then

            echo ""
            echo "ERROR: AWS account mismatch."
            exit 1

          fi


          echo ""
          echo "AWS identity verification successful."
          echo "================================================"


      # ====================================================
      # 5. LOGIN TO AMAZON ECR
      # ====================================================
      #
      # The ECR repository is NOT created here.
      #
      # It must already exist because ecr.yaml owns the
      # repository infrastructure.
      #
      # ====================================================

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ====================================================
      # 6. VERIFY ECR REPOSITORY AND GET REAL URI
      # ====================================================
      #
      # IMPORTANT:
      #
      # DO NOT manually construct:
      #
      #   <account>.dkr.ecr.<region>.amazonaws.com/<repo>
      #
      # Instead ask AWS for the authoritative repositoryUri.
      #
      # This also guarantees that the repository exists before
      # the ECS deployment begins.
      #
      # ====================================================

      - name: Verify ECR Repository and Get Repository URI
        id: ecr
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING ECR REPOSITORY"
          echo "================================================"

          echo "Repository:"
          echo "$ECR_REPOSITORY_NAME"


          # ------------------------------------------------
          # Query AWS for the real repository URI.
          # ------------------------------------------------

          ECR_URI=$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY_NAME" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' \
            --output text)


          # ------------------------------------------------
          # Validate ECR URI.
          # ------------------------------------------------

          if [ -z "$ECR_URI" ] || [ "$ECR_URI" = "None" ]; then
            echo "ERROR: ECR repository URI could not be retrieved."
            echo "The ECR repository may not exist."
            exit 1
          fi


          # ------------------------------------------------
          # Export repository URI for later steps.
          # ------------------------------------------------

          echo "ECR_URI=$ECR_URI" >> "$GITHUB_OUTPUT"


          echo ""
          echo "ECR repository exists."
          echo "Authoritative ECR URI:"
          echo "$ECR_URI"

          echo "================================================"


      # ====================================================
      # 7. BUILD DOCKER IMAGE
      # ====================================================
      #
      # The local Docker image uses GITHUB_SHA as its tag.
      #
      # Example:
      #
      # hybrid-iac-app:abc123...
      #
      # ====================================================

      - name: Build Docker Image
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "BUILDING DOCKER IMAGE"
          echo "================================================"

          LOCAL_IMAGE="$DOCKER_IMAGE_NAME:$GITHUB_SHA"

          echo "Image:"
          echo "$LOCAL_IMAGE"

          echo ""

          echo "Build context:"
          echo "$DOCKER_BUILD_CONTEXT"


          # ------------------------------------------------
          # Build Docker image.
          # ------------------------------------------------

          docker build \
            --tag "$LOCAL_IMAGE" \
            "$DOCKER_BUILD_CONTEXT"


          echo ""
          echo "Docker image build successful."
          echo "================================================"


      # ====================================================
      # 8. VERIFY CURL EXISTS IN DOCKER IMAGE
      # ====================================================
      #
      # IMPORTANT:
      #
      # ecs.yaml uses:
      #
      #   HealthCheck:
      #     Command:
      #       - CMD-SHELL
      #       - "curl -f http://localhost/ || exit 1"
      #
      # Therefore the FINAL Docker image must contain curl.
      #
      # This test runs inside the actual image that was built.
      #
      # The test intentionally happens BEFORE the image is
      # tagged and pushed to ECR.
      #
      # ====================================================

      - name: Verify curl Exists in Docker Image
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING CURL INSIDE DOCKER IMAGE"
          echo "================================================"

          LOCAL_IMAGE="$DOCKER_IMAGE_NAME:$GITHUB_SHA"

          echo "Docker image:"
          echo "$LOCAL_IMAGE"

          echo ""

          # ------------------------------------------------
          # Check whether curl exists inside the image.
          #
          # 'command -v curl' searches for the curl executable
          # using the container's PATH.
          # ------------------------------------------------

          if ! docker run --rm \
            "$LOCAL_IMAGE" \
            sh -c 'command -v curl >/dev/null 2>&1'
          then

            echo ""
            echo "ERROR: curl was NOT found inside the Docker image."
            echo ""
            echo "ECS health check requires:"
            echo "  curl -f http://localhost/"
            echo ""
            echo "Update:"
            echo "  docker/app/Dockerfile"
            echo ""
            echo "The image must contain curl before ECS deployment."

            exit 1
          fi

          echo ""
          echo "SUCCESS: curl exists inside the Docker image."

          echo "================================================"

      # ============================================================
      # 9. RUN CONTAINER AND TEST ECS HEALTH CHECK
      # ============================================================
      #
      # PURPOSE:
      #   This performs the same HTTP health check that ECS will
      #   execute inside the running container.
      #
      # ECS HEALTH CHECK:
      #   curl -f http://localhost/ || exit 1
      #
      # WHY THIS TEST IS IMPORTANT:
      #   The previous step only verifies that the curl executable
      #   exists inside the Docker image.
      #
      #   This step goes further:
      #
      #     1. Starts the actual Docker image.
      #     2. Waits for Nginx to start.
      #     3. Executes curl against localhost.
      #     4. Fails the GitHub Actions job if HTTP fails.
      #
      #   Therefore, we test the real container behavior before
      #   pushing the image to ECR and deploying it to ECS.
      #
      # CLEANUP:
      #   The trap automatically removes the temporary container
      #   when this step finishes, including when the curl test fails.
      #
      # ============================================================
      - name: Test container HTTP health check
        run: |
          # Start the image as a temporary background container.
          docker run -d --name ecs-health-test "$LOCAL_IMAGE"

          # Always remove the temporary container when this step exits.
          # This prevents leftover containers on the GitHub runner.
          trap 'docker rm -f ecs-health-test >/dev/null 2>&1 || true' EXIT

          # Give Nginx a few seconds to start before testing HTTP.
          sleep 5

          # Run the same health check configured in ecs.yaml.
          # -f makes curl return a failure exit code for HTTP errors.
          docker exec ecs-health-test \
            curl -f http://localhost/

          # If curl succeeded, the Docker container is serving HTTP.
          echo "SUCCESS: ECS health check passed."

      # ====================================================
      # 10. CREATE IMMUTABLE IMAGE URI
      # ====================================================
      #
      # ECR repository URI comes from AWS.
      #
      # Image tag comes from GITHUB_SHA.
      #
      # Result:
      #
      #   <real-ecr-uri>:<github-sha>
      #
      # ====================================================

      - name: Create Immutable ECR Image URI
        id: image
        shell: bash
        env:
          ECR_URI: ${{ steps.ecr.outputs.ECR_URI }}
        run: |
          set -euo pipefail


          if [ -z "$ECR_URI" ]; then
            echo "ERROR: ECR_URI is empty."
            exit 1
          fi


          if [ -z "${GITHUB_SHA:-}" ]; then
            echo "ERROR: GITHUB_SHA is empty."
            exit 1
          fi


          IMAGE_URI="${ECR_URI}:${GITHUB_SHA}"


          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_OUTPUT"


          echo "================================================"
          echo "IMMUTABLE ECR IMAGE URI"
          echo "================================================"

          echo "$IMAGE_URI"

          echo "================================================"


      # ====================================================
      # 11. TAG LOCAL IMAGE FOR ECR
      # ====================================================

      - name: Tag Docker Image for ECR
        shell: bash
        env:
          ECR_IMAGE: ${{ steps.image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail

          LOCAL_IMAGE="$DOCKER_IMAGE_NAME:$GITHUB_SHA"


          echo "================================================"
          echo "TAGGING DOCKER IMAGE"
          echo "================================================"

          echo "Local image:"
          echo "$LOCAL_IMAGE"

          echo ""

          echo "ECR image:"
          echo "$ECR_IMAGE"


          docker tag \
            "$LOCAL_IMAGE" \
            "$ECR_IMAGE"


          echo ""
          echo "Docker image tagged successfully."
          echo "================================================"


      # ====================================================
      # 12. PUSH IMAGE TO ECR
      # ====================================================

      - name: Push Docker Image to ECR
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "PUSHING DOCKER IMAGE TO ECR"
          echo "================================================"

          echo "Image:"
          echo "$IMAGE_URI"


          docker push "$IMAGE_URI"


          echo ""
          echo "Docker image successfully pushed to ECR."
          echo "================================================"


      # ====================================================
      # 13. VERIFY ECR IMAGE
      # ====================================================
      #
      # Confirms that the exact GITHUB_SHA image was pushed.
      #
      # ====================================================

      - name: Verify ECR Image
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING ECR IMAGE"
          echo "================================================"

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --region "$AWS_REGION" \
            --query 'imageDetails[0].{Repository:repositoryName,Tag:imageTags[0],Digest:imageDigest}' \
            --output table


          echo ""
          echo "ECR image verification successful."
          echo "================================================"


      # ====================================================
      # 14. GET MAIN CLOUDFORMATION NETWORK OUTPUTS
      # ====================================================
      #
      # MainStack must expose these outputs:
      #
      #   VpcId
      #   PublicSubnet1Id
      #   PublicSubnet2Id
      #   PrivateSubnet1Id
      #   PrivateSubnet2Id
      #
      # ====================================================

      - name: Get CloudFormation Network Outputs
        id: network
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "GETTING CLOUDFORMATION NETWORK OUTPUTS"
          echo "================================================"

          echo "Main Stack:"
          echo "$MAIN_STACK_NAME"


          # ------------------------------------------------
          # Verify MainStack exists.
          # ------------------------------------------------

          aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            > /dev/null


          # ------------------------------------------------
          # Retrieve VPC ID.
          # ------------------------------------------------

          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue | [0]" \
            --output text)


          # ------------------------------------------------
          # Retrieve public subnet 1.
          # ------------------------------------------------

          PUBLIC_SUBNET_1_ID=$(aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PublicSubnet1Id'].OutputValue | [0]" \
            --output text)


          # ------------------------------------------------
          # Retrieve public subnet 2.
          # ------------------------------------------------

          PUBLIC_SUBNET_2_ID=$(aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PublicSubnet2Id'].OutputValue | [0]" \
            --output text)


          # ------------------------------------------------
          # Retrieve private subnet 1.
          # ------------------------------------------------

          PRIVATE_SUBNET_1_ID=$(aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet1Id'].OutputValue | [0]" \
            --output text)


          # ------------------------------------------------
          # Retrieve private subnet 2.
          # ------------------------------------------------

          PRIVATE_SUBNET_2_ID=$(aws cloudformation describe-stacks \
            --stack-name "$MAIN_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet2Id'].OutputValue | [0]" \
            --output text)


          # ------------------------------------------------
          # Validate all required outputs.
          # ------------------------------------------------

          for VALUE_NAME in \
            VPC_ID \
            PUBLIC_SUBNET_1_ID \
            PUBLIC_SUBNET_2_ID \
            PRIVATE_SUBNET_1_ID \
            PRIVATE_SUBNET_2_ID
          do

            VALUE="${!VALUE_NAME}"

            if [ -z "$VALUE" ] || [ "$VALUE" = "None" ]; then
              echo "ERROR: $VALUE_NAME was not returned by MainStack."
              exit 1
            fi

          done


          # ------------------------------------------------
          # Export values for later steps.
          # ------------------------------------------------

          echo "VPC_ID=$VPC_ID" >> "$GITHUB_OUTPUT"

          echo "PUBLIC_SUBNET_1_ID=$PUBLIC_SUBNET_1_ID" >> "$GITHUB_OUTPUT"

          echo "PUBLIC_SUBNET_2_ID=$PUBLIC_SUBNET_2_ID" >> "$GITHUB_OUTPUT"

          echo "PRIVATE_SUBNET_1_ID=$PRIVATE_SUBNET_1_ID" >> "$GITHUB_OUTPUT"
          
          echo "PRIVATE_SUBNET_2_ID=$PRIVATE_SUBNET_2_ID" >> "$GITHUB_OUTPUT"


          echo ""
          echo "Network outputs retrieved successfully."

          echo "VPC:                  $VPC_ID"
          echo "Public Subnet 1:      $PUBLIC_SUBNET_1_ID"
          echo "Public Subnet 2:      $PUBLIC_SUBNET_2_ID"
          echo "Private Subnet 1:     $PRIVATE_SUBNET_1_ID"
          echo "Private Subnet 2:     $PRIVATE_SUBNET_2_ID"

          echo "================================================"


      # ====================================================
      # 15. VALIDATE NETWORK RESOURCES
      # ====================================================
      #
      # This validation does more than check whether the
      # CloudFormation outputs are non-empty.
      #
      # It confirms that every subnet actually belongs to
      # the expected VPC.
      #
      # ====================================================

      - name: Validate Network Resources
        shell: bash
        env:
          VPC_ID: ${{ steps.network.outputs.VPC_ID }}
          PUBLIC_SUBNET_1_ID: ${{ steps.network.outputs.PUBLIC_SUBNET_1_ID }}
          PUBLIC_SUBNET_2_ID: ${{ steps.network.outputs.PUBLIC_SUBNET_2_ID }}
          PRIVATE_SUBNET_1_ID: ${{ steps.network.outputs.PRIVATE_SUBNET_1_ID }}
          PRIVATE_SUBNET_2_ID: ${{ steps.network.outputs.PRIVATE_SUBNET_2_ID }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VALIDATING NETWORK RESOURCES"
          echo "================================================"


          # ------------------------------------------------
          # Verify VPC exists.
          # ------------------------------------------------

          aws ec2 describe-vpcs \
            --vpc-ids "$VPC_ID" \
            --region "$AWS_REGION" \
            > /dev/null


          # ------------------------------------------------
          # Validate each subnet individually.
          #
          # This makes the validation defensive.
          # ------------------------------------------------

          for SUBNET_ID in \
            "$PUBLIC_SUBNET_1_ID" \
            "$PUBLIC_SUBNET_2_ID" \
            "$PRIVATE_SUBNET_1_ID" \
            "$PRIVATE_SUBNET_2_ID"
          do

            echo ""
            echo "Checking subnet:"
            echo "$SUBNET_ID"


            SUBNET_VPC_ID=$(aws ec2 describe-subnets \
              --subnet-ids "$SUBNET_ID" \
              --region "$AWS_REGION" \
              --query 'Subnets[0].VpcId' \
              --output text)


            if [ -z "$SUBNET_VPC_ID" ] || [ "$SUBNET_VPC_ID" = "None" ]; then
              echo "ERROR: Unable to determine VPC for subnet $SUBNET_ID."
              exit 1
            fi


            if [ "$SUBNET_VPC_ID" != "$VPC_ID" ]; then

              echo ""
              echo "ERROR: Subnet does not belong to expected VPC."

              echo "Subnet:"
              echo "$SUBNET_ID"

              echo "Expected VPC:"
              echo "$VPC_ID"

              echo "Actual VPC:"
              echo "$SUBNET_VPC_ID"

              exit 1

            fi


            echo "Subnet belongs to expected VPC."

          done


          echo ""
          echo "All ECS subnets belong to the expected VPC."
          echo "Network validation successful."
          echo "================================================"


      # ====================================================
      # 16. DEPLOY / UPDATE ECS CLOUDFORMATION STACK
      # ====================================================
      #
      # IMPORTANT:
      #
      # ecs.yaml expects ONE image parameter:
      #
      #   EcrImageUri
      #
      # The complete image URI is produced by the previous
      # image build/push step:
      #
      #   steps.image.outputs.IMAGE_URI
      #
      # Example:
      #
      #   537236558357.dkr.ecr.us-east-1.amazonaws.com/
      #   hybridiaclab-dev-app:abc123
      #
      # This complete URI is passed directly to ecs.yaml.
      #
      # ====================================================

      - name: Deploy or Update ECS
        shell: bash

        env:
          # Complete ECR image URI including GITHUB_SHA tag.
          ECR_IMAGE_URI: ${{ steps.image.outputs.IMAGE_URI }}

          # Network outputs from the previous CloudFormation
          # network lookup step.
          VPC_ID: ${{ steps.network.outputs.VPC_ID }}
          PUBLIC_SUBNET_1_ID: ${{ steps.network.outputs.PUBLIC_SUBNET_1_ID }}
          PUBLIC_SUBNET_2_ID: ${{ steps.network.outputs.PUBLIC_SUBNET_2_ID }}
          PRIVATE_SUBNET_1_ID: ${{ steps.network.outputs.PRIVATE_SUBNET_1_ID }}
          PRIVATE_SUBNET_2_ID: ${{ steps.network.outputs.PRIVATE_SUBNET_2_ID }}

        run: |
          set -euo pipefail

          echo "================================================"
          echo "DEPLOYING ECS CLOUDFORMATION STACK"
          echo "================================================"

          echo "Project:"
          echo "$PROJECT_NAME"

          echo ""
          echo "Environment:"
          echo "$ENVIRONMENT"

          echo ""
          echo "ECS Stack:"
          echo "$ECS_STACK_NAME"

          echo ""
          echo "ECS Template:"
          echo "$ECS_TEMPLATE"

          echo ""
          echo "ECR Image URI:"
          echo "$ECR_IMAGE_URI"

          echo ""
          echo "VPC:"
          echo "$VPC_ID"

          echo ""
          echo "Public Subnet 1:"
          echo "$PUBLIC_SUBNET_1_ID"

          echo ""
          echo "Public Subnet 2:"
          echo "$PUBLIC_SUBNET_2_ID"

          echo ""
          echo "Private Subnet 1:"
          echo "$PRIVATE_SUBNET_1_ID"

          echo ""
          echo "Private Subnet 2:"
          echo "$PRIVATE_SUBNET_2_ID"


          # ------------------------------------------------
          # Deploy or update ECS CloudFormation stack.
          #
          # ecs.yaml expects:
          #
          #   EcrImageUri
          #
          # The value is the COMPLETE Docker image URI:
          #
          #   ECR repository URI + GITHUB_SHA tag
          #
          # This matches:
          #
          #   Parameters:
          #     EcrImageUri:
          #
          # and:
          #
          #   Image:
          #     !Ref EcrImageUri
          #
          # ------------------------------------------------

          aws cloudformation deploy \
            --stack-name "$ECS_STACK_NAME" \
            --template-file "$ECS_TEMPLATE" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              "ProjectName=$PROJECT_NAME" \
              "Environment=$ENVIRONMENT" \
              "VpcId=$VPC_ID" \
              "PublicSubnet1Id=$PUBLIC_SUBNET_1_ID" \
              "PublicSubnet2Id=$PUBLIC_SUBNET_2_ID" \
              "PrivateSubnet1Id=$PRIVATE_SUBNET_1_ID" \
              "PrivateSubnet2Id=$PRIVATE_SUBNET_2_ID" \
              "EcrImageUri=$ECR_IMAGE_URI"

          echo ""
          echo "ECS CloudFormation deployment completed."
          echo "================================================"


      # ====================================================
      # 17. VERIFY ECS CLOUDFORMATION STACK
      # ====================================================

      - name: Verify ECS CloudFormation Stack
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFYING ECS CLOUDFORMATION STACK"
          echo "================================================"


          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$ECS_STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)


          echo "ECS Stack Status:"
          echo "$STACK_STATUS"


          case "$STACK_STATUS" in

            CREATE_COMPLETE)

              echo ""
              echo "ECS stack creation completed successfully."

              ;;


            UPDATE_COMPLETE)

              echo ""
              echo "ECS stack update completed successfully."

              ;;


            *)

              echo ""
              echo "ERROR: ECS stack is not in a successful state."
              echo "Current status: $STACK_STATUS"

              exit 1

              ;;

          esac


          echo ""
          echo "ECS CloudFormation verification successful."
          echo "================================================"


      # ====================================================
      # 18. DEPLOYMENT SUMMARY
      # ====================================================

      - name: Deployment Summary
        shell: bash
        env:

          # ECR repository URI returned directly by AWS.
          ECR_URI: ${{ steps.ecr.outputs.ECR_URI }}

          # Complete immutable image URI:
          # ECR repository URI + GITHUB_SHA.          
          ECR_IMAGE_URI: ${{ steps.image.outputs.IMAGE_URI }}
        run: |
          set -euo pipefail

          echo ""
          echo "================================================"
          echo "HYBRID IaC DEPLOYMENT SUMMARY"
          echo "================================================"

          echo ""
          echo "Project:"
          echo "$PROJECT_NAME"

          echo ""
          echo "Environment:"
          echo "$ENVIRONMENT"

          echo ""
          echo "AWS Account:"
          echo "$AWS_ACCOUNT_ID"

          echo ""
          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""
          echo "Git Commit:"
          echo "$GITHUB_SHA"

          echo ""
          echo "Docker Image Tag:"
          echo "$GITHUB_SHA"

          echo ""
          echo "ECR Repository:"
          echo "$ECR_REPOSITORY_NAME"

          echo ""
          echo "ECR Repository URI:"
          echo "$ECR_URI"

          echo ""
          echo "ECS Image Parameter:"
          echo "EcrImageUri=$ECR_IMAGE_URI"           

          echo ""
          echo "Main CloudFormation Stack:"
          echo "$MAIN_STACK_NAME"

          echo ""
          echo "ECS CloudFormation Stack:"
          echo "$ECS_STACK_NAME"

          echo ""
          echo "ECS Template:"
          echo "$ECS_TEMPLATE"

          echo ""
          echo "Deployment:"
          echo "SUCCESS"

          echo ""
          echo "Docker image was built and pushed to ECR."
          echo "ECS was deployed using:"
          echo "  EcrImageUri=$ECR_IMAGE_URI"

          echo ""
          echo "No 'latest' tag was used."

          echo "================================================"
