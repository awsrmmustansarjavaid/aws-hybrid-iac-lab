# ==========================================================
# HYBRID TERRAFORM + CLOUDFORMATION AWS LAB
# KUBERNETES / AMAZON EKS DEPLOYMENT WORKFLOW
# ==========================================================
#
# File:
#   .github/workflows/kubernetes.yml
#
# Purpose:
#   Deploys Kubernetes application resources INTO the
#   Amazon EKS cluster created by CloudFormation.
#
# ==========================================================
# ARCHITECTURE
# ==========================================================
#
# This workflow assumes the required AWS infrastructure,
# including the EKS cluster, ECR repository, and IAM role,
# already exists before this workflow runs.
#
#
# Terraform
#     |
#     | IAM + supporting infrastructure
#     v
# CloudFormation
#     |
#     | Creates EKS + ECR infrastructure
#     v
# Amazon EKS
#     |
#     | Kubernetes API
#     v
# Kubernetes
#     |
#     +--> Namespace
#     +--> ConfigMap
#     +--> Deployment
#     +--> Service
#
# ECR IMAGE FLOW
# ==========================================================
#
# CloudFormation ECR
#     |
#     | EcrRepositoryUri
#     v
# GitHub Actions
#     |
#     | ECR_IMAGE_URI
#     | ECR_IMAGE_TAG = github.sha
#     v
# ECR_IMAGE_URI:ECR_IMAGE_TAG
#     |
#     v
# Kubernetes Deployment
#     |
#     v
# EKS Pod
#
# Example:
#
#   123456789012.dkr.ecr.us-east-1.amazonaws.com/
#   hybridiaclab-dev-app:abcdef123456
#
# IMPORTANT:
#
# The ECR URI is NOT hardcoded.
#
# The URI is obtained from the CloudFormation output:
#
#   EcrRepositoryUri
#
# created by:
#
#   infrastructure/cloudformation/nested/ecr.yaml
#
# ==========================================================
# IMPORTANT ARCHITECTURE RULE
# ==========================================================
#
# CloudFormation:
#
#   Creates and manages AWS infrastructure.
#
# Kubernetes:
#
#   Creates and manages application resources INSIDE EKS.
#
# Therefore this workflow does NOT create the EKS cluster.
#
# This workflow:
#
#   1. Authenticates to AWS using GitHub OIDC
#   2. Retrieves ECR repository information from CloudFormation
#   3. Verifies the ECR image exists
#   4. Verifies the EKS cluster
#   5. Verifies the EKS node group
#   6. Installs kubectl and envsubst
#   7. Configures kubectl for the EKS cluster
#   8. Verifies Kubernetes connectivity
#   9. Validates required Kubernetes manifests
#  10. Creates/updates Kubernetes resources
#  11. Renders the deployment with the immutable Git SHA image
#  12. Verifies Kubernetes resources and rollout
#
# ==========================================================
# GLOBAL PROJECT CONFIGURATION
# ==========================================================
#
# Project:
#
#   hybridiaclab
#
# Environment:
#
#   dev
#
# EKS Cluster:
#
#   hybridiaclab-dev-EKS
#
# EKS Node Group:
#
#   hybridiaclab-dev-NodeGroup
#
# Kubernetes Namespace:
#
#   hybridiaclab
#
# ECR Repository:
#
#   hybridiaclab-dev-app
#
# Main CloudFormation Stack:
#
#   hybridiaclab-dev-MainStack
#
# ==========================================================

name: Kubernetes Deployment

# ==========================================================
# GLOBAL VARIABLES
# ==========================================================

env:

  # --------------------------------------------------------
  # PROJECT NAME
  # --------------------------------------------------------
  #
  # Project name used by this workflow and the lab naming
  # convention.
  #
  # --------------------------------------------------------

  PROJECT_NAME: "hybridiaclab"

  # --------------------------------------------------------
  # DEPLOYMENT ENVIRONMENT
  # --------------------------------------------------------
  #
  # Current lab environment.
  #
  # --------------------------------------------------------

  ENVIRONMENT: "dev"

  # --------------------------------------------------------
  # AWS REGION
  # --------------------------------------------------------
  #
  # AWS region used by the workflow.
  #
  # This value is currently defined directly in this workflow.
  #
  # Example:
  #
  #   us-east-1
  #
  # --------------------------------------------------------

  AWS_REGION: "us-east-1"

  # --------------------------------------------------------
  # AWS IAM ROLE ARN
  # --------------------------------------------------------
  #
  # GitHub Actions AWS authentication uses GitHub OIDC.
  #
  # AWS_ROLE_ARN is stored as a GitHub Repository/Environment
  # Variable.
  #
  # GitHub Variable:
  #
  #   AWS_ROLE_ARN
  #
  # --------------------------------------------------------

  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

  # --------------------------------------------------------
  # CLOUDFORMATION MAIN STACK
  # --------------------------------------------------------
  #
  # This is the root CloudFormation stack that manages
  # the infrastructure layers for the lab.
  #
  # The workflow reads the ECR repository URI from the
  # CloudFormation output:
  #
  #   EcrRepositoryUri
  #
  # IMPORTANT:
  #
  # main.yaml must expose the nested ECR output at the
  # parent stack level.
  #
  # --------------------------------------------------------

  MAIN_STACK_NAME: "hybridiaclab-dev-MainStack"

  # --------------------------------------------------------
  # EKS CLUSTER NAME
  # --------------------------------------------------------
  #
  # CloudFormation EKS cluster:
  #
  #   hybridiaclab-dev-EKS
  #
  # --------------------------------------------------------

  EKS_CLUSTER_NAME: "hybridiaclab-dev-EKS"

  # --------------------------------------------------------
  # EKS NODE GROUP NAME
  # --------------------------------------------------------
  #
  # CloudFormation managed node group:
  #
  #   hybridiaclab-dev-NodeGroup
  #
  # --------------------------------------------------------

  EKS_NODE_GROUP_NAME: "hybridiaclab-dev-NodeGroup"

  # --------------------------------------------------------
  # KUBERNETES NAMESPACE
  # --------------------------------------------------------
  #
  # All application resources should use this namespace.
  #
  #   hybridiaclab
  #
  # --------------------------------------------------------

  K8S_NAMESPACE: "hybridiaclab"

  # --------------------------------------------------------
  # KUBERNETES MANIFEST DIRECTORY
  # --------------------------------------------------------
  #
  # Location of Kubernetes manifests.
  #
  # --------------------------------------------------------

  K8S_MANIFEST_DIR: "kubernetes"

  # --------------------------------------------------------
  # KUBERNETES NAMESPACE MANIFEST
  # --------------------------------------------------------

  K8S_NAMESPACE_FILE: "kubernetes/namespace.yaml"

  # --------------------------------------------------------
  # KUBERNETES CONFIGMAP MANIFEST
  # --------------------------------------------------------

  K8S_CONFIGMAP_FILE: "kubernetes/configmap.yaml"

  # --------------------------------------------------------
  # KUBERNETES DEPLOYMENT MANIFEST
  # --------------------------------------------------------
  #
  # IMPORTANT:
  #
  # This manifest should contain:
  #
  #   image: ${ECR_FULL_IMAGE}
  #
  # The workflow substitutes the actual ECR URI and
  # immutable Git SHA before sending the manifest to
  # Kubernetes.
  #
  # --------------------------------------------------------

  K8S_DEPLOYMENT_FILE: "kubernetes/deployment.yaml"

  # --------------------------------------------------------
  # KUBERNETES SERVICE MANIFEST
  # --------------------------------------------------------

  K8S_SERVICE_FILE: "kubernetes/service.yaml"

  # --------------------------------------------------------
  # ECR IMAGE TAG
  # --------------------------------------------------------
  #
  # Use the Git commit SHA as an immutable image tag.
  #
  # This MUST match the image tag pushed by the Docker
  # workflow.
  #
  # Example:
  #
  #   abcdef1234567890...
  #
  # We intentionally do NOT use:
  #
  #   latest
  #
  # because immutable SHA tags make deployments predictable.
  #
  # --------------------------------------------------------

  ECR_IMAGE_TAG: "${{ github.sha }}"

  
# ==========================================================
# WORKFLOW TRIGGERS
# ==========================================================

on:

  # --------------------------------------------------------
  # REUSABLE WORKFLOW
  # --------------------------------------------------------
  #
  # Allows another GitHub Actions workflow to call this
  # Kubernetes deployment workflow.
  #
  # --------------------------------------------------------

  workflow_call:

  # --------------------------------------------------------
  # MANUAL EXECUTION
  # --------------------------------------------------------
  #
  # Allows manual execution from GitHub Actions.
  #
  # --------------------------------------------------------

  workflow_dispatch:

# ==========================================================
# GITHUB ACTIONS PERMISSIONS
# ==========================================================
#
# id-token:
#
#   Required for GitHub OIDC authentication to AWS.
#
# contents:
#
#   Required by actions/checkout.
#
# ==========================================================

permissions:
  id-token: write
  contents: read

# ==========================================================
# JOBS
# ==========================================================

jobs:

  # ========================================================
  # KUBERNETES DEPLOYMENT JOB
  # ========================================================

  kubernetes:

    name: Deploy Application to Amazon EKS

    runs-on: ubuntu-latest

    # ======================================================
    # JOB STEPS
    # ======================================================

    steps:

      # ----------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ----------------------------------------------------
      #
      # Downloads the repository so the Kubernetes manifests
      # are available to the workflow.
      #
      # ----------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 2. CONFIGURE AWS CREDENTIALS
      # ----------------------------------------------------
      #
      # GitHub Actions authenticates to AWS using GitHub OIDC.
      #
      # No long-lived AWS access keys are required.
      #
      # AWS_ROLE_ARN:
      #
      #   IAM role trusted by the GitHub OIDC provider.
      #
      # ----------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1

        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}

      # ----------------------------------------------------
      # 3. VERIFY AWS IDENTITY
      # ----------------------------------------------------
      #
      # Confirms which AWS IAM role GitHub Actions is using.
      #
      # This is useful when troubleshooting OIDC/IAM issues.
      #
      # ----------------------------------------------------

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------------------
      # 4. GET ECR REPOSITORY URI FROM CLOUDFORMATION
      # ----------------------------------------------------
      #
      # IMPORTANT:
      #
      # ecr.yaml exposes:
      #
      #   EcrRepositoryUri
      #
      # The URI is generated by AWS and must NOT be manually
      # constructed from:
      #
      #   account ID
      #   region
      #   repository name
      #
      # The retrieved value is written to GITHUB_ENV so that
      # subsequent workflow steps can use:
      #
      #   ECR_IMAGE_URI
      #
      # ----------------------------------------------------

      - name: Get ECR Repository Information
        shell: bash
        run: |

          echo "=================================================="
          echo "GET ECR REPOSITORY INFORMATION"
          echo "=================================================="

          # ------------------------------------------------
          # Get ECR Repository URI from the MainStack.
          #
          # main.yaml exposes this value from the ECR
          # nested stack:
          #
          #   EcrRepositoryUri
          #
          # Example:
          #
          #   123456789012.dkr.ecr.us-east-1.amazonaws.com/
          #   hybridiaclab-dev-app
          # ------------------------------------------------

          ECR_REPOSITORY_URI=$(aws cloudformation describe-stacks \
            --stack-name "${MAIN_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryUri'].OutputValue" \
            --output text)

          # ------------------------------------------------
          # Get ECR Repository Name from the MainStack.
          #
          # main.yaml exposes this value from the ECR
          # nested stack:
          #
          #   EcrRepositoryName
          #
          # This avoids hardcoding:
          #
          #   hybridiaclab-dev-app
          # ------------------------------------------------

          ECR_REPOSITORY_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${MAIN_STACK_NAME}" \
            --region "${AWS_REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='EcrRepositoryName'].OutputValue" \
            --output text)

          # ------------------------------------------------
          # Validate ECR Repository URI.
          # ------------------------------------------------

          if [ -z "$ECR_REPOSITORY_URI" ] || [ "$ECR_REPOSITORY_URI" = "None" ]; then
            echo "ERROR: EcrRepositoryUri was not found."
            exit 1
          fi

          # ------------------------------------------------
          # Validate ECR Repository Name.
          # ------------------------------------------------

          if [ -z "$ECR_REPOSITORY_NAME" ] || [ "$ECR_REPOSITORY_NAME" = "None" ]; then
            echo "ERROR: EcrRepositoryName was not found."
            exit 1
          fi

          # ------------------------------------------------
          # Export values for later GitHub Actions steps.
          # ------------------------------------------------

          echo "ECR_IMAGE_URI=$ECR_REPOSITORY_URI" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY_NAME=$ECR_REPOSITORY_NAME" >> "$GITHUB_ENV"

          # ------------------------------------------------
          # Build the complete immutable image reference.
          #
          # Format:
          #
          #   ECR URI : Git SHA
          #
          # Example:
          #
          #   hybridiaclab-dev-app:abcdef123456
          # ------------------------------------------------

          ECR_FULL_IMAGE="${ECR_REPOSITORY_URI}:${ECR_IMAGE_TAG}"

          echo "ECR_FULL_IMAGE=$ECR_FULL_IMAGE" >> "$GITHUB_ENV"

          echo ""
          echo "ECR Repository Name:"
          echo "${ECR_REPOSITORY_NAME}"

          echo ""
          echo "ECR Repository URI:"
          echo "${ECR_REPOSITORY_URI}"

          echo ""
          echo "ECR Image Tag:"
          echo "${ECR_IMAGE_TAG}"

          echo ""
          echo "Full ECR Image:"
          echo "${ECR_FULL_IMAGE}"

      # ----------------------------------------------------
      # 5. VERIFY ECR IMAGE EXISTS
      # ----------------------------------------------------
      #
      # The Docker workflow should push the image before this
      # Kubernetes workflow deploys it.
      #
      # Because the image uses github.sha as its tag, this
      # step verifies that the exact image for this commit
      # exists in ECR.
      #
      # ----------------------------------------------------

      - name: Verify ECR Image
        shell: bash
        run: |

          set -euo pipefail

          echo "=================================================="
          echo "VERIFY ECR IMAGE"
          echo "=================================================="

          echo "Repository:"
          echo "${ECR_REPOSITORY_NAME}"

          echo ""
          echo "Image tag:"
          echo "${ECR_IMAGE_TAG}"

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY_NAME}" \
            --image-ids imageTag="${ECR_IMAGE_TAG}" \
            --region "${AWS_REGION}" \
            --query "imageDetails[0].{ImageDigest:imageDigest,Tags:imageTags}" \
            --output table

      # ----------------------------------------------------
      # 6. VERIFY EKS CLUSTER
      # ----------------------------------------------------
      #
      # Confirms that the EKS cluster created by CloudFormation
      # exists and is available.
      #
      # ----------------------------------------------------

      - name: Verify EKS Cluster
        shell: bash
        run: |

          echo "=================================================="
          echo "VERIFY EKS CLUSTER"
          echo "=================================================="

          EKS_STATUS=$(aws eks describe-cluster \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --query "cluster.status" \
            --output text)

          EKS_VERSION=$(aws eks describe-cluster \
            --name "${EKS_CLUSTER_NAME}" \
            --region "${AWS_REGION}" \
            --query "cluster.version" \
            --output text)

          echo "EKS Cluster: ${EKS_CLUSTER_NAME}"
          echo "EKS Status:  ${EKS_STATUS}"
          echo "EKS Version: ${EKS_VERSION}"

          if [ "${EKS_STATUS}" != "ACTIVE" ]; then
            echo "ERROR: EKS cluster is not ACTIVE."
            exit 1
          fi

          echo "EKS cluster is ACTIVE."

      # ----------------------------------------------------
      # 7. VERIFY EKS NODE GROUP
      # ----------------------------------------------------
      #
      # Confirms that the managed node group created by
      # CloudFormation is ACTIVE.
      #
      # ----------------------------------------------------

      - name: Verify EKS Node Group
        shell: bash
        run: |

          echo "=================================================="
          echo "VERIFY EKS NODE GROUP"
          echo "=================================================="

          NODEGROUP_STATUS=$(aws eks describe-nodegroup \
            --cluster-name "${EKS_CLUSTER_NAME}" \
            --nodegroup-name "${EKS_NODE_GROUP_NAME}" \
            --region "${AWS_REGION}" \
            --query "nodegroup.status" \
            --output text)

          echo "EKS Node Group: ${EKS_NODE_GROUP_NAME}"
          echo "Node Group Status: ${NODEGROUP_STATUS}"

          if [ "${NODEGROUP_STATUS}" != "ACTIVE" ]; then
            echo "ERROR: EKS node group is not ACTIVE."
            exit 1
          fi

          echo "EKS node group is ACTIVE."

      # ----------------------------------------------------
      # 8. INSTALL KUBECTL
      # ----------------------------------------------------
      #
      # Install a pinned kubectl version instead of "latest".
      #
      # The version should be selected to be compatible with
      # the EKS Kubernetes version used by this lab.
      #
      # ----------------------------------------------------

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

        with:
          version: '1.33.0'

      # ----------------------------------------------------
      # 9. INSTALL ENVSUBST
      # ----------------------------------------------------
      #
      # envsubst is provided by gettext-base.
      #
      # It replaces ${ECR_FULL_IMAGE} in deployment.yaml
      # before the manifest is sent to Kubernetes.
      #
      # ----------------------------------------------------

      - name: Install envsubst
        shell: bash
        run: |

          echo "=================================================="
          echo "VERIFY ENVSUBST"
          echo "=================================================="

          if ! command -v envsubst >/dev/null 2>&1; then
            echo "envsubst not found. Installing gettext-base..."

            sudo apt-get update
            sudo apt-get install -y gettext-base
          fi

          echo "envsubst is available."

          envsubst --version    

      # ----------------------------------------------------
      # 10. CONFIGURE KUBECTL FOR EKS
      # ----------------------------------------------------
      #
      # Creates/updates kubeconfig for the EKS cluster.
      #
      # ----------------------------------------------------

      - name: Configure kubectl
        run: |

          echo "=================================================="
          echo "CONFIGURE KUBECTL"
          echo "=================================================="

          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      # ----------------------------------------------------
      # 11. VERIFY KUBERNETES CONNECTION
      # ----------------------------------------------------
      #
      # Confirms that GitHub Actions can communicate with
      # the Kubernetes API.
      #
      # ----------------------------------------------------

      - name: Verify Kubernetes Connection
        shell: bash
        run: |

          echo "=================================================="
          echo "VERIFY KUBERNETES CONNECTION"
          echo "=================================================="

          kubectl config current-context

          echo ""
          echo "Waiting for Kubernetes nodes to become Ready..."

          for attempt in {1..30}; do

            if kubectl get nodes --no-headers 2>/dev/null | grep -q " Ready "; then

              echo ""
              echo "At least one Kubernetes node is Ready."

              echo ""
              echo "Kubernetes Nodes:"
              kubectl get nodes -o wide

              exit 0

            fi

            echo "Nodes are not Ready yet."
            echo "Attempt ${attempt}/30"
            echo "Waiting 10 seconds..."

            sleep 10

          done

          echo ""
          echo "ERROR: Kubernetes nodes did not become Ready."

          kubectl get nodes -o wide || true

          exit 1

      # ----------------------------------------------------
      # 12. VALIDATE KUBERNETES MANIFESTS
      # ----------------------------------------------------
      #
      # Confirms that all required Kubernetes manifest files
      # exist before deployment starts.
      #
      # K8S_MANIFEST_DIR is used here as the common source
      # directory for the Kubernetes manifests.
      #
      # ----------------------------------------------------

      - name: Validate Kubernetes Manifests
        shell: bash
        run: |

          echo "=================================================="
          echo "VALIDATE KUBERNETES MANIFESTS"
          echo "=================================================="

          echo "Manifest directory:"
          echo "${K8S_MANIFEST_DIR}"

          echo ""

          # ------------------------------------------------
          # Verify Kubernetes manifest files exist.
          # ------------------------------------------------

          test -f "${K8S_MANIFEST_DIR}/namespace.yaml"
          test -f "${K8S_MANIFEST_DIR}/configmap.yaml"
          test -f "${K8S_MANIFEST_DIR}/deployment.yaml"
          test -f "${K8S_MANIFEST_DIR}/service.yaml"

          echo "All Kubernetes manifests were found."

      # ----------------------------------------------------
      # 13. CREATE / UPDATE NAMESPACE
      # ----------------------------------------------------
      #
      # Creates the application namespace if it does not
      # already exist.
      #
      # Expected namespace:
      #
      #   hybridiaclab
      #
      # ----------------------------------------------------

      - name: Deploy Namespace
        run: |

          echo "=================================================="
          echo "DEPLOY NAMESPACE"
          echo "=================================================="

          kubectl apply \
            -f "${K8S_NAMESPACE_FILE}"

      # ----------------------------------------------------
      # 14. DEPLOY CONFIGMAP
      # ----------------------------------------------------
      #
      # Creates/updates application configuration.
      #
      # ----------------------------------------------------

      - name: Deploy ConfigMap
        run: |

          echo "=================================================="
          echo "DEPLOY CONFIGMAP"
          echo "=================================================="

          kubectl apply \
            -f "${K8S_CONFIGMAP_FILE}"

      # ----------------------------------------------------
      # 15. DEPLOY APPLICATION
      # ----------------------------------------------------
      #
      # IMPORTANT:
      #
      # deployment.yaml should contain:
      #
      #   image: ${ECR_FULL_IMAGE}
      #
      # The workflow substitutes:
      #
      #   ${ECR_FULL_IMAGE}
      #
      # with:
      #
      #   ECR_IMAGE_URI:ECR_IMAGE_TAG
      #
      # before Kubernetes receives the manifest.
      #
      # This keeps the actual AWS ECR URI OUT of the
      # Kubernetes manifest.
      #
      # ----------------------------------------------------

      - name: Deploy Application
        shell: bash
        run: |

          echo "=================================================="
          echo "DEPLOY APPLICATION"
          echo "=================================================="

          echo "ECR Image:"
          echo "${ECR_FULL_IMAGE}"

          echo ""
          echo "Kubernetes Namespace:"
          echo "${K8S_NAMESPACE}"

          # ------------------------------------------------
          # Render deployment.yaml using the immutable
          # ECR image URI and Git SHA.
          # ------------------------------------------------

          envsubst '${ECR_FULL_IMAGE}' \
            < "${K8S_DEPLOYMENT_FILE}" \
            > /tmp/deployment-rendered.yaml

          echo ""
          echo "Rendered Kubernetes Deployment:"
          cat /tmp/deployment-rendered.yaml

          echo ""
          echo "Validating Kubernetes manifest..."

          kubectl apply \
            --dry-run=server \
            -f /tmp/deployment-rendered.yaml

          echo ""
          echo "Applying Kubernetes Deployment..."

          kubectl apply \
            -f /tmp/deployment-rendered.yaml

      # ----------------------------------------------------
      # 16. DEPLOY SERVICE
      # ----------------------------------------------------
      #
      # Creates/updates the Kubernetes Service.
      #
      # ----------------------------------------------------

      - name: Deploy Service
        run: |

          echo "=================================================="
          echo "DEPLOY SERVICE"
          echo "=================================================="

          kubectl apply \
            -f "${K8S_SERVICE_FILE}"

      # ----------------------------------------------------
      # 17. VERIFY KUBERNETES SERVICE
      # ----------------------------------------------------
      #
      # Confirms that the Kubernetes Service was successfully
      # created/updated in the application namespace.
      #
      # ----------------------------------------------------

      - name: Verify Kubernetes Service
        shell: bash
        run: |

          echo "=================================================="
          echo "VERIFY KUBERNETES SERVICE"
          echo "=================================================="

          echo "Kubernetes Namespace:"
          echo "${K8S_NAMESPACE}"

          echo ""
          echo "Kubernetes Services:"
          kubectl get services \
            -n "${K8S_NAMESPACE}" \
            -o wide

          echo ""
          echo "Service Details:"
          kubectl describe services \
            -n "${K8S_NAMESPACE}"

          echo ""
          echo "Kubernetes Service verification completed."
      
      # ----------------------------------------------------
      # 18. VERIFY DEPLOYMENT
      # ----------------------------------------------------
      #
      # Displays the deployed Kubernetes resources.
      #
      # ----------------------------------------------------

      - name: Verify Kubernetes Resources
        run: |

          echo "=================================================="
          echo "PROJECT"
          echo "=================================================="

          echo "Project: ${PROJECT_NAME}"
          echo "Environment: ${ENVIRONMENT}"
          echo "AWS Region: ${AWS_REGION}"

          echo ""
          echo "=================================================="
          echo "ECR"
          echo "=================================================="

          echo "Repository: ${ECR_REPOSITORY_NAME}"
          echo "Repository URI: ${ECR_IMAGE_URI}"
          echo "Image Tag: ${ECR_IMAGE_TAG}"
          echo "Full Image: ${ECR_FULL_IMAGE}"

          echo ""
          echo "=================================================="
          echo "EKS"
          echo "=================================================="

          echo "EKS Cluster: ${EKS_CLUSTER_NAME}"
          echo "EKS Node Group: ${EKS_NODE_GROUP_NAME}"

          echo ""
          echo "=================================================="
          echo "KUBERNETES"
          echo "=================================================="

          echo "Namespace: ${K8S_NAMESPACE}"

          echo ""
          echo "=================================================="
          echo "NAMESPACES"
          echo "=================================================="

          kubectl get namespaces

          echo ""
          echo "=================================================="
          echo "DEPLOYMENTS"
          echo "=================================================="

          kubectl get deployments \
            -n "${K8S_NAMESPACE}"

          echo ""
          echo "=================================================="
          echo "PODS"
          echo "=================================================="

          kubectl get pods \
            -n "${K8S_NAMESPACE}" \
            -o wide

          echo ""
          echo "=================================================="
          echo "SERVICES"
          echo "=================================================="

          kubectl get services \
            -n "${K8S_NAMESPACE}"

      # ----------------------------------------------------
      # 19. VERIFY ROLLOUT
      # ----------------------------------------------------
      #
      # Waits for the Kubernetes Deployment to complete its
      # rollout.
      #
      # IMPORTANT:
      #
      # The Deployment name is discovered from the namespace
      # so this workflow does not hardcode an application
      # Deployment name.
      #
      # ----------------------------------------------------

      - name: Verify Deployment Rollout
        shell: bash
        run: |

          echo "=================================================="
          echo "VERIFY DEPLOYMENT ROLLOUT"
          echo "=================================================="

          DEPLOYMENT_COUNT=$(kubectl get deployments \
            -n "${K8S_NAMESPACE}" \
            --no-headers 2>/dev/null | wc -l)

          if [ "${DEPLOYMENT_COUNT}" -eq 0 ]; then
            echo "ERROR: No Kubernetes Deployment found."
            exit 1
          fi

          echo "Deployment(s) found:"
          kubectl get deployments \
            -n "${K8S_NAMESPACE}"

          echo ""
          echo "Waiting for rollout..."

          while read -r DEPLOYMENT_NAME; do

            if [ -n "${DEPLOYMENT_NAME}" ]; then

              echo ""
              echo "Checking deployment:"
              echo "${DEPLOYMENT_NAME}"

              kubectl rollout status \
                deployment/"${DEPLOYMENT_NAME}" \
                -n "${K8S_NAMESPACE}" \
                --timeout=180s

            fi

          done < <(
            kubectl get deployments \
              -n "${K8S_NAMESPACE}" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
          )

          echo ""
          echo "=================================================="
          echo "ROLLOUT SUCCESSFUL"
          echo "=================================================="

          echo "Application image:"
          echo "${ECR_FULL_IMAGE}"

