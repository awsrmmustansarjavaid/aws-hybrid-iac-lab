# ============================================================
# GitHub Actions - Terraform Infrastructure Deployment
#
# Project:
#   aws-hybrid-iac-lab
#
# File:
#   .github/workflows/main-deploy.yaml
#
# Purpose:
#   1. Authenticate GitHub Actions to AWS using OIDC.
#   2. Verify AWS identity.
#   3. Bootstrap/verify Terraform state bucket.
#   4. Install Terraform.
#   5. Initialize Terraform using S3 backend.
#   6. Check Terraform formatting.
#   7. Validate Terraform configuration.
#   8. Display Terraform state information.
#   9. Generate Terraform plan.
#   10. Apply the exact generated plan.
#
#
# ============================================================
# AWS AUTHENTICATION ARCHITECTURE
# ============================================================
#
#   GitHub Actions
#        |
#        | GitHub OIDC token
#        v
#   token.actions.githubusercontent.com
#        |
#        | sts:AssumeRoleWithWebIdentity
#        v
#   IAM Role
#   aws-hybrid-iac-lab-GitHubActions
#        |
#        | Temporary AWS credentials
#        v
#   AWS Services
#
#
# IMPORTANT:
#
# This workflow does NOT use:
#
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# GitHub obtains temporary AWS credentials through OIDC.
#
# ============================================================


# ============================================================
# WORKFLOW NAME
# ============================================================

name: Terraform Infrastructure


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================
#
# workflow_dispatch:
#   Allows manual execution from GitHub Actions.
#
# workflow_call:
#   Allows another workflow to call this workflow.
#
# push:
#   Currently disabled intentionally.
#
# If you later want automatic deployment whenever main changes,
# you can add:
#
#   push:
#     branches:
#       - main
#
# ============================================================

on:

  # ----------------------------------------------------------
  # Manual workflow execution
  # ----------------------------------------------------------

  workflow_dispatch:


  # ----------------------------------------------------------
  # Allows another workflow to call this workflow.
  # ----------------------------------------------------------

  workflow_call:


# ============================================================
# GLOBAL WORKFLOW ENVIRONMENT VARIABLES
# ============================================================
#
# These are workflow-level/global variables.
#
# They are NOT:
#
#   GitHub Repository Variables
#   GitHub Repository Secrets
#
# They are defined directly inside this workflow.
#
#
# AWS_REGION
#   AWS deployment region.
#
# AWS_ROLE_ARN
#   IAM role that GitHub Actions assumes using OIDC.
#
# IMPORTANT:
#
# An IAM Role ARN is NOT a credential or password.
#
# Therefore it does not need to be stored as a GitHub Secret.
#
# ============================================================

env:

  # ----------------------------------------------------------
  # Global AWS Region
  # ----------------------------------------------------------

  AWS_REGION: us-east-1


  # ----------------------------------------------------------
  # Global GitHub Actions IAM Role ARN
  # ----------------------------------------------------------
  #
  # This role must have a trust relationship allowing:
  #
  #   token.actions.githubusercontent.com
  #
  # to perform:
  #
  #   sts:AssumeRoleWithWebIdentity
  #
  # ----------------------------------------------------------

  AWS_ROLE_ARN: arn:aws:iam::537236558357:role/aws-hybrid-iac-lab-GitHubActions


# ============================================================
# CONCURRENCY PROTECTION
# ============================================================
#
# Prevent multiple Terraform deployments from modifying the
# same Terraform state simultaneously.
#
# ============================================================

concurrency:

  group: terraform-${{ github.ref }}

  cancel-in-progress: false


# ============================================================
# GITHUB TOKEN PERMISSIONS
# ============================================================
#
# id-token: write
#
# REQUIRED for GitHub OIDC.
#
# Without this permission GitHub cannot request an OIDC token.
#
#
# contents: read
#
# REQUIRED by actions/checkout.
#
# ============================================================

permissions:

  id-token: write

  contents: read


# ============================================================
# TERRAFORM DEPLOYMENT JOB
# ============================================================

jobs:

  terraform:

    name: Terraform Infrastructure Deployment

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # STEP 1 - CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ======================================================
      # STEP 2 - DISPLAY OIDC CONFIGURATION
      # ======================================================
      #
      # This step does NOT authenticate to AWS.
      #
      # It only displays the configuration that will be used.
      #
      # The IAM Role ARN is safe to display.
      #
      # ======================================================

      - name: Display AWS Deployment Configuration

        shell: bash

        run: |

          set -euo pipefail

          echo "=============================================="
          echo "AWS Deployment Configuration"
          echo "=============================================="

          echo ""

          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo ""

          echo "AWS IAM Role:"
          echo "${AWS_ROLE_ARN}"

          echo ""

          echo "GitHub Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""

          echo "GitHub Ref:"
          echo "${GITHUB_REF}"

          echo ""

          echo "GitHub Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""

          echo "=============================================="
          echo "Configuration Display Completed"
          echo "=============================================="


      # ======================================================
      # STEP 3 - CONFIGURE AWS CREDENTIALS USING OIDC
      # ======================================================
      #
      # IMPORTANT:
      #
      # No AWS access key is used here.
      #
      # GitHub:
      #
      #   1. Requests an OIDC token.
      #
      #   2. Sends the token to AWS STS.
      #
      #   3. AWS validates:
      #
      #        OIDC Provider
      #        IAM Role Trust Policy
      #        aud claim
      #        sub claim
      #
      #   4. AWS returns temporary credentials.
      #
      # ======================================================

      - name: Configure AWS Credentials Using OIDC

        uses: aws-actions/configure-aws-credentials@v6

        with:

          # --------------------------------------------------
          # AWS deployment region.
          #
          # Uses workflow-level global environment variable.
          # --------------------------------------------------

          aws-region: ${{ env.AWS_REGION }}


          # --------------------------------------------------
          # IAM role to assume.
          #
          # Uses workflow-level global environment variable.
          #
          # --------------------------------------------------

          role-to-assume: ${{ env.AWS_ROLE_ARN }}


          # --------------------------------------------------
          # Recognizable STS session name.
          # --------------------------------------------------

          role-session-name: GitHubActions-Terraform


      # ======================================================
      # STEP 4 - VERIFY AWS IDENTITY
      # ======================================================
      #
      # This step proves whether OIDC authentication succeeded.
      #
      # If Step 3 fails:
      #
      #   Terraform has NOT started.
      #
      # If Step 3 succeeds:
      #
      #   GitHub has temporary AWS credentials.
      #
      # ======================================================

      - name: Verify AWS Identity

        shell: bash

        run: |

          set -euo pipefail

          echo "=============================================="
          echo "AWS STS Identity"
          echo "=============================================="

          aws sts get-caller-identity

          echo ""

          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo ""

          echo "AWS OIDC authentication succeeded."


      # ======================================================
      # STEP 5 - BOOTSTRAP TERRAFORM STATE BUCKET
      # ======================================================
      #
      # Terraform's S3 backend bucket must exist before:
      #
      #   terraform init
      #
      # This step:
      #
      #   - Checks the bucket.
      #   - Creates it if missing.
      #   - Enables versioning.
      #   - Enables encryption.
      #   - Blocks public access.
      #   - Applies tags.
      #   - Verifies configuration.
      #
      # ======================================================

      - name: Bootstrap Terraform State Bucket

        shell: bash

        env:

          # --------------------------------------------------
          # Terraform state bucket.
          #
          # This is intentionally separate from the
          # CloudFormation template S3 bucket.
          # --------------------------------------------------

          TF_STATE_BUCKET: aws-hybrid-iac-lab-terraform-state-537236558357

          # --------------------------------------------------
          # Reuse global AWS region.
          # --------------------------------------------------

          TF_STATE_REGION: ${{ env.AWS_REGION }}

        run: |

          set -euo pipefail

          echo "=============================================="
          echo "Terraform State Backend Bootstrap"
          echo "=============================================="

          echo ""

          echo "State bucket:"
          echo "${TF_STATE_BUCKET}"

          echo ""

          echo "AWS region:"
          echo "${TF_STATE_REGION}"

          echo ""

          echo "Checking Terraform state bucket..."


          # --------------------------------------------------
          # Check whether the bucket already exists.
          # --------------------------------------------------

          if aws s3api head-bucket \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            2>/dev/null
          then

            echo "Terraform state bucket already exists."

          else

            echo "Terraform state bucket does not exist."

            echo "Creating Terraform state bucket..."


            # ------------------------------------------------
            # us-east-1 does not use LocationConstraint.
            # ------------------------------------------------

            if [ "${TF_STATE_REGION}" = "us-east-1" ]; then

              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${TF_STATE_REGION}"

            else

              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${TF_STATE_REGION}" \
                --create-bucket-configuration \
                  LocationConstraint="${TF_STATE_REGION}"

            fi

            echo "Terraform state bucket created."

          fi


          # --------------------------------------------------
          # Enable S3 versioning.
          # --------------------------------------------------

          echo ""

          echo "Enabling S3 versioning..."

          aws s3api put-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --versioning-configuration Status=Enabled


          # --------------------------------------------------
          # Enable SSE-S3 encryption.
          # --------------------------------------------------

          echo ""

          echo "Enabling S3 encryption..."

          aws s3api put-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --server-side-encryption-configuration \
            '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }
              ]
            }'


          # --------------------------------------------------
          # Block public access.
          # --------------------------------------------------

          echo ""

          echo "Blocking public access..."

          aws s3api put-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true


          # --------------------------------------------------
          # Apply bucket tags.
          # --------------------------------------------------

          echo ""

          echo "Applying bucket tags..."

          aws s3api put-bucket-tagging \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --tagging '{
              "TagSet": [
                {
                  "Key": "Name",
                  "Value": "aws-hybrid-iac-lab-terraform-state"
                },
                {
                  "Key": "Project",
                  "Value": "aws-hybrid-iac-lab"
                },
                {
                  "Key": "ManagedBy",
                  "Value": "GitHub-Actions-Bootstrap"
                },
                {
                  "Key": "Purpose",
                  "Value": "Terraform-State"
                },
                {
                  "Key": "Environment",
                  "Value": "dev"
                }
              ]
            }'


          # --------------------------------------------------
          # Verify bucket.
          # --------------------------------------------------

          echo ""

          echo "=============================================="
          echo "Terraform State Bucket Verification"
          echo "=============================================="


          echo ""

          echo "Bucket:"

          aws s3api head-bucket \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""

          echo "Versioning:"

          aws s3api get-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""

          echo "Encryption:"

          aws s3api get-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""

          echo "Public Access Block:"

          aws s3api get-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""

          echo "Terraform state backend bootstrap completed."


      # ======================================================
      # STEP 6 - INSTALL TERRAFORM
      # ======================================================

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3


      # ======================================================
      # STEP 7 - TERRAFORM INIT
      # ======================================================
      #
      # IMPORTANT:
      #
      # Terraform configuration is located at:
      #
      #   infrastructure/terraform
      #
      # Therefore the working-directory is explicitly set.
      #
      # ======================================================

      - name: Terraform Init

        working-directory: infrastructure/terraform

        run: |

          terraform init \
            -input=false


      # ======================================================
      # STEP 8 - TERRAFORM FORMAT CHECK
      # ======================================================

      - name: Terraform Format Check

        working-directory: infrastructure/terraform

        run: |

          terraform fmt \
            -check \
            -recursive


      # ======================================================
      # STEP 9 - TERRAFORM VALIDATE
      # ======================================================

      - name: Terraform Validate

        working-directory: infrastructure/terraform

        run: |

          terraform validate


      # ======================================================
      # STEP 10 - TERRAFORM STATE INFORMATION
      # ======================================================

      - name: Terraform State Information

        working-directory: infrastructure/terraform

        run: |

          echo "=============================================="
          echo "Terraform State"
          echo "=============================================="

          terraform state list || true


      # ======================================================
      # STEP 11 - TERRAFORM PLAN
      # ======================================================
      #
      # The generated plan is saved as:
      #
      #   tfplan
      #
      # The exact same plan is applied in Step 12.
      #
      # ======================================================

      - name: Terraform Plan

        working-directory: infrastructure/terraform

        run: |

          terraform plan \
            -input=false \
            -out=tfplan


      # ======================================================
      # STEP 12 - TERRAFORM APPLY
      # ======================================================
      #
      # Applies the exact plan generated in Step 11.
      #
      # ======================================================

      - name: Terraform Apply

        working-directory: infrastructure/terraform

        run: |

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

