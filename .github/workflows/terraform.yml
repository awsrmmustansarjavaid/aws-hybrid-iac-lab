# ============================================================
# GitHub Actions - Terraform Infrastructure Deployment
#
# Project:
#   aws-hybrid-iac-lab
#
# File:
#   .github/workflows/main-deploy.yaml
#
# Purpose:
#   1. Authenticate GitHub Actions to AWS using OIDC.
#   2. Verify the AWS identity.
#   3. Bootstrap/verify the Terraform state bucket.
#   4. Initialize Terraform using the S3 backend.
#   5. Format-check Terraform.
#   6. Validate Terraform.
#   7. Generate a Terraform plan.
#   8. Apply the exact generated plan.
#
#
# AWS AUTHENTICATION ARCHITECTURE
# ------------------------------------------------------------
#
#   GitHub Actions
#        |
#        | OIDC token
#        v
#   GitHub OIDC Provider
#        |
#        | sts:AssumeRoleWithWebIdentity
#        v
#   aws-hybrid-iac-lab-GitHubActions
#        |
#        | temporary AWS credentials
#        v
#   AWS
#
#
# IMPORTANT:
# ------------------------------------------------------------
# No AWS access key or secret access key is required.
#
# GitHub receives temporary AWS credentials through STS.
#
# ============================================================


# ============================================================
# Workflow Name
# ============================================================

name: Terraform Infrastructure


# ============================================================
# Workflow Triggers
# ============================================================
#
# workflow_dispatch:
#   Allows manual execution.
#
# workflow_call:
#   Allows another workflow to call this workflow.
#
# push:
#   Uncomment if you want automatic deployment whenever main
#   changes.
#
# ============================================================

on:

  workflow_dispatch:

  workflow_call:


# ============================================================
# Concurrency Protection
# ============================================================
#
# Prevent multiple Terraform deployments from modifying the
# same remote state simultaneously.
#
# ============================================================

concurrency:

  group: terraform-${{ github.ref }}

  cancel-in-progress: false


# ============================================================
# GitHub Token Permissions
# ============================================================
#
# id-token: write
#   REQUIRED for GitHub OIDC authentication.
#
# contents: read
#   REQUIRED by actions/checkout.
#
# ============================================================

permissions:

  id-token: write

  contents: read


# ============================================================
# Terraform Deployment Job
# ============================================================

jobs:

  terraform:

    name: Terraform Infrastructure Deployment

    runs-on: ubuntu-latest


    steps:

      # ======================================================
      # Step 1 - Checkout Repository
      # ======================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ======================================================
      # Step 2 - Configure AWS Credentials Using OIDC
      # ======================================================
      #
      # IMPORTANT:
      #
      # This step does NOT use:
      #
      #   AWS_ACCESS_KEY_ID
      #   AWS_SECRET_ACCESS_KEY
      #
      # Instead:
      #
      #   GitHub OIDC
      #       ↓
      #   AWS STS
      #       ↓
      #   Temporary credentials
      #
      # ======================================================

      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v6

        with:

          # --------------------------------------------------
          # AWS region
          #
          # Repository variable:
          #
          # Settings
          #   → Secrets and variables
          #   → Actions
          #   → Variables
          #
          # Variable:
          #
          #   AWS_REGION
          # --------------------------------------------------

          aws-region: ${{ vars.AWS_REGION }}


          # --------------------------------------------------
          # IAM role assumed through GitHub OIDC.
          #
          # Recommended repository variable:
          #
          #   AWS_ROLE_ARN
          #
          # Example:
          #
          #   arn:aws:iam::537236558357:role/
          #   awshybrid...-GitHubActions
          #
          # --------------------------------------------------

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}


          # --------------------------------------------------
          # Give the session a recognizable name.
          # --------------------------------------------------

          role-session-name: GitHubActions-Terraform


      # ======================================================
      # Step 3 - Verify AWS Identity
      # ======================================================
      #
      # This is an important diagnostic step.
      #
      # If this step fails:
      #
      #   Terraform has NOT started yet.
      #
      # The problem is authentication/OIDC/IAM.
      #
      # If this step succeeds:
      #
      #   OIDC authentication is working.
      #
      # ======================================================

      - name: Verify AWS Identity

        shell: bash

        run: |

          set -euo pipefail

          echo "=============================================="
          echo "AWS Identity"
          echo "=============================================="

          aws sts get-caller-identity

          echo ""

          echo "AWS Region:"

          echo "${AWS_REGION}"


      # ======================================================
      # Step 4 - Bootstrap Terraform State Bucket
      # ======================================================
      #
      # Terraform cannot initialize an S3 backend if the
      # backend bucket does not already exist.
      #
      # Therefore this workflow verifies/creates the bucket
      # before terraform init.
      #
      # ======================================================

      - name: Bootstrap Terraform State Bucket

        shell: bash

        env:

          TF_STATE_BUCKET: aws-hybrid-iac-lab-terraform-state-537236558357

          TF_STATE_REGION: ${{ vars.AWS_REGION }}

        run: |

          set -euo pipefail

          echo "=============================================="
          echo "Terraform State Backend Bootstrap"
          echo "=============================================="

          echo "State bucket:"
          echo "${TF_STATE_BUCKET}"

          echo ""

          echo "AWS region:"
          echo "${TF_STATE_REGION}"

          echo ""

          echo "Checking Terraform state bucket..."


          # --------------------------------------------------
          # Check whether bucket already exists.
          # --------------------------------------------------

          if aws s3api head-bucket \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            2>/dev/null
          then

            echo "Terraform state bucket already exists."

          else

            echo "Terraform state bucket does not exist."

            echo "Creating bucket..."


            # ------------------------------------------------
            # us-east-1 does not use LocationConstraint.
            # ------------------------------------------------

            if [ "${TF_STATE_REGION}" = "us-east-1" ]; then

              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${TF_STATE_REGION}"

            else

              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${TF_STATE_REGION}" \
                --create-bucket-configuration \
                  LocationConstraint="${TF_STATE_REGION}"

            fi

            echo "Terraform state bucket created."

          fi


          # --------------------------------------------------
          # Enable versioning.
          # --------------------------------------------------

          echo ""

          echo "Enabling S3 versioning..."

          aws s3api put-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --versioning-configuration Status=Enabled


          # --------------------------------------------------
          # Enable SSE-S3 encryption.
          # --------------------------------------------------

          echo ""

          echo "Enabling S3 encryption..."

          aws s3api put-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --server-side-encryption-configuration \
            '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }
              ]
            }'


          # --------------------------------------------------
          # Block public access.
          # --------------------------------------------------

          echo ""

          echo "Blocking public access..."

          aws s3api put-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true


          # --------------------------------------------------
          # Apply bucket tags.
          # --------------------------------------------------

          echo ""

          echo "Applying bucket tags..."

          aws s3api put-bucket-tagging \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --tagging '{
              "TagSet": [
                {
                  "Key": "Name",
                  "Value": "aws-hybrid-iac-lab-terraform-state"
                },
                {
                  "Key": "Project",
                  "Value": "aws-hybrid-iac-lab"
                },
                {
                  "Key": "ManagedBy",
                  "Value": "GitHub-Actions-Bootstrap"
                },
                {
                  "Key": "Purpose",
                  "Value": "Terraform-State"
                },
                {
                  "Key": "Environment",
                  "Value": "dev"
                }
              ]
            }'


          # --------------------------------------------------
          # Verify bucket.
          # --------------------------------------------------

          echo ""

          echo "=============================================="

          echo "Terraform State Bucket Verification"

          echo "=============================================="


          echo ""

          echo "Bucket:"

          aws s3api head-bucket \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""

          echo "Versioning:"

          aws s3api get-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""

          echo "Encryption:"

          aws s3api get-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""

          echo "Public Access Block:"

          aws s3api get-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""

          echo "Terraform state backend bootstrap completed."


      # ======================================================
      # Step 5 - Install Terraform
      # ======================================================

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3


      # ======================================================
      # Step 6 - Terraform Init
      # ======================================================

      - name: Terraform Init

        working-directory: infrastructure/terraform

        run: |

          terraform init \
            -input=false


      # ======================================================
      # Step 7 - Terraform Format Check
      # ======================================================

      - name: Terraform Format Check

        working-directory: infrastructure/terraform

        run: |

          terraform fmt \
            -check \
            -recursive


      # ======================================================
      # Step 8 - Terraform Validate
      # ======================================================

      - name: Terraform Validate

        working-directory: infrastructure/terraform

        run: |

          terraform validate


      # ======================================================
      # Step 9 - Terraform State Information
      # ======================================================

      - name: Terraform State Information

        working-directory: infrastructure/terraform

        run: |

          echo "=============================================="

          echo "Terraform State"

          echo "=============================================="

          terraform state list || true


      # ======================================================
      # Step 10 - Terraform Plan
      # ======================================================

      - name: Terraform Plan

        working-directory: infrastructure/terraform

        run: |

          terraform plan \
            -input=false \
            -out=tfplan


      # ======================================================
      # Step 11 - Terraform Apply
      # ======================================================
      #
      # Applies the exact plan generated in the previous step.
      #
      # ======================================================

      - name: Terraform Apply

        working-directory: infrastructure/terraform

        run: |

          terraform apply \
            -input=false \
            -auto-approve \
            tfplan

