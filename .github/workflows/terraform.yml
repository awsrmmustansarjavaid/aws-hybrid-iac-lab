# ============================================================
# GitHub Actions - Terraform Infrastructure Deployment
#
# Project:
#   aws-hybrid-iac-lab
#
# File:
#   .github/workflows/terraform.yml
#
# Purpose:
#
#   1. Checkout repository.
#   2. Run permanent preflight validation.
#   3. Verify GitHub OIDC runtime configuration.
#   4. Diagnose OIDC claims.
#   5. Configure AWS credentials using GitHub OIDC.
#   6. Verify AWS STS identity.
#   7. Bootstrap/verify Terraform S3 state bucket.
#   8. Install Terraform.
#   9. Initialize Terraform.
#   10. Check Terraform formatting.
#   11. Validate Terraform configuration.
#   12. Display Terraform state.
#   13. Generate Terraform plan.
#   14. Apply the exact generated Terraform plan.
#
# ============================================================
# AUTHENTICATION ARCHITECTURE
# ============================================================
#
#   GitHub Actions
#        |
#        | OIDC JWT
#        v
#   token.actions.githubusercontent.com
#        |
#        | sts:AssumeRoleWithWebIdentity
#        v
#   AWS IAM Role
#   aws-hybrid-iac-lab-GitHubActions
#        |
#        | Temporary AWS credentials
#        v
#   AWS Services
#
#
# IMPORTANT:
#
# This workflow does NOT use:
#
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# AWS credentials are obtained through GitHub OIDC.
#
# ============================================================
# IMPORTANT SECURITY NOTE
# ============================================================
#
# AWS_ROLE_ARN is intentionally stored as a workflow-level
# environment variable.
#
# An IAM role ARN is an identifier, NOT a password or credential.
#
# No long-lived AWS access keys should be added to this workflow.
#
# ============================================================


# ============================================================
# WORKFLOW NAME
# ============================================================

name: Terraform Infrastructure


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================
#
# workflow_dispatch:
#   Allows manual execution.
#
# workflow_call:
#   Allows this workflow to be called by another workflow.
#
# push:
#   Intentionally disabled.
#
# ============================================================

on:

  workflow_dispatch:

  workflow_call:


# ============================================================
# GLOBAL CONFIGURATION
# ============================================================
#
# IMPORTANT:
#
# Keep frequently changed configuration here.
#
# If you later need to change:
#
#   AWS region
#   IAM role
#   Terraform working directory
#   Terraform version
#   state bucket
#   state region
#   Terraform plan filename
#   project name
#   environment
#
# you can normally change it here instead of searching through
# the entire workflow.
#
# ============================================================

env:

  # ----------------------------------------------------------
  # AWS CONFIGURATION
  # ----------------------------------------------------------

  AWS_REGION: us-east-1

  AWS_ROLE_ARN: arn:aws:iam::537236558357:role/aws-hybrid-iac-lab-GitHubActions

  AWS_ROLE_SESSION_NAME: GitHubActions-Terraform


  # ----------------------------------------------------------
  # PROJECT CONFIGURATION
  # ----------------------------------------------------------

  PROJECT_NAME: aws-hybrid-iac-lab

  ENVIRONMENT: dev


  # ----------------------------------------------------------
  # TERRAFORM CONFIGURATION
  # ----------------------------------------------------------

  TF_WORKING_DIRECTORY: infrastructure/terraform

  TF_VERSION: latest

  TF_PLAN_FILE: tfplan

  TF_IN_AUTOMATION: true

  TF_INPUT: false


  # ----------------------------------------------------------
  # TERRAFORM STATE CONFIGURATION
  # ----------------------------------------------------------
  #
  # This bucket is ONLY for Terraform state.
  #
  # It is separate from the CloudFormation template bucket.
  #
  # ----------------------------------------------------------

  TF_STATE_BUCKET: aws-hybrid-iac-lab-terraform-state-537236558357

  TF_STATE_REGION: us-east-1

  TF_STATE_KEY: aws-hybrid-iac-lab/terraform.tfstate


  # ----------------------------------------------------------
  # TERRAFORM APPLY CONFIGURATION
  # ----------------------------------------------------------

  TF_AUTO_APPROVE: true


# ============================================================
# CONCURRENCY PROTECTION
# ============================================================
#
# Prevent multiple Terraform deployments from attempting to
# modify the same Terraform state simultaneously.
#
# ============================================================

concurrency:

  group: terraform-${{ github.repository }}-${{ github.ref }}

  cancel-in-progress: false


# ============================================================
# GITHUB ACTIONS PERMISSIONS
# ============================================================
#
# id-token: write
#
# REQUIRED for GitHub OIDC.
#
# This does NOT give AWS permissions.
# It only allows GitHub to request an OIDC token.
#
#
# contents: read
#
# Required for actions/checkout.
#
# ============================================================

permissions:

  id-token: write

  contents: read


# ============================================================
# TERRAFORM DEPLOYMENT JOB
# ============================================================

jobs:

  terraform:

    name: Terraform Infrastructure Deployment

    runs-on: ubuntu-latest


    steps:


      # ======================================================
      # STEP 1
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout Repository

        uses: actions/checkout@v4


      # ======================================================
      # STEP 2
      # PERMANENT PRE-FLIGHT VALIDATION
      # ======================================================
      #
      # This step runs BEFORE OIDC authentication.
      #
      # Since AWS credentials intentionally do not exist yet,
      # this step validates the configuration required for
      # OIDC authentication instead of calling AWS APIs.
      #
      # Checks:
      #
      #   - AWS region
      #   - IAM role ARN
      #   - GitHub repository
      #   - GitHub ref
      #   - GitHub branch
      #   - OIDC runtime variables
      #   - AWS CLI
      #   - Terraform directory
      #   - Terraform state bucket configuration
      #   - long-lived AWS credential variables
      #
      # ======================================================

      - name: Preflight Configuration Validation

        shell: bash

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "PRE-FLIGHT CONFIGURATION VALIDATION"
          echo "=================================================="

          echo ""
          echo "Project:"
          echo "${PROJECT_NAME}"

          echo ""
          echo "Environment:"
          echo "${ENVIRONMENT}"

          echo ""
          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo ""
          echo "AWS IAM Role:"
          echo "${AWS_ROLE_ARN}"

          echo ""
          echo "AWS Role Session:"
          echo "${AWS_ROLE_SESSION_NAME}"

          echo ""
          echo "GitHub Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "GitHub Ref:"
          echo "${GITHUB_REF}"

          echo ""
          echo "GitHub Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""
          echo "Terraform Directory:"
          echo "${TF_WORKING_DIRECTORY}"

          echo ""
          echo "Terraform Version Configuration:"
          echo "${TF_VERSION}"

          echo ""
          echo "Terraform State Bucket:"
          echo "${TF_STATE_BUCKET}"

          echo ""
          echo "Terraform State Region:"
          echo "${TF_STATE_REGION}"

          echo ""
          echo "Terraform State Key:"
          echo "${TF_STATE_KEY}"


          # --------------------------------------------------
          # Validate AWS region.
          # --------------------------------------------------

          if [[ ! "${AWS_REGION}" =~ ^[a-z]{2}-[a-z0-9-]+-[0-9]+$ ]]; then
            echo ""
            echo "ERROR: Invalid AWS_REGION:"
            echo "${AWS_REGION}"
            exit 1
          fi


          # --------------------------------------------------
          # Validate IAM role ARN.
          # --------------------------------------------------

          if [[ ! "${AWS_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo ""
            echo "ERROR: Invalid AWS_ROLE_ARN format."
            echo "${AWS_ROLE_ARN}"
            exit 1
          fi


          # --------------------------------------------------
          # Validate AWS role session name.
          # --------------------------------------------------

          if [[ -z "${AWS_ROLE_SESSION_NAME}" ]]; then
            echo ""
            echo "ERROR: AWS_ROLE_SESSION_NAME is empty."
            exit 1
          fi


          # --------------------------------------------------
          # Validate GitHub repository.
          # --------------------------------------------------

          EXPECTED_REPOSITORY="awsrmmustansarjavaid/aws-hybrid-iac-lab"

          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo ""
            echo "ERROR: Unexpected GitHub repository."
            echo "Expected:"
            echo "${EXPECTED_REPOSITORY}"
            echo "Actual:"
            echo "${GITHUB_REPOSITORY}"
            exit 1
          fi


          # --------------------------------------------------
          # Validate workflow branch.
          #
          # The current IAM trust policy is configured for main.
          # --------------------------------------------------

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo ""
            echo "WARNING: Workflow is not running from main."
            echo "Current ref:"
            echo "${GITHUB_REF}"
            echo ""
            echo "The AWS IAM trust policy currently expects:"
            echo "repo:awsrmmustansarjavaid/aws-hybrid-iac-lab:ref:refs/heads/main"
            echo ""
            echo "OIDC authentication may therefore be rejected."
          fi


          # --------------------------------------------------
          # Verify AWS CLI exists.
          # --------------------------------------------------

          if ! command -v aws >/dev/null 2>&1; then
            echo ""
            echo "ERROR: AWS CLI is not installed."
            exit 1
          fi

          echo ""
          echo "AWS CLI:"
          aws --version


          # --------------------------------------------------
          # Verify Terraform directory exists.
          # --------------------------------------------------

          if [[ ! -d "${TF_WORKING_DIRECTORY}" ]]; then
            echo ""
            echo "ERROR: Terraform directory does not exist:"
            echo "${TF_WORKING_DIRECTORY}"
            exit 1
          fi


          # --------------------------------------------------
          # Verify Terraform configuration files exist.
          # --------------------------------------------------

          if ! find "${TF_WORKING_DIRECTORY}" -maxdepth 1 -name "*.tf" -print -quit | grep -q .; then
            echo ""
            echo "ERROR: No Terraform .tf files found."
            echo "${TF_WORKING_DIRECTORY}"
            exit 1
          fi


          # --------------------------------------------------
          # Verify state bucket configuration.
          # --------------------------------------------------

          if [[ -z "${TF_STATE_BUCKET}" ]]; then
            echo ""
            echo "ERROR: TF_STATE_BUCKET is empty."
            exit 1
          fi


          if [[ -z "${TF_STATE_REGION}" ]]; then
            echo ""
            echo "ERROR: TF_STATE_REGION is empty."
            exit 1
          fi


          if [[ -z "${TF_STATE_KEY}" ]]; then
            echo ""
            echo "ERROR: TF_STATE_KEY is empty."
            exit 1
          fi


          # --------------------------------------------------
          # IMPORTANT:
          #
          # We intentionally verify that long-lived AWS
          # credentials are NOT required.
          #
          # GitHub OIDC should provide the authentication.
          # --------------------------------------------------

          if [[ -n "${AWS_ACCESS_KEY_ID:-}" ]]; then
            echo ""
            echo "ERROR: AWS_ACCESS_KEY_ID is present."
            echo ""
            echo "This workflow is designed to use GitHub OIDC."
            echo "Do not configure long-lived AWS access keys."
            exit 1
          fi


          if [[ -n "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo ""
            echo "ERROR: AWS_SECRET_ACCESS_KEY is present."
            echo ""
            echo "This workflow is designed to use GitHub OIDC."
            exit 1
          fi


          # --------------------------------------------------
          # Verify GitHub supplied the OIDC token runtime
          # variables.
          #
          # These are automatically supplied by GitHub when
          # id-token: write is available.
          #
          # They are NOT GitHub repository secrets.
          # --------------------------------------------------

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo ""
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_TOKEN is unavailable."
            echo ""
            echo "Check:"
            echo "  permissions:"
            echo "    id-token: write"
            exit 1
          fi


          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo ""
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is unavailable."
            echo ""
            echo "Check:"
            echo "  permissions:"
            echo "    id-token: write"
            exit 1
          fi


          echo ""
          echo "=================================================="
          echo "PRE-FLIGHT VALIDATION PASSED"
          echo "=================================================="


      # ======================================================
      # STEP 3
      # DIAGNOSE GITHUB OIDC CLAIMS
      # ======================================================
      #
      # IMPORTANT:
      #
      # This step MUST happen before AWS authentication.
      #
      # It requests the GitHub OIDC JWT and displays the
      # relevant claims.
      #
      # We do NOT print the complete JWT.
      #
      # Important claims:
      #
      #   iss
      #   aud
      #   sub
      #   repository
      #   repository_id
      #   repository_owner
      #   repository_owner_id
      #   ref
      #   ref_type
      #   workflow
      #   workflow_ref
      #   job_workflow_ref
      #   environment
      #
      # These values allow us to compare the actual GitHub
      # identity against the AWS IAM trust policy.
      #
      # This step can be removed after the OIDC issue is fixed.
      #
      # ======================================================

      - name: Diagnose GitHub OIDC Claims

        shell: bash

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "GITHUB OIDC CLAIM DIAGNOSTIC"
          echo "=================================================="

          echo ""
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "Ref:"
          echo "${GITHUB_REF}"

          echo ""
          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""
          echo "Requesting OIDC token..."

          TOKEN_RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          )"

          TOKEN="$(
            printf '%s' "${TOKEN_RESPONSE}" |
              jq -r '.value'
          )"

          if [[ -z "${TOKEN}" || "${TOKEN}" == "null" ]]; then
            echo ""
            echo "ERROR: GitHub returned an empty OIDC token."
            exit 1
          fi


          # --------------------------------------------------
          # Decode only the JWT payload.
          #
          # The complete token is NEVER printed.
          # --------------------------------------------------

          PAYLOAD="$(
            printf '%s' "${TOKEN}" |
              cut -d '.' -f 2 |
              tr '_-' '/+' |
              awk '{
                l=length($0)%4
                if(l==2) print $0"=="
                else if(l==3) print $0"="
                else print $0
              }' |
              base64 -d 2>/dev/null
          )"


          if [[ -z "${PAYLOAD}" ]]; then
            echo ""
            echo "ERROR: Unable to decode OIDC token payload."
            exit 1
          fi


          echo ""
          echo "=================================================="
          echo "OIDC CLAIMS"
          echo "=================================================="


          echo "${PAYLOAD}" |
            jq -r '
              [
                "iss",
                "aud",
                "sub",
                "repository",
                "repository_id",
                "repository_owner",
                "repository_owner_id",
                "ref",
                "ref_type",
                "workflow",
                "workflow_ref",
                "job_workflow_ref",
                "environment"
              ]
              | .[]
              as $key
              | "\($key): \(.[$key] // "<not present>")"
            '


          echo ""
          echo "=================================================="
          echo "OIDC CLAIM DIAGNOSTIC COMPLETED"
          echo "=================================================="

          echo ""
          echo "IMPORTANT:"
          echo "Compare the 'sub' claim above with the AWS IAM"
          echo "trust policy for aws-hybrid-iac-lab-GitHubActions."



      # ======================================================
      # STEP 4
      # DISPLAY AWS DEPLOYMENT CONFIGURATION
      # ======================================================

      - name: Display AWS Deployment Configuration

        shell: bash

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "AWS DEPLOYMENT CONFIGURATION"
          echo "=================================================="

          echo ""
          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo ""
          echo "AWS IAM Role:"
          echo "${AWS_ROLE_ARN}"

          echo ""
          echo "Role Session:"
          echo "${AWS_ROLE_SESSION_NAME}"

          echo ""
          echo "GitHub Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "GitHub Ref:"
          echo "${GITHUB_REF}"

          echo ""
          echo "GitHub Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""
          echo "Terraform Directory:"
          echo "${TF_WORKING_DIRECTORY}"

          echo ""
          echo "Terraform State Bucket:"
          echo "${TF_STATE_BUCKET}"

          echo ""
          echo "Terraform State Key:"
          echo "${TF_STATE_KEY}"

          echo ""
          echo "=================================================="
          echo "CONFIGURATION DISPLAY COMPLETED"
          echo "=================================================="


      # ======================================================
      # STEP 5
      # CONFIGURE AWS CREDENTIALS USING OIDC
      # ======================================================
      #
      # GitHub:
      #
      #   1. Requests an OIDC JWT.
      #
      #   2. Sends it to AWS STS.
      #
      #   3. AWS validates:
      #
      #        OIDC Provider
      #        issuer
      #        audience
      #        subject
      #        IAM trust policy
      #
      #   4. AWS returns temporary credentials.
      #
      # ======================================================

      - name: Configure AWS Credentials Using OIDC

        uses: aws-actions/configure-aws-credentials@v6

        with:

          aws-region: ${{ env.AWS_REGION }}

          role-to-assume: ${{ env.AWS_ROLE_ARN }}

          role-session-name: ${{ env.AWS_ROLE_SESSION_NAME }}


      # ======================================================
      # STEP 6
      # VERIFY AWS STS IDENTITY
      # ======================================================
      #
      # This is the first step that actually proves AWS
      # authentication succeeded.
      #
      # Expected result:
      #
      #   arn:aws:sts::<ACCOUNT_ID>:assumed-role/...
      #
      # If this step runs successfully, GitHub OIDC has
      # successfully exchanged the token for AWS credentials.
      #
      # ======================================================

      - name: Verify AWS Identity

        shell: bash

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "AWS STS IDENTITY"
          echo "=================================================="

          IDENTITY_JSON="$(aws sts get-caller-identity)"

          echo "${IDENTITY_JSON}" | jq .

          ACCOUNT_ID="$(echo "${IDENTITY_JSON}" | jq -r '.Account')"

          ARN="$(echo "${IDENTITY_JSON}" | jq -r '.Arn')"


          # --------------------------------------------------
          # Verify expected AWS account.
          # --------------------------------------------------

          EXPECTED_ACCOUNT_ID="537236558357"

          if [[ "${ACCOUNT_ID}" != "${EXPECTED_ACCOUNT_ID}" ]]; then
            echo ""
            echo "ERROR: Unexpected AWS account."
            echo "Expected: ${EXPECTED_ACCOUNT_ID}"
            echo "Actual:   ${ACCOUNT_ID}"
            exit 1
          fi


          # --------------------------------------------------
          # Verify that the assumed role is the expected role.
          # --------------------------------------------------

          EXPECTED_ROLE_NAME="aws-hybrid-iac-lab-GitHubActions"

          if [[ "${ARN}" != *"${EXPECTED_ROLE_NAME}"* ]]; then
            echo ""
            echo "ERROR: Unexpected AWS IAM role."
            echo "Expected role: ${EXPECTED_ROLE_NAME}"
            echo "Actual ARN:    ${ARN}"
            exit 1
          fi


          echo ""
          echo "AWS account verification: PASSED"

          echo ""
          echo "AWS role verification: PASSED"

          echo ""
          echo "AWS OIDC authentication: PASSED"

          echo ""
          echo "=================================================="
          echo "AWS IDENTITY VERIFICATION COMPLETED"
          echo "=================================================="


      # ======================================================
      # STEP 7
      # BOOTSTRAP TERRAFORM STATE BUCKET
      # ======================================================
      #
      # The state bucket must exist before terraform init.
      #
      # This step:
      #
      #   - checks the bucket
      #   - creates it if missing
      #   - enables versioning
      #   - enables encryption
      #   - blocks public access
      #   - applies tags
      #   - verifies configuration
      #
      # ======================================================

      - name: Bootstrap Terraform State Bucket

        shell: bash

        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TERRAFORM STATE BACKEND BOOTSTRAP"
          echo "=================================================="

          echo ""
          echo "State bucket:"
          echo "${TF_STATE_BUCKET}"

          echo ""
          echo "State region:"
          echo "${TF_STATE_REGION}"

          echo ""
          echo "State key:"
          echo "${TF_STATE_KEY}"


          # --------------------------------------------------
          # Check whether bucket exists.
          # --------------------------------------------------

          echo ""
          echo "Checking Terraform state bucket..."

          if aws s3api head-bucket \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            2>/dev/null
          then

            echo "Terraform state bucket already exists."

          else

            echo "Terraform state bucket does not exist."

            echo "Creating Terraform state bucket..."


            # ------------------------------------------------
            # us-east-1 does not use LocationConstraint.
            # ------------------------------------------------

            if [[ "${TF_STATE_REGION}" == "us-east-1" ]]; then

              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${TF_STATE_REGION}"

            else

              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${TF_STATE_REGION}" \
                --create-bucket-configuration \
                  LocationConstraint="${TF_STATE_REGION}"

            fi

            echo "Terraform state bucket created."

          fi


          # --------------------------------------------------
          # Enable versioning.
          # --------------------------------------------------

          echo ""
          echo "Enabling S3 versioning..."

          aws s3api put-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --versioning-configuration Status=Enabled


          # --------------------------------------------------
          # Enable SSE-S3 encryption.
          # --------------------------------------------------

          echo ""
          echo "Enabling S3 encryption..."

          aws s3api put-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --server-side-encryption-configuration \
            '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }
              ]
            }'


          # --------------------------------------------------
          # Block public access.
          # --------------------------------------------------

          echo ""
          echo "Blocking public access..."

          aws s3api put-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true


          # --------------------------------------------------
          # Apply bucket tags.
          # --------------------------------------------------

          echo ""
          echo "Applying bucket tags..."

          aws s3api put-bucket-tagging \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --tagging '{
              "TagSet": [
                {
                  "Key": "Name",
                  "Value": "aws-hybrid-iac-lab-terraform-state"
                },
                {
                  "Key": "Project",
                  "Value": "aws-hybrid-iac-lab"
                },
                {
                  "Key": "ManagedBy",
                  "Value": "GitHub-Actions-Bootstrap"
                },
                {
                  "Key": "Purpose",
                  "Value": "Terraform-State"
                },
                {
                  "Key": "Environment",
                  "Value": "dev"
                }
              ]
            }'


          # --------------------------------------------------
          # Verify bucket.
          # --------------------------------------------------

          echo ""
          echo "=================================================="
          echo "STATE BUCKET VERIFICATION"
          echo "=================================================="


          echo ""
          echo "Bucket:"

          aws s3api head-bucket \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""
          echo "Versioning:"

          aws s3api get-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""
          echo "Encryption:"

          aws s3api get-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""
          echo "Public Access Block:"

          aws s3api get-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"


          echo ""
          echo "Terraform state backend bootstrap completed."


      # ======================================================
      # STEP 8
      # SETUP TERRAFORM
      # ======================================================

      - name: Setup Terraform

        uses: hashicorp/setup-terraform@v3

        with:

          terraform_version: ${{ env.TF_VERSION }}


      # ======================================================
      # STEP 9
      # TERRAFORM INIT
      # ======================================================

      - name: Terraform Init

        working-directory: ${{ env.TF_WORKING_DIRECTORY }}

        run: |

          terraform init \
            -input=false


      # ======================================================
      # STEP 10
      # TERRAFORM FORMAT CHECK
      # ======================================================

      - name: Terraform Format Check

        working-directory: ${{ env.TF_WORKING_DIRECTORY }}

        run: |

          terraform fmt \
            -check \
            -recursive


      # ======================================================
      # STEP 11
      # TERRAFORM VALIDATE
      # ======================================================

      - name: Terraform Validate

        working-directory: ${{ env.TF_WORKING_DIRECTORY }}

        run: |

          terraform validate


      # ======================================================
      # STEP 12
      # TERRAFORM STATE INFORMATION
      # ======================================================

      - name: Terraform State Information

        working-directory: ${{ env.TF_WORKING_DIRECTORY }}

        run: |

          echo "=================================================="
          echo "TERRAFORM STATE"
          echo "=================================================="

          terraform state list || true


      # ======================================================
      # STEP 13
      # TERRAFORM PLAN
      # ======================================================
      #
      # The generated plan is stored in:
      #
      #   TF_PLAN_FILE
      #
      # ======================================================

      - name: Terraform Plan

        working-directory: ${{ env.TF_WORKING_DIRECTORY }}

        run: |

          terraform plan \
            -input=false \
            -out="${TF_PLAN_FILE}"


      # ======================================================
      # STEP 14
      # TERRAFORM APPLY
      # ======================================================
      #
      # Applies the EXACT plan generated by Step 13.
      #
      # ======================================================

      - name: Terraform Apply

        if: ${{ env.TF_AUTO_APPROVE == 'true' }}

        working-directory: ${{ env.TF_WORKING_DIRECTORY }}

        run: |

          terraform apply \
            -input=false \
            -auto-approve \
            "${TF_PLAN_FILE}"

