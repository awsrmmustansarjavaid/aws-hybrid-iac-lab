# ==============================================================
# Terraform Infrastructure Deployment
#
# Purpose:
# - Authenticate GitHub Actions to AWS using OIDC
# - Use the dedicated S3 Terraform backend
# - Validate and plan Terraform
# - Apply the infrastructure automatically
#
# IMPORTANT:
# The Terraform state bucket must already exist before this
# workflow runs.
#
# The state bucket is NOT created by this workflow.
# It is created and managed separately by the bootstrap Terraform
# configuration:
#
# infrastructure/bootstrap/terraform-state/
# ==============================================================

name: Terraform Infrastructure


# ==============================================================
# WORKFLOW TRIGGERS
# ==============================================================

on:

  # Allows another GitHub Actions workflow to call this workflow.
  workflow_call:

  # Allows you to manually start the workflow from:
  #
  # GitHub → Actions → Terraform Infrastructure → Run workflow
  #
  workflow_dispatch:


# ==============================================================
# GITHUB ACTIONS PERMISSIONS
# ==============================================================

permissions:

  # Required for GitHub OIDC authentication with AWS STS.
  #
  # This allows GitHub to issue an OIDC token which AWS uses to
  # verify that this workflow is allowed to assume your IAM role.
  id-token: write

  # Required by actions/checkout to read your repository.
  contents: read


# ==============================================================
# JOB
# ==============================================================

jobs:

  terraform:

    # Name displayed in the GitHub Actions UI.
    name: Terraform Infrastructure Deployment

    # GitHub-hosted Ubuntu runner.
    runs-on: ubuntu-latest


    # ==========================================================
    # STEPS
    # ==========================================================

    steps:


      # ----------------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # ----------------------------------------------------------
      #
      # Downloads your GitHub repository into the temporary
      # GitHub Actions runner.
      #
      # This gives Terraform access to:
      #
      # infrastructure/terraform/
      # infrastructure/cloudformation/
      # etc.
      #
      # ----------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # 2. CONFIGURE AWS CREDENTIALS
      # ----------------------------------------------------------
      #
      # Uses GitHub OIDC instead of storing long-lived AWS
      # access keys in GitHub Secrets.
      #
      # AWS_REGION:
      #   GitHub Repository Variable
      #
      # AWS_ROLE_ARN:
      #   GitHub Repository Secret
      #
      # Example:
      #
      # AWS_REGION = us-east-1
      #
      # AWS_ROLE_ARN =
      # arn:aws:iam::537236558357:role/aws-hybrid-iac-lab-GitHubActions
      #
      # ----------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:

          # AWS region stored in GitHub Repository Variables.
          aws-region: ${{ vars.AWS_REGION }}

          # IAM role assumed using GitHub OIDC.
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}


      # ----------------------------------------------------------
      # 3. VERIFY AWS IDENTITY
      # ----------------------------------------------------------
      #
      # Confirms which AWS IAM role GitHub Actions is actually
      # using.
      #
      # This is extremely useful when troubleshooting OIDC,
      # IAM permissions, or Terraform deployment problems.
      #
      # Expected role:
      #
      # arn:aws:iam::537236558357:role/
      # aws-hybrid-iac-lab-GitHubActions
      #
      # ----------------------------------------------------------

      - name: Verify AWS Identity
        shell: bash

        run: |
          aws sts get-caller-identity


      # ----------------------------------------------------------
      # 4. INSTALL TERRAFORM
      # ----------------------------------------------------------
      #
      # Installs Terraform on the GitHub Actions runner.
      #
      # The runner is temporary, so Terraform needs to be
      # installed/configured for the workflow.
      #
      # ----------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # ----------------------------------------------------------
      # 5. TERRAFORM INIT
      # ----------------------------------------------------------
      #
      # This is where Terraform connects to the persistent
      # S3 backend defined in:
      #
      # infrastructure/terraform/backend.tf
      #
      # The backend contains:
      #
      # bucket:
      #   aws-hybrid-iac-lab-terraform-state-537236558357
      #
      # key:
      #   aws-hybrid-iac-lab/dev/terraform.tfstate
      #
      # This means Terraform state is NOT stored on the temporary
      # GitHub Actions runner.
      #
      # Instead, the state is stored permanently in S3.
      #
      # IMPORTANT:
      # The backend bucket must already exist.
      #
      # ----------------------------------------------------------

      - name: Terraform Init
        working-directory: infrastructure/terraform

        run: |
          terraform init


      # ----------------------------------------------------------
      # 6. TERRAFORM FORMAT CHECK
      # ----------------------------------------------------------
      #
      # Checks whether all Terraform files follow Terraform's
      # standard formatting.
      #
      # IMPORTANT:
      # -check means Terraform does not automatically modify files.
      #
      # If formatting is incorrect, the workflow stops here.
      #
      # ----------------------------------------------------------

      - name: Terraform Format Check
        working-directory: infrastructure/terraform

        run: |
          terraform fmt -check -recursive


      # ----------------------------------------------------------
      # 7. TERRAFORM VALIDATE
      # ----------------------------------------------------------
      #
      # Checks Terraform configuration syntax and validates the
      # configuration structure.
      #
      # This does NOT create AWS resources.
      #
      # ----------------------------------------------------------

      - name: Terraform Validate
        working-directory: infrastructure/terraform

        run: |
          terraform validate


      # ----------------------------------------------------------
      # 8. TERRAFORM PLAN
      # ----------------------------------------------------------
      #
      # Terraform compares:
      #
      # 1. Terraform configuration
      # 2. Existing Terraform state in S3
      # 3. Current AWS infrastructure
      #
      # It then determines what needs to be created, changed,
      # or destroyed.
      #
      # IMPORTANT:
      # Terraform state now comes from the persistent S3 backend.
      #
      # ----------------------------------------------------------

      - name: Terraform Plan
        working-directory: infrastructure/terraform

        run: |
          terraform plan


      # ----------------------------------------------------------
      # 9. TERRAFORM APPLY
      # ----------------------------------------------------------
      #
      # Applies the Terraform execution plan and creates/updates
      # AWS infrastructure.
      #
      # -auto-approve means GitHub Actions does not wait for a
      # manual "yes" confirmation.
      #
      # IMPORTANT:
      # This should only run after the Terraform plan is confirmed
      # to be correct.
      #
      # ----------------------------------------------------------

      - name: Terraform Apply
        working-directory: infrastructure/terraform

        run: |
          terraform apply -auto-approve

