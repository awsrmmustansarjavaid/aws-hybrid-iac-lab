# ============================================================
#
# GitHub Actions - Terraform Infrastructure Deployment
#
# Project:
#   aws-hybrid-iac-lab
#
# File:
#   .github/workflows/terraform.yml
#
# Purpose:
#
#   1. Checkout repository.
#   2. Run permanent pre-flight validation.
#   3. Verify GitHub OIDC runtime configuration.
#   4. Diagnose the actual GitHub OIDC JWT claims.
#   5. Configure AWS credentials using GitHub OIDC.
#   6. Verify AWS STS identity.
#   7. Bootstrap/verify Terraform S3 state bucket.
#   8. Install Terraform.
#   9. Initialize Terraform.
#   10. Check Terraform formatting.
#   11. Validate Terraform configuration.
#   12. Diagnose Terraform state safely.
#   13. Discover the latest Amazon Linux 2023 AMI.
#   14. Generate Terraform plan.
#   15. Apply the exact generated Terraform plan.
#
# ============================================================
#
# AUTHENTICATION ARCHITECTURE
#
# ============================================================
#
# GitHub Actions
#       |
#       | OIDC JWT
#       v
# token.actions.githubusercontent.com
#       |
#       | sts:AssumeRoleWithWebIdentity
#       v
# AWS IAM Role
# aws-hybrid-iac-lab-GitHubActions
#       |
#       | Temporary AWS credentials
#       v
# AWS Services
#
# IMPORTANT:
#
# This workflow does NOT use long-lived AWS access keys.
#
# It does NOT require:
#
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#
# AWS credentials are obtained through GitHub OIDC.
#
# ============================================================
#
# IMPORTANT SECURITY / CONFIGURATION NOTE
#
# ============================================================
#
# AWS_ACCOUNT_ID and AWS_ROLE_ARN are intentionally NOT stored
# directly in the workflow-level environment configuration.
#
# They are stored as GitHub Actions REPOSITORY VARIABLES.
#
# These values are identifiers, not AWS credentials.
#
# AWS_ACCOUNT_ID
#   -> Identifies the AWS account.
#
# AWS_ROLE_ARN
#   -> Identifies the IAM role that GitHub Actions assumes.
#
# Configure them under:
#
# GitHub Repository
#   |
#   v
# Settings
#   |
#   v
# Secrets and variables
#   |
#   v
# Actions
#   |
#   v
# Variables
#
# Required repository variables:
#
#   AWS_ACCOUNT_ID
#   AWS_ROLE_ARN
#
# ============================================================
#
# HOW TO CREATE THE REQUIRED GITHUB VARIABLES
#
# ============================================================
#
# Repository:
#
# https://github.com/awsrmmustansarjavaid/aws-hybrid-iac-lab
#
# Navigate to:
#
# Settings
#   -> Secrets and variables
#   -> Actions
#   -> Variables
#
# Create:
#
# ------------------------------------------------------------
# GITHUB VARIABLE #1
# ------------------------------------------------------------
#
# Name:
#   AWS_ACCOUNT_ID
#
# Value:
#   123654789
#
# ------------------------------------------------------------
# GITHUB VARIABLE #2
# ------------------------------------------------------------
#
# Name:
#   AWS_ROLE_ARN
#
# Value:
#   arn:aws:iam::your aws id:role/aws-hybrid-iac-lab-GitHubActions
#
# Variable names are CASE-SENSITIVE.
#
# ============================================================


# ============================================================
# WORKFLOW NAME
# ============================================================

name: Terraform Infrastructure


# ============================================================
# WORKFLOW TRIGGERS
# ============================================================
#
# workflow_dispatch:
#   Allows manual execution from GitHub Actions.
#
# workflow_call:
#   Allows another workflow to call this workflow as a
#   reusable workflow.
#
# IMPORTANT:
#
# This workflow intentionally does NOT contain a push trigger.
#
# ============================================================

on:
  workflow_dispatch:

  workflow_call:


# ============================================================
# GLOBAL CONFIGURATION
# ============================================================
#
# Keep non-sensitive configuration here.
#
# AWS_ACCOUNT_ID and AWS_ROLE_ARN are intentionally loaded
# at the JOB level below from GitHub Repository Variables.
#
# ============================================================

env:

  # ----------------------------------------------------------
  # AWS CONFIGURATION
  # ----------------------------------------------------------

  AWS_REGION: "us-east-1"

  # IAM role name used for post-authentication verification.
  AWS_EXPECTED_ROLE_NAME: "aws-hybrid-iac-lab-GitHubActions"

  # STS role session name.
  AWS_ROLE_SESSION_NAME: "GitHubActions-Terraform"


  # ----------------------------------------------------------
  # AWS OIDC CONFIGURATION
  # ----------------------------------------------------------
  #
  # GitHub requests an OIDC token with this audience.
  #
  # AWS IAM must trust the same audience.
  #

  AWS_OIDC_AUDIENCE: "sts.amazonaws.com"


  # ----------------------------------------------------------
  # PROJECT CONFIGURATION
  # ----------------------------------------------------------

  PROJECT_NAME: "aws-hybrid-iac-lab"
  ENVIRONMENT: "dev"


  # ----------------------------------------------------------
  # TERRAFORM CONFIGURATION
  # ----------------------------------------------------------

  TF_WORKING_DIRECTORY: "infrastructure/terraform"

  # "latest" allows setup-terraform to install the current
  # Terraform release.
  TF_VERSION: "latest"

  # Terraform plan output filename.
  TF_PLAN_FILE: "tfplan"

  # Tell Terraform it is running in automation.
  TF_IN_AUTOMATION: "true"

  # Disable interactive Terraform prompts.
  TF_INPUT: "false"


  # ----------------------------------------------------------
  # TERRAFORM STATE CONFIGURATION
  # ----------------------------------------------------------
  #
  # This bucket is ONLY for Terraform state.
  #
  # It is separate from the CloudFormation template bucket.
  #

  TF_STATE_BUCKET: "aws-hybrid-iac-lab-terraform-state-537236558357"
  TF_STATE_REGION: "us-east-1"
  TF_STATE_KEY: "aws-hybrid-iac-lab/terraform.tfstate"


  # ----------------------------------------------------------
  # TERRAFORM APPLY CONFIGURATION
  # ----------------------------------------------------------
  #
  # true  = automatically apply the generated plan.
  # false = skip the Terraform Apply step.
  #

  TF_AUTO_APPROVE: "true"


# ============================================================
# CONCURRENCY PROTECTION
# ============================================================
#
# Prevent multiple Terraform deployments from attempting to
# modify the same Terraform state simultaneously.
#
# ============================================================

concurrency:
  group: "terraform-${{ github.repository }}-${{ github.ref }}"
  cancel-in-progress: false


# ============================================================
# GITHUB ACTIONS PERMISSIONS
# ============================================================
#
# id-token: write
#   REQUIRED for GitHub OIDC.
#
# contents: read
#   Required for actions/checkout.
#
# id-token: write does NOT give AWS permissions.
#
# It only allows GitHub Actions to request an OIDC token.
#
# ============================================================

permissions:
  id-token: write
  contents: read


# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # TERRAFORM DEPLOYMENT JOB
  # ==========================================================

  terraform:

    name: Terraform Infrastructure Deployment

    runs-on: ubuntu-latest


    # ========================================================
    # JOB-LEVEL AWS CONFIGURATION
    # ========================================================
    #
    # These values come from GitHub Repository Variables.
    #
    # GitHub variable names:
    #
    #   AWS_ACCOUNT_ID
    #   AWS_ROLE_ARN
    #
    # ========================================================

    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}


    # ========================================================
    # JOB STEPS
    # ========================================================

    steps:


      # ======================================================
      # STEP 1
      # CHECKOUT REPOSITORY
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # STEP 2
      # PERMANENT PRE-FLIGHT VALIDATION
      # ======================================================
      #
      # This step runs BEFORE AWS authentication.
      #
      # It validates configuration needed for OIDC and
      # Terraform without calling AWS APIs.
      #
      # ======================================================

      - name: Preflight Configuration Validation
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "PRE-FLIGHT CONFIGURATION VALIDATION"
          echo "=================================================="

          # --------------------------------------------------
          # Verify GitHub Repository Variables exist.
          # --------------------------------------------------

          if [[ -z "${AWS_ACCOUNT_ID:-}" ]]; then
            echo ""
            echo "ERROR: GitHub Repository Variable AWS_ACCOUNT_ID is empty or missing."
            echo ""
            echo "Create it at:"
            echo "Repository Settings -> Secrets and variables -> Actions -> Variables"
            exit 1
          fi

          if [[ -z "${AWS_ROLE_ARN:-}" ]]; then
            echo ""
            echo "ERROR: GitHub Repository Variable AWS_ROLE_ARN is empty or missing."
            echo ""
            echo "Create it at:"
            echo "Repository Settings -> Secrets and variables -> Actions -> Variables"
            exit 1
          fi

          # --------------------------------------------------
          # Display important configuration.
          # --------------------------------------------------

          echo ""
          echo "Project:"
          echo "${PROJECT_NAME}"

          echo ""
          echo "Environment:"
          echo "${ENVIRONMENT}"

          echo ""
          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo ""
          echo "AWS Account:"
          echo "${AWS_ACCOUNT_ID}"

          echo ""
          echo "AWS IAM Role:"
          echo "${AWS_ROLE_ARN}"

          echo ""
          echo "Expected IAM Role Name:"
          echo "${AWS_EXPECTED_ROLE_NAME}"

          echo ""
          echo "AWS Role Session:"
          echo "${AWS_ROLE_SESSION_NAME}"

          echo ""
          echo "AWS OIDC Audience:"
          echo "${AWS_OIDC_AUDIENCE}"

          echo ""
          echo "GitHub Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "GitHub Ref:"
          echo "${GITHUB_REF}"

          echo ""
          echo "GitHub Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""
          echo "Terraform Directory:"
          echo "${TF_WORKING_DIRECTORY}"

          echo ""
          echo "Terraform Version Configuration:"
          echo "${TF_VERSION}"

          echo ""
          echo "Terraform State Bucket:"
          echo "${TF_STATE_BUCKET}"

          echo ""
          echo "Terraform State Region:"
          echo "${TF_STATE_REGION}"

          echo ""
          echo "Terraform State Key:"
          echo "${TF_STATE_KEY}"

          # --------------------------------------------------
          # Validate AWS region.
          # --------------------------------------------------

          if [[ ! "${AWS_REGION}" =~ ^[a-z]{2}-[a-z0-9-]+-[0-9]+$ ]]; then
            echo ""
            echo "ERROR: Invalid AWS_REGION:"
            echo "${AWS_REGION}"
            exit 1
          fi

          # --------------------------------------------------
          # Validate AWS account ID.
          # --------------------------------------------------

          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo ""
            echo "ERROR: Invalid AWS_ACCOUNT_ID."
            echo ""
            echo "Expected a 12-digit AWS account ID."
            exit 1
          fi

          # --------------------------------------------------
          # Validate IAM role ARN.
          # --------------------------------------------------

          if [[ ! "${AWS_ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
            echo ""
            echo "ERROR: Invalid AWS_ROLE_ARN format."
            echo "${AWS_ROLE_ARN}"
            exit 1
          fi

          # --------------------------------------------------
          # Verify role ARN belongs to expected AWS account.
          # --------------------------------------------------

          ROLE_ACCOUNT_ID="$(echo "${AWS_ROLE_ARN}" | cut -d ':' -f 5)"

          if [[ "${ROLE_ACCOUNT_ID}" != "${AWS_ACCOUNT_ID}" ]]; then
            echo ""
            echo "ERROR: IAM role ARN belongs to a different AWS account."
            echo ""
            echo "Expected account:"
            echo "${AWS_ACCOUNT_ID}"
            echo ""
            echo "Role ARN account:"
            echo "${ROLE_ACCOUNT_ID}"
            exit 1
          fi

          # --------------------------------------------------
          # Validate expected IAM role name.
          # --------------------------------------------------

          if [[ -z "${AWS_EXPECTED_ROLE_NAME}" ]]; then
            echo ""
            echo "ERROR: AWS_EXPECTED_ROLE_NAME is empty."
            exit 1
          fi

          # --------------------------------------------------
          # Verify role ARN and expected role name match.
          # --------------------------------------------------

          ROLE_NAME_FROM_ARN="${AWS_ROLE_ARN##*/}"

          if [[ "${ROLE_NAME_FROM_ARN}" != "${AWS_EXPECTED_ROLE_NAME}" ]]; then
            echo ""
            echo "ERROR: AWS_ROLE_ARN and AWS_EXPECTED_ROLE_NAME do not match."
            echo ""
            echo "Role from ARN:"
            echo "${ROLE_NAME_FROM_ARN}"
            echo ""
            echo "Expected role:"
            echo "${AWS_EXPECTED_ROLE_NAME}"
            exit 1
          fi

          # --------------------------------------------------
          # Validate AWS role session name.
          # --------------------------------------------------

          if [[ -z "${AWS_ROLE_SESSION_NAME}" ]]; then
            echo ""
            echo "ERROR: AWS_ROLE_SESSION_NAME is empty."
            exit 1
          fi

          # --------------------------------------------------
          # Validate AWS OIDC audience.
          # --------------------------------------------------

          if [[ -z "${AWS_OIDC_AUDIENCE:-}" ]]; then
            echo ""
            echo "ERROR: AWS_OIDC_AUDIENCE is empty or undefined."
            echo ""
            echo "Expected:"
            echo "sts.amazonaws.com"
            exit 1
          fi

          if [[ "${AWS_OIDC_AUDIENCE}" != "sts.amazonaws.com" ]]; then
            echo ""
            echo "ERROR: Invalid AWS_OIDC_AUDIENCE."
            echo ""
            echo "Expected:"
            echo "sts.amazonaws.com"
            echo ""
            echo "Actual:"
            echo "${AWS_OIDC_AUDIENCE}"
            exit 1
          fi

          echo ""
          echo "AWS OIDC audience validation: PASSED"

          # --------------------------------------------------
          # Validate GitHub repository.
          # --------------------------------------------------

          EXPECTED_REPOSITORY="awsrmmustansarjavaid/aws-hybrid-iac-lab"

          if [[ "${GITHUB_REPOSITORY}" != "${EXPECTED_REPOSITORY}" ]]; then
            echo ""
            echo "ERROR: Unexpected GitHub repository."
            echo ""
            echo "Expected:"
            echo "${EXPECTED_REPOSITORY}"
            echo ""
            echo "Actual:"
            echo "${GITHUB_REPOSITORY}"
            exit 1
          fi

          # --------------------------------------------------
          # Validate workflow branch.
          #
          # A warning is used because this workflow can be
          # called as a reusable workflow.
          # --------------------------------------------------

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo ""
            echo "WARNING: Workflow is not running from main."
            echo ""
            echo "Current ref:"
            echo "${GITHUB_REF}"
            echo ""
            echo "The current AWS IAM trust policy is expected to allow the main branch."
          fi

          # --------------------------------------------------
          # Verify AWS CLI exists.
          # --------------------------------------------------

          if ! command -v aws >/dev/null 2>&1; then
            echo ""
            echo "ERROR: AWS CLI is not installed."
            exit 1
          fi

          echo ""
          echo "AWS CLI:"
          aws --version

          # --------------------------------------------------
          # Verify jq exists.
          # --------------------------------------------------

          if ! command -v jq >/dev/null 2>&1; then
            echo ""
            echo "ERROR: jq is not installed."
            exit 1
          fi

          echo ""
          echo "jq:"
          jq --version

          # --------------------------------------------------
          # Verify curl exists.
          # --------------------------------------------------

          if ! command -v curl >/dev/null 2>&1; then
            echo ""
            echo "ERROR: curl is not installed."
            exit 1
          fi

          # --------------------------------------------------
          # Verify Terraform directory exists.
          # --------------------------------------------------

          if [[ ! -d "${TF_WORKING_DIRECTORY}" ]]; then
            echo ""
            echo "ERROR: Terraform directory does not exist:"
            echo "${TF_WORKING_DIRECTORY}"
            exit 1
          fi

          # --------------------------------------------------
          # Verify Terraform configuration files exist.
          # --------------------------------------------------

          if ! find "${TF_WORKING_DIRECTORY}" \
            -maxdepth 1 \
            -type f \
            -name "*.tf" \
            -print \
            -quit |
            grep -q .
          then
            echo ""
            echo "ERROR: No Terraform .tf files found."
            echo "${TF_WORKING_DIRECTORY}"
            exit 1
          fi

          # --------------------------------------------------
          # Verify Terraform state configuration.
          # --------------------------------------------------

          if [[ -z "${TF_STATE_BUCKET}" ]]; then
            echo ""
            echo "ERROR: TF_STATE_BUCKET is empty."
            exit 1
          fi

          if [[ -z "${TF_STATE_REGION}" ]]; then
            echo ""
            echo "ERROR: TF_STATE_REGION is empty."
            exit 1
          fi

          if [[ -z "${TF_STATE_KEY}" ]]; then
            echo ""
            echo "ERROR: TF_STATE_KEY is empty."
            exit 1
          fi

          # --------------------------------------------------
          # Verify state region matches AWS deployment region.
          # --------------------------------------------------

          if [[ "${TF_STATE_REGION}" != "${AWS_REGION}" ]]; then
            echo ""
            echo "ERROR: Terraform state region does not match AWS region."
            echo ""
            echo "AWS_REGION:"
            echo "${AWS_REGION}"
            echo ""
            echo "TF_STATE_REGION:"
            echo "${TF_STATE_REGION}"
            exit 1
          fi

          # --------------------------------------------------
          # Verify long-lived AWS credentials are NOT supplied.
          #
          # This workflow uses GitHub OIDC.
          # --------------------------------------------------

          if [[ -n "${AWS_ACCESS_KEY_ID:-}" ]]; then
            echo ""
            echo "ERROR: AWS_ACCESS_KEY_ID is present."
            echo ""
            echo "This workflow is designed to use GitHub OIDC."
            exit 1
          fi

          if [[ -n "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo ""
            echo "ERROR: AWS_SECRET_ACCESS_KEY is present."
            echo ""
            echo "This workflow is designed to use GitHub OIDC."
            exit 1
          fi

          # --------------------------------------------------
          # Verify GitHub supplied OIDC runtime variables.
          # --------------------------------------------------

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo ""
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_TOKEN is unavailable."
            echo ""
            echo "Check:"
            echo "  permissions:"
            echo "    id-token: write"
            exit 1
          fi

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo ""
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is unavailable."
            echo ""
            echo "Check:"
            echo "  permissions:"
            echo "    id-token: write"
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "PRE-FLIGHT VALIDATION PASSED"
          echo "=================================================="


      # ======================================================
      # STEP 3
      # PERMANENT GITHUB OIDC CLAIM DIAGNOSTIC
      # ======================================================

      - name: Diagnose GitHub OIDC Claims
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=================================================="
          echo "GITHUB OIDC CLAIM DIAGNOSTIC"
          echo "=================================================="

          echo ""
          echo "Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "Ref:"
          echo "${GITHUB_REF}"

          echo ""
          echo "Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""
          echo "Event:"
          echo "${GITHUB_EVENT_NAME}"

          echo ""
          echo "Workflow:"
          echo "${GITHUB_WORKFLOW}"

          echo ""
          echo "Job:"
          echo "${GITHUB_JOB}"

          # --------------------------------------------------
          # Verify GitHub OIDC environment variables.
          # --------------------------------------------------

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo ""
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_TOKEN is unavailable."
            exit 1
          fi

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo ""
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is unavailable."
            exit 1
          fi

          # --------------------------------------------------
          # Request OIDC token.
          # --------------------------------------------------

          echo ""
          echo "Requesting OIDC token..."

          OIDC_RESPONSE="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              --get \
              --data-urlencode "audience=${AWS_OIDC_AUDIENCE}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}"
          )"

          # --------------------------------------------------
          # Validate JSON response.
          # --------------------------------------------------

          if ! echo "${OIDC_RESPONSE}" | jq empty >/dev/null 2>&1; then
            echo ""
            echo "ERROR: GitHub returned invalid JSON."
            exit 1
          fi

          # --------------------------------------------------
          # Extract JWT from JSON response.
          # --------------------------------------------------

          OIDC_TOKEN="$(
            echo "${OIDC_RESPONSE}" |
              jq -r '.value // empty'
          )"

          if [[ -z "${OIDC_TOKEN}" ]]; then
            echo ""
            echo "ERROR: OIDC token value was not found."
            echo ""
            echo "Returned JSON keys:"
            echo "${OIDC_RESPONSE}" | jq -r 'keys[]'
            exit 1
          fi

          # --------------------------------------------------
          # NEVER PRINT THE JWT.
          # --------------------------------------------------

          echo ""
          echo "OIDC token received successfully."
          echo "JWT token itself will NOT be printed."

          # --------------------------------------------------
          # Extract JWT payload.
          # --------------------------------------------------

          JWT_PAYLOAD_B64="$(
            echo "${OIDC_TOKEN}" |
              cut -d '.' -f 2
          )"

          if [[ -z "${JWT_PAYLOAD_B64}" ]]; then
            echo ""
            echo "ERROR: Could not extract JWT payload."
            exit 1
          fi

          # --------------------------------------------------
          # Decode Base64URL JWT payload.
          # --------------------------------------------------

          JWT_PAYLOAD="$(
            printf '%s' "${JWT_PAYLOAD_B64}" |
              tr '_-' '/+' |
              awk '
                {
                  remainder = length($0) % 4;

                  if (remainder == 2) {
                    $0 = $0 "==";
                  }
                  else if (remainder == 3) {
                    $0 = $0 "=";
                  }

                  print $0;
                }
              ' |
              base64 --decode
          )"

          # --------------------------------------------------
          # Verify decoded payload is valid JSON.
          # --------------------------------------------------

          if ! echo "${JWT_PAYLOAD}" | jq empty >/dev/null 2>&1; then
            echo ""
            echo "ERROR: Decoded OIDC payload is not valid JSON."
            exit 1
          fi

          echo ""
          echo "=================================================="
          echo "OIDC CLAIMS"
          echo "=================================================="

          # --------------------------------------------------
          # Display safe/non-secret claims only.
          # --------------------------------------------------

          echo "${JWT_PAYLOAD}" | jq -r '
            "iss: \(.iss // "<not present>")",
            "aud: \(.aud // "<not present>")",
            "sub: \(.sub // "<not present>")",
            "repository: \(.repository // "<not present>")",
            "repository_id: \(.repository_id // "<not present>")",
            "repository_owner: \(.repository_owner // "<not present>")",
            "repository_owner_id: \(.repository_owner_id // "<not present>")",
            "ref: \(.ref // "<not present>")",
            "ref_type: \(.ref_type // "<not present>")",
            "event_name: \(.event_name // "<not present>")",
            "job_workflow_ref: \(.job_workflow_ref // "<not present>")",
            "workflow: \(.workflow // "<not present>")",
            "workflow_ref: \(.workflow_ref // "<not present>")",
            "environment: \(.environment // "<not present>")"
          '

          # --------------------------------------------------
          # Extract claims used for validation.
          # --------------------------------------------------

          ISS="$(
            echo "${JWT_PAYLOAD}" |
              jq -r '.iss // empty'
          )"

          AUD="$(
            echo "${JWT_PAYLOAD}" |
              jq -r '.aud // empty'
          )"

          SUB="$(
            echo "${JWT_PAYLOAD}" |
              jq -r '.sub // empty'
          )"

          REPOSITORY="$(
            echo "${JWT_PAYLOAD}" |
              jq -r '.repository // empty'
          )"

          REF="$(
            echo "${JWT_PAYLOAD}" |
              jq -r '.ref // empty'
          )"

          EXPECTED_ISSUER="https://token.actions.githubusercontent.com"

          echo ""
          echo "=================================================="
          echo "OIDC VALIDATION"
          echo "=================================================="

          if [[ "${ISS}" == "${EXPECTED_ISSUER}" ]]; then
            echo "PASS: OIDC issuer is correct."
          else
            echo "FAIL: OIDC issuer is incorrect."
            echo "Expected: ${EXPECTED_ISSUER}"
            echo "Actual:   ${ISS}"
            exit 1
          fi

          if [[ "${AUD}" == "${AWS_OIDC_AUDIENCE}" ]]; then
            echo "PASS: OIDC audience is correct."
          else
            echo "FAIL: OIDC audience is incorrect."
            echo "Expected: ${AWS_OIDC_AUDIENCE}"
            echo "Actual:   ${AUD}"
            exit 1
          fi

          if [[ "${REPOSITORY}" == "${GITHUB_REPOSITORY}" ]]; then
            echo "PASS: Repository claim is correct."
          else
            echo "FAIL: Repository claim does not match workflow repository."
            echo "Expected: ${GITHUB_REPOSITORY}"
            echo "Actual:   ${REPOSITORY}"
            exit 1
          fi

          if [[ "${REF}" == "${GITHUB_REF}" ]]; then
            echo "PASS: Ref claim is correct."
          else
            echo "WARNING: Ref claim differs from GITHUB_REF."
            echo "GITHUB_REF: ${GITHUB_REF}"
            echo "OIDC ref:    ${REF}"
          fi

          EXPECTED_CLASSIC_SUB="repo:${GITHUB_REPOSITORY}:ref:${GITHUB_REF}"

          echo ""
          echo "=================================================="
          echo "SUBJECT CLAIM ANALYSIS"
          echo "=================================================="

          echo ""
          echo "Actual OIDC sub:"
          echo "${SUB}"

          echo ""
          echo "Classic IAM expected sub:"
          echo "${EXPECTED_CLASSIC_SUB}"

          if [[ "${SUB}" == "${EXPECTED_CLASSIC_SUB}" ]]; then
            echo ""
            echo "PASS: OIDC sub matches the classic IAM trust policy format."
          else
            echo ""
            echo "WARNING: OIDC sub does NOT match the classic IAM trust policy."
            echo ""
            echo "The IAM trust policy may need to be updated."
            echo ""
            echo "DO NOT change IAM automatically."
            echo "Use the actual 'sub' value displayed above."
          fi

          echo ""
          echo "=================================================="
          echo "OIDC DIAGNOSTIC COMPLETE"
          echo "=================================================="


      # ======================================================
      # STEP 4
      # DISPLAY AWS DEPLOYMENT CONFIGURATION
      # ======================================================

      - name: Display AWS Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "AWS DEPLOYMENT CONFIGURATION"
          echo "=================================================="

          echo ""
          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo ""
          echo "AWS Account:"
          echo "${AWS_ACCOUNT_ID}"

          echo ""
          echo "AWS IAM Role:"
          echo "${AWS_ROLE_ARN}"

          echo ""
          echo "Expected IAM Role Name:"
          echo "${AWS_EXPECTED_ROLE_NAME}"

          echo ""
          echo "OIDC Audience:"
          echo "${AWS_OIDC_AUDIENCE}"

          echo ""
          echo "Role Session:"
          echo "${AWS_ROLE_SESSION_NAME}"

          echo ""
          echo "GitHub Repository:"
          echo "${GITHUB_REPOSITORY}"

          echo ""
          echo "GitHub Ref:"
          echo "${GITHUB_REF}"

          echo ""
          echo "GitHub Branch:"
          echo "${GITHUB_REF_NAME}"

          echo ""
          echo "Terraform Directory:"
          echo "${TF_WORKING_DIRECTORY}"

          echo ""
          echo "Terraform State Bucket:"
          echo "${TF_STATE_BUCKET}"

          echo ""
          echo "Terraform State Key:"
          echo "${TF_STATE_KEY}"

          echo ""
          echo "=================================================="
          echo "CONFIGURATION DISPLAY COMPLETED"
          echo "=================================================="


      # ======================================================
      # STEP 5
      # CONFIGURE AWS CREDENTIALS USING GITHUB OIDC
      # ======================================================

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: ${{ env.AWS_ROLE_SESSION_NAME }}
          audience: ${{ env.AWS_OIDC_AUDIENCE }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}


      # ======================================================
      # STEP 6
      # VERIFY AWS STS IDENTITY
      # ======================================================

      - name: Verify AWS Identity
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "AWS STS IDENTITY"
          echo "=================================================="

          IDENTITY_JSON="$(aws sts get-caller-identity)"

          echo "${IDENTITY_JSON}" | jq .

          ACCOUNT_ID="$(
            echo "${IDENTITY_JSON}" |
              jq -r '.Account'
          )"

          ARN="$(
            echo "${IDENTITY_JSON}" |
              jq -r '.Arn'
          )"

          if [[ "${ACCOUNT_ID}" != "${AWS_ACCOUNT_ID}" ]]; then
            echo ""
            echo "ERROR: Unexpected AWS account."
            echo "Expected: ${AWS_ACCOUNT_ID}"
            echo "Actual:   ${ACCOUNT_ID}"
            exit 1
          fi

          if [[ "${ARN}" != *"${AWS_EXPECTED_ROLE_NAME}"* ]]; then
            echo ""
            echo "ERROR: Unexpected AWS IAM role."
            echo "Expected role: ${AWS_EXPECTED_ROLE_NAME}"
            echo "Actual ARN:    ${ARN}"
            exit 1
          fi

          echo ""
          echo "AWS account verification: PASSED"

          echo ""
          echo "AWS role verification: PASSED"

          echo ""
          echo "AWS OIDC authentication: PASSED"

          echo ""
          echo "=================================================="
          echo "AWS IDENTITY VERIFICATION COMPLETED"
          echo "=================================================="


      # ======================================================
      # STEP 7
      # BOOTSTRAP TERRAFORM STATE BUCKET
      # ======================================================

      - name: Bootstrap Terraform State Bucket
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TERRAFORM STATE BACKEND BOOTSTRAP"
          echo "=================================================="

          echo ""
          echo "State bucket:"
          echo "${TF_STATE_BUCKET}"

          echo ""
          echo "State region:"
          echo "${TF_STATE_REGION}"

          echo ""
          echo "State key:"
          echo "${TF_STATE_KEY}"

          echo ""
          echo "Checking Terraform state bucket..."

          if aws s3api head-bucket \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            2>/dev/null
          then
            echo "Terraform state bucket already exists."
          else
            echo "Terraform state bucket does not exist."
            echo "Creating Terraform state bucket..."

            if [[ "${TF_STATE_REGION}" == "us-east-1" ]]; then
              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${TF_STATE_REGION}"
            else
              aws s3api create-bucket \
                --bucket "${TF_STATE_BUCKET}" \
                --region "${TF_STATE_REGION}" \
                --create-bucket-configuration \
                  LocationConstraint="${TF_STATE_REGION}"
            fi

            echo "Terraform state bucket created."
          fi

          echo ""
          echo "Enabling S3 versioning..."

          aws s3api put-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --versioning-configuration Status=Enabled

          echo ""
          echo "Enabling S3 encryption..."

          aws s3api put-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --server-side-encryption-configuration \
            '{
              "Rules": [
                {
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  }
                }
              ]
            }'

          echo ""
          echo "Blocking public access..."

          aws s3api put-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          echo ""
          echo "Applying bucket tags..."

          aws s3api put-bucket-tagging \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}" \
            --tagging '{
              "TagSet": [
                {
                  "Key": "Name",
                  "Value": "aws-hybrid-iac-lab-terraform-state"
                },
                {
                  "Key": "Project",
                  "Value": "aws-hybrid-iac-lab"
                },
                {
                  "Key": "ManagedBy",
                  "Value": "GitHub-Actions-Bootstrap"
                },
                {
                  "Key": "Purpose",
                  "Value": "Terraform-State"
                },
                {
                  "Key": "Environment",
                  "Value": "dev"
                }
              ]
            }'

          echo ""
          echo "=================================================="
          echo "STATE BUCKET VERIFICATION"
          echo "=================================================="

          echo ""
          echo "Bucket:"

          aws s3api head-bucket \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"

          echo ""
          echo "Versioning:"

          aws s3api get-bucket-versioning \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"

          echo ""
          echo "Encryption:"

          aws s3api get-bucket-encryption \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"

          echo ""
          echo "Public Access Block:"

          aws s3api get-public-access-block \
            --bucket "${TF_STATE_BUCKET}" \
            --region "${TF_STATE_REGION}"

          echo ""
          echo "Terraform state backend bootstrap completed."


      # ======================================================
      # STEP 8
      # SETUP TERRAFORM
      # ======================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}


      # ======================================================
      # STEP 9
      # TERRAFORM INIT
      # ======================================================
      #
      # Initializes the S3 backend.
      #
      # IMPORTANT:
      #
      # This assumes your Terraform configuration contains:
      #
      #   terraform {
      #     backend "s3" {}
      #   }
      #
      # The actual bucket/key/region are supplied here so the
      # backend does not depend on hard-coded credentials.
      #
      # ======================================================

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TERRAFORM INIT"
          echo "=================================================="

          terraform init \
            -input=false \
            -reconfigure \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${TF_STATE_REGION}"

          echo ""
          echo "=================================================="
          echo "TERRAFORM INIT COMPLETED"
          echo "=================================================="


      # ======================================================
      # STEP 10
      # TERRAFORM FORMAT CHECK
      # ======================================================

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          terraform fmt \
            -check \
            -recursive


      # ======================================================
      # STEP 11
      # TERRAFORM VALIDATE
      # ======================================================

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          terraform validate


      # ======================================================
      # STEP 12
      # TERRAFORM STATE DIAGNOSTIC
      # ======================================================
      #
      # On the FIRST Terraform deployment there may be no
      # Terraform state file yet.
      #
      # IMPORTANT:
      #
      # GitHub Actions executes Bash with:
      #
      #   -e
      #
      # Therefore this command:
      #
      #   terraform state list
      #
      # must NOT be executed as a standalone command when
      # we intentionally expect a possible non-zero exit code.
      #
      # Instead, the command is executed inside an IF
      # conditional so Bash does not terminate the step
      # before we can inspect the exit code.
      #
      # Behavior:
      #
      #   Exit code 0
      #       -> State command succeeded.
      #
      #   Exit code non-zero + no state message
      #       -> Display the real Terraform error and fail.
      #
      #   Exit code non-zero + missing state message
      #       -> Treat as acceptable first deployment.
      #
      # ======================================================

      - name: Terraform State Diagnostic
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TERRAFORM STATE DIAGNOSTIC"
          echo "=================================================="

          STATE_FILE="$(mktemp)"

          cleanup() {
            rm -f "${STATE_FILE}"
          }

          trap cleanup EXIT

          echo ""
          echo "Checking current Terraform state..."

          # --------------------------------------------------
          # IMPORTANT:
          #
          # Run terraform state list inside an IF condition.
          #
          # This prevents GitHub Actions/Bash '-e' from
          # terminating the step before we capture the result.
          # --------------------------------------------------

          if terraform state list > "${STATE_FILE}" 2>&1; then

            STATE_EXIT_CODE=0

          else

            STATE_EXIT_CODE=$?

          fi

          echo ""
          echo "Terraform state command exit code: ${STATE_EXIT_CODE}"

          # --------------------------------------------------
          # EXIT CODE 0
          #
          # Terraform successfully queried the state.
          # --------------------------------------------------

          if [[ "${STATE_EXIT_CODE}" -eq 0 ]]; then

            echo ""
            echo "Terraform state command completed successfully."

            if [[ -s "${STATE_FILE}" ]]; then

              echo ""
              echo "Resources currently recorded in Terraform state:"
              echo "--------------------------------------------------"

              cat "${STATE_FILE}"

            else

              echo ""
              echo "Terraform state exists but currently contains"
              echo "no resources."

            fi

            echo ""
            echo "=================================================="
            echo "TERRAFORM STATE DIAGNOSTIC PASSED"
            echo "=================================================="

            exit 0

          fi

          # --------------------------------------------------
          # NON-ZERO EXIT CODE
          #
          # Display the actual Terraform diagnostic output.
          # --------------------------------------------------

          echo ""
          echo "Terraform returned a non-zero exit code."

          echo ""
          echo "Terraform diagnostic output:"
          echo "--------------------------------------------------"

          cat "${STATE_FILE}"

          echo ""
          echo "--------------------------------------------------"

          # --------------------------------------------------
          # FIRST DEPLOYMENT / EMPTY STATE
          #
          # Terraform can legitimately have no state file
          # before the first successful apply.
          #
          # Check the actual Terraform message rather than
          # blindly accepting every exit code 1.
          # --------------------------------------------------

          if grep -qiE \
            "No state file was found|State management commands require a state file|No state file|state file was found" \
            "${STATE_FILE}"
          then

            echo ""
            echo "=================================================="
            echo "NO TERRAFORM STATE FILE EXISTS YET"
            echo "=================================================="

            echo ""
            echo "This is expected for the first deployment."

            echo ""
            echo "Terraform will create the state after"
            echo "terraform apply."

            echo ""
            echo "Terraform state diagnostic completed successfully."

            exit 0

          fi

          # --------------------------------------------------
          # ANY OTHER ERROR
          #
          # Do NOT hide real backend, authentication,
          # configuration, or state errors.
          # --------------------------------------------------

          echo ""
          echo "=================================================="
          echo "ERROR: TERRAFORM STATE COMMAND FAILED"
          echo "=================================================="

          echo ""
          echo "The failure was NOT identified as a missing"
          echo "initial Terraform state file."

          echo ""
          echo "Terraform diagnostic output:"
          echo "--------------------------------------------------"

          cat "${STATE_FILE}"

          echo ""
          echo "--------------------------------------------------"

          exit "${STATE_EXIT_CODE}"


      # ======================================================
      # STEP 13
      # DISCOVER AMAZON LINUX 2023 AMI
      # ======================================================
      #
      # Dynamically discovers the latest Amazon Linux 2023
      # x86_64 AMI from AWS Systems Manager Parameter Store.
      #
      # The discovered value is exported as:
      #
      #   TF_VAR_ami_id
      #
      # Terraform automatically maps:
      #
      #   TF_VAR_ami_id
      #
      # to:
      #
      #   var.ami_id
      #
      # IMPORTANT:
      #
      # This step occurs AFTER AWS authentication because
      # it calls AWS Systems Manager.
      #
      # It occurs BEFORE terraform plan.
      #
      # ======================================================

      - name: Discover Amazon Linux 2023 AMI
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "DISCOVER AMAZON LINUX 2023 AMI"
          echo "=================================================="

          SSM_AMI_PARAMETER="/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"

          echo ""
          echo "SSM AMI Parameter:"
          echo "${SSM_AMI_PARAMETER}"

          echo ""
          echo "AWS Region:"
          echo "${AWS_REGION}"

          AMI_ID="$(
            aws ssm get-parameter \
              --name "${SSM_AMI_PARAMETER}" \
              --query "Parameter.Value" \
              --output text \
              --region "${AWS_REGION}"
          )"

          if [[ -z "${AMI_ID}" || "${AMI_ID}" == "None" ]]; then
            echo ""
            echo "ERROR: Failed to discover Amazon Linux 2023 AMI."
            echo ""
            echo "SSM parameter:"
            echo "${SSM_AMI_PARAMETER}"
            exit 1
          fi

          if [[ ! "${AMI_ID}" =~ ^ami-[0-9a-fA-F]{8,}$ ]]; then
            echo ""
            echo "ERROR: Invalid AMI ID returned by AWS."
            echo ""
            echo "Returned value:"
            echo "${AMI_ID}"
            exit 1
          fi

          echo ""
          echo "Amazon Linux 2023 AMI:"
          echo "${AMI_ID}"

          # --------------------------------------------------
          # Export AMI for subsequent Terraform steps.
          #
          # GitHub Actions makes GITHUB_ENV variables available
          # to subsequent steps.
          #
          # Terraform automatically maps:
          #
          #   TF_VAR_ami_id
          #
          # to:
          #
          #   var.ami_id
          # --------------------------------------------------

          echo "TF_VAR_ami_id=${AMI_ID}" >> "${GITHUB_ENV}"

          echo ""
          echo "Terraform variable exported:"
          echo "TF_VAR_ami_id=${AMI_ID}"

          echo ""
          echo "=================================================="
          echo "AMAZON LINUX 2023 AMI DISCOVERY COMPLETED"
          echo "=================================================="


      # ======================================================
      # STEP 14
      # TERRAFORM PLAN
      # ======================================================

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TERRAFORM PLAN"
          echo "=================================================="

          echo ""
          echo "Terraform directory:"
          echo "${TF_WORKING_DIRECTORY}"

          echo ""
          echo "Plan file:"
          echo "${TF_PLAN_FILE}"

          echo ""
          echo "AMI variable:"
          echo "${TF_VAR_ami_id}"

          # --------------------------------------------------
          # Generate the exact plan that will be applied.
          # --------------------------------------------------

          terraform plan \
            -input=false \
            -out="${TF_PLAN_FILE}"

          echo ""
          echo "=================================================="
          echo "TERRAFORM PLAN COMPLETED"
          echo "=================================================="


      # ======================================================
      # STEP 15
      # TERRAFORM APPLY + LIVE CLOUDFORMATION MONITOR
      # ======================================================
      #
      # PURPOSE
      # ------------------------------------------------------
      #
      # Terraform Apply runs while a separate PowerShell
      # CloudFormation monitor observes the CloudFormation
      # root stack and nested stacks.
      #
      # Terraform remains authoritative.
      #
      # The monitor is READ-ONLY.
      #
      # The monitor:
      #
      #   - waits for the CloudFormation stack
      #   - detects stack status changes
      #   - detects nested stacks
      #   - captures CloudFormation events
      #   - detects failed resources
      #   - captures failure reasons
      #   - classifies common failures
      #   - saves diagnostic JSON/log files
      #
      # ======================================================

      - name: Terraform Apply With Live CloudFormation Diagnostics
        if: ${{ env.TF_AUTO_APPROVE == 'true' }}
        working-directory: ${{ env.TF_WORKING_DIRECTORY }}
        shell: pwsh
        run: |

          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "TERRAFORM APPLY + LIVE CLOUDFORMATION DIAGNOSTICS"
          Write-Host "============================================================"

          # ----------------------------------------------------
          # Build CloudFormation root stack name.
          #
          # Expected:
          #
          # aws-hybrid-iac-lab-dev-MainStack
          # ----------------------------------------------------

          $MainStackName = "${env:PROJECT_NAME}-${env:ENVIRONMENT}-MainStack"

          Write-Host ""
          Write-Host "CloudFormation Stack:"
          Write-Host $MainStackName

          Write-Host ""
          Write-Host "AWS Region:"
          Write-Host $env:AWS_REGION

          # ----------------------------------------------------
          # Verify monitor script exists.
          #
          # This prevents a confusing Start-Process failure.
          # ----------------------------------------------------

          $MonitorScript = Join-Path `
            $env:GITHUB_WORKSPACE `
            "scripts/Monitor-CloudFormation.ps1"

          Write-Host ""
          Write-Host "CloudFormation monitor script:"
          Write-Host $MonitorScript

          if (-not (Test-Path -LiteralPath $MonitorScript)) {

            Write-Host ""
            Write-Host "ERROR: CloudFormation monitor script was not found."
            Write-Host ""
            Write-Host "Expected file:"
            Write-Host $MonitorScript

            exit 1
          }

          # ----------------------------------------------------
          # Diagnostic directory.
          #
          # Use an absolute path so the monitor and artifact
          # upload always refer to the same directory.
          # ----------------------------------------------------

          $DiagnosticDirectory = Join-Path `
            $env:GITHUB_WORKSPACE `
            "cloudformation-live-diagnostics"

          Write-Host ""
          Write-Host "Diagnostic directory:"
          Write-Host $DiagnosticDirectory

          # ----------------------------------------------------
          # Create diagnostic directory before starting monitor.
          # ----------------------------------------------------

          New-Item `
            -ItemType Directory `
            -Path $DiagnosticDirectory `
            -Force |
            Out-Null

          # ====================================================
          # START CLOUDFORMATION MONITOR
          # ====================================================

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "STARTING CLOUDFORMATION LIVE MONITOR"
          Write-Host "============================================================"

          # ----------------------------------------------------
          # Start the PowerShell monitor as a background process.
          #
          # The monitor inherits the AWS credentials configured
          # earlier by aws-actions/configure-aws-credentials.
          #
          # The monitor itself does not modify AWS resources.
          # ----------------------------------------------------

          $MonitorProcess = Start-Process `
            -FilePath "pwsh" `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -ArgumentList @(
              "-NoProfile"
              "-NonInteractive"
              "-File"
              $MonitorScript
              "-StackName"
              $MainStackName
              "-Region"
              $env:AWS_REGION
              "-PollingIntervalSeconds"
              "3"
              "-LogDirectory"
              $DiagnosticDirectory
            ) `
            -PassThru `
            -NoNewWindow

          if ($null -eq $MonitorProcess) {

            Write-Host ""
            Write-Host "ERROR: Failed to start CloudFormation monitor."

            exit 1
          }

          Write-Host ""
          Write-Host "CloudFormation monitor PID:"
          Write-Host $MonitorProcess.Id

          # ----------------------------------------------------
          # Give the monitor a short amount of time to initialize.
          # ----------------------------------------------------

          Start-Sleep -Seconds 2

          # ====================================================
          # TERRAFORM APPLY
          # ====================================================

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "STARTING TERRAFORM APPLY"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Terraform working directory:"
          Write-Host $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "Terraform plan:"
          Write-Host $env:TF_PLAN_FILE

          # ----------------------------------------------------
          # Apply the exact plan generated by Step 14.
          # ----------------------------------------------------

          terraform apply `
            -input=false `
            -auto-approve `
            $env:TF_PLAN_FILE

          # ----------------------------------------------------
          # IMPORTANT:
          #
          # Capture Terraform's exit code immediately.
          # Do not execute another external command before this.
          # ----------------------------------------------------

          $TerraformExitCode = $LASTEXITCODE

          # ====================================================
          # TERRAFORM FINISHED
          # ====================================================

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "TERRAFORM APPLY FINISHED"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Terraform exit code:"
          Write-Host $TerraformExitCode

          # ====================================================
          # ALLOW FINAL CLOUDFORMATION EVENTS
          # ====================================================

          Write-Host ""
          Write-Host "Allowing CloudFormation monitor to capture final events..."

          Start-Sleep -Seconds 5

          # ====================================================
          # STOP CLOUDFORMATION MONITOR
          # ====================================================

          if (
            $null -ne $MonitorProcess -and
            -not $MonitorProcess.HasExited
          ) {

            Write-Host ""
            Write-Host "Stopping CloudFormation live monitor..."

            Stop-Process `
              -Id $MonitorProcess.Id `
              -Force `
              -ErrorAction SilentlyContinue

            # --------------------------------------------------
            # Give the operating system a moment to release the
            # monitor process and finish writing the log.
            # --------------------------------------------------

            Start-Sleep -Seconds 1
          }

          # ====================================================
          # DISPLAY CLOUDFORMATION DIAGNOSTICS
          # ====================================================

          Write-Host ""
          Write-Host "################################################################"
          Write-Host "# COMPLETE CLOUDFORMATION LIVE DIAGNOSTIC"
          Write-Host "################################################################"

          if (Test-Path -LiteralPath $DiagnosticDirectory) {

            $DiagnosticFiles = Get-ChildItem `
              -Path $DiagnosticDirectory `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue

            if ($DiagnosticFiles.Count -eq 0) {

              Write-Host ""
              Write-Host "WARNING: Diagnostic directory contains no files."

            }
            else {

              foreach ($File in $DiagnosticFiles) {

                Write-Host ""
                Write-Host "------------------------------------------------------------"
                Write-Host "Diagnostic file:"
                Write-Host $File.FullName
                Write-Host "------------------------------------------------------------"

                Get-Content `
                  -LiteralPath $File.FullName `
                  -ErrorAction SilentlyContinue |
                  Write-Host
              }
            }

          }
          else {

            Write-Host ""
            Write-Host "WARNING: Diagnostic directory was not created."
          }

          # ====================================================
          # FINAL TERRAFORM RESULT
          # ====================================================

          Write-Host ""
          Write-Host "################################################################"
          Write-Host "# TERRAFORM APPLY RESULT"
          Write-Host "################################################################"

          Write-Host ""
          Write-Host "Terraform exit code:"
          Write-Host $TerraformExitCode

          if ($TerraformExitCode -eq 0) {

            Write-Host ""
            Write-Host "============================================================"
            Write-Host "TERRAFORM APPLY SUCCEEDED"
            Write-Host "============================================================"

          }
          else {

            Write-Host ""
            Write-Host "============================================================"
            Write-Host "TERRAFORM APPLY FAILED"
            Write-Host "============================================================"

            Write-Host ""
            Write-Host "CloudFormation diagnostics were captured."

          }

          # ====================================================
          # CRITICAL
          # ====================================================
          #
          # Terraform remains authoritative.
          #
          # The CloudFormation monitor MUST NOT change the
          # Terraform result.
          #
          # Return Terraform's original exit code.
          #
          # ====================================================

          exit $TerraformExitCode


      # ======================================================
      # STEP 16
      # UPLOAD CLOUDFORMATION LIVE DIAGNOSTICS
      # ======================================================

      - name: Upload CloudFormation Live Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudformation-live-diagnostics
