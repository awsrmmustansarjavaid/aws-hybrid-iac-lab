# ==========================================================

# HYBRID TERRAFORM + CLOUDFORMATION + DOCKER + KUBERNETES

# AWS LAB — MAIN DEPLOYMENT WORKFLOW

# ==========================================================

#

# Purpose:

# This is the CENTRAL deployment workflow for the lab.

#

# It does not contain the actual Terraform, Docker, or

# Kubernetes deployment commands.

#

# Instead, it calls three reusable workflows:

#

# 1. terraform.yml

# 2. docker.yml

# 3. kubernetes.yml

#

# Deployment flow:

#

# GitHub Push / Manual Run

# |

# v

# main-deploy.yaml

# |

# +--------------------+

# |                    |

# v                    |

# Terraform                 |

# + CloudFormation          |

# |                    |

# v                    |

# AWS Infrastructure        |

# |                    |

# v                    |

# Docker                  |

# + ECR                   |

# |                    |

# v                    |

# Kubernetes               |

# + Amazon EKS              |

# |                    |

# v                    |

# Application               |

#

# ==========================================================

# ==========================================================

# WORKFLOW NAME

# ==========================================================

name: Main Deployment

# ==========================================================

# GITHUB ACTIONS PERMISSIONS

# ==========================================================

#

# IMPORTANT:

#

# This section fixes the following error:

#

# "The workflow is requesting 'id-token: write',

# but is only allowed 'id-token: none'."

#

# Terraform uses GitHub OIDC authentication to obtain

# temporary AWS credentials through AWS STS.

#

# Therefore GitHub must be allowed to issue an OIDC token.

#

# contents: read

# Allows the workflow to read repository contents.

#

# id-token: write

# Allows GitHub Actions to request an OIDC token.

#

# This permission is inherited by the reusable workflows:

#

# terraform.yml

# docker.yml

# kubernetes.yml

#

# ==========================================================

permissions:
contents: read
id-token: write

# ==========================================================

# WORKFLOW TRIGGERS

# ==========================================================

on:

# --------------------------------------------------------

# AUTOMATIC DEPLOYMENT

# --------------------------------------------------------

#

# The workflow automatically starts whenever code is

# pushed to the main branch.

#

push:
branches:
- main

# --------------------------------------------------------

# MANUAL DEPLOYMENT

# --------------------------------------------------------

#

# Allows you to manually start the deployment from:

#

# GitHub

# -> Actions

# -> Main Deployment

# -> Run workflow

#

workflow_dispatch:

# ==========================================================

# JOBS

# ==========================================================

jobs:

# ========================================================

# 1. TERRAFORM + CLOUDFORMATION

# ========================================================

#

# This job calls the reusable Terraform workflow.

#

# Terraform is responsible for creating/updating the

# AWS infrastructure.

#

# Depending on your terraform.yml implementation,

# this can also deploy CloudFormation resources/stacks.

#

# Terraform runs FIRST because the infrastructure must

# exist before Docker and Kubernetes deployment.

#

# ========================================================

terraform:


# ------------------------------------------------------
# CALL REUSABLE TERRAFORM WORKFLOW
# ------------------------------------------------------
#
# The workflow must exist at:
#
# .github/workflows/terraform.yml
#
uses: ./.github/workflows/terraform.yml


# ------------------------------------------------------
# PASS GITHUB SECRETS
# ------------------------------------------------------
#
# Pass all available repository/environment secrets
# allowed for inheritance to the reusable workflow.
#
# IMPORTANT:
#   Do NOT write:
#
#       secrets: inherit |
#
# Correct syntax is:
#
#       secrets: inherit
#
secrets: inherit


# ========================================================

# 2. DOCKER + AMAZON ECR

# ========================================================

#

# Docker must run AFTER Terraform.

#

# Terraform may create AWS resources required by the

# Docker deployment, such as:

#

# - Amazon ECR repository

# - IAM resources

# - Networking

# - Supporting AWS infrastructure

#

# Therefore Docker depends on the Terraform job.

#

# ========================================================

docker:


# ------------------------------------------------------
# DEPENDENCY
# ------------------------------------------------------
#
# Docker starts only after Terraform successfully
# completes.
#
needs:
  - terraform


# ------------------------------------------------------
# CALL REUSABLE DOCKER WORKFLOW
# ------------------------------------------------------
#
# The workflow must exist at:
#
# .github/workflows/docker.yml
#
uses: ./.github/workflows/docker.yml


# ------------------------------------------------------
# PASS GITHUB SECRETS
# ------------------------------------------------------

secrets: inherit


# ========================================================

# 3. KUBERNETES + AMAZON EKS

# ========================================================

#

# Kubernetes is the FINAL deployment stage.

#

# It runs only after:

#

# 1. Terraform succeeds

# 2. Docker/ECR succeeds

#

# This guarantees that:

#

# AWS infrastructure exists

# +

# Docker image has been built/pushed

# +

# EKS deployment can use that image

#

# ========================================================

kubernetes:


# ------------------------------------------------------
# DEPENDENCIES
# ------------------------------------------------------
#
# Kubernetes waits for BOTH Terraform and Docker.
#
needs:
  - terraform
  - docker


# ------------------------------------------------------
# CALL REUSABLE KUBERNETES WORKFLOW
# ------------------------------------------------------
#
# The workflow must exist at:
#
# .github/workflows/kubernetes.yml
#
uses: ./.github/workflows/kubernetes.yml


# ------------------------------------------------------
# PASS GITHUB SECRETS
# ------------------------------------------------------

secrets: inherit


# ==========================================================

# END OF MAIN DEPLOYMENT WORKFLOW

# ==========================================================

#

# FINAL DEPLOYMENT ORDER:

#

# GitHub

# |

# v

# main-deploy.yaml

# |

# v

# ┌───────────────┐

# │   Terraform   │

# │ + CloudFormation

# └───────┬───────┘

# |

# v

# ┌───────────────┐

# │ Docker + ECR  │

# └───────┬───────┘

# |

# v

# ┌───────────────┐

# │ Kubernetes/EKS│

# └───────┬───────┘

# |

# v

# Application

#

# ==========================================================
